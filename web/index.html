art of the EU and makes laws for its members\nE: The **Council of Europe** protects **human rights**; it draws up conventions such as the **ECHR** but **cannot make laws**.\n\nQ: How many permanent members does the UN Security Council have?\n+ Five\n- Three\n- Ten\n- Fifteen\nE: The Security Council has **15 members**; the **UK is one of five permanent members**.\n\nQ: What is the purpose of NATO?\n+ Members agree to help each other if they come under attack\n- To promote free trade in Europe\n- To protect human rights\n- To help former British colonies\nE: **NATO** is a group of **European and North American** countries that help each other if attacked.\n\nQ: When did the UK sign the European Convention on Human Rights?\n+ 1950\n- 1945\n- 1998\n- 1973\nE: The UK was **one of the first** to sign the ECHR, in **1950**.\n\nQ: Which Act made the European Convention on Human Rights part of UK law?\n+ The Human Rights Act 1998\n- The Bill of Rights 1689\n- The Equality Act 2010\n- The Magna Carta\nE: The **Human Rights Act 1998** incorporated the ECHR into UK law.\n\nQ: Which TWO rights are in the European Convention on Human Rights?\n+ Right to a fair trial\n+ Freedom of thought, conscience and religion\n- Right to free housing\n- Right to a job\nE: The ECHR includes the **right to life**, **prohibition of torture**, **right to a fair trial** and **freedom of thought and expression**, among others.\n\nQ: A husband who forces his wife to have sex can be charged with rape.\n+ True\n- False\nE: Any man who forces a woman to have sex, **including her husband**, can be charged with **rape**.\n\nQ: Is female genital mutilation (FGM) legal in the UK?\n+ No, it is a criminal offence\n- Yes, if the family agrees\n- Yes, if done abroad\n- Yes, for adults only\nE: **FGM is illegal**, and **taking a girl abroad** for FGM is also a criminal offence.\n\nQ: Which statement is correct?\n+ Arranged marriages where both people agree are acceptable in the UK\n- Arranged marriages are illegal in the UK\nE: **Arranged** marriages with consent are fine; **forced marriage** is a **criminal offence**.\n\nQ: What is the maximum jail sentence for breaching a Forced Marriage Protection Order?\n+ Two years\n- Six months\n- Five years\n- Ten years\nE: Anyone breaching an order can be jailed for **up to two years**.\n\nQ: Which TWO are examples of civil law?\n+ Disputes between landlords and tenants\n+ Disputes about faulty goods\n- Carrying a weapon\n- Selling drugs\nE: **Civil law** settles disputes: **housing, consumer rights, employment and debt**.\n\nQ: Which TWO are criminal offences?\n+ Selling tobacco to someone under 18\n+ Carrying a weapon for self-defence\n- Not paying back money you owe to a friend\n- A dispute with your landlord about repairs\nE: These are **criminal**. Debts and landlord disputes are **civil** matters.\n\nQ: It is legal to carry a knife for self-defence.\n- True\n+ False\nE: Carrying **a weapon of any kind** is a criminal offence, **even for self-defence**.\n\nQ: Which TWO are duties of the police?\n+ Protect life and property\n+ Prevent and detect crime\n- Make new laws\n- Decide sentences\nE: Police **protect life and property, prevent disturbances (keep the peace) and prevent and detect crime**.\n\nQ: Who heads each police force?\n+ A Chief Constable\n- The Home Secretary\n- The Mayor\n- A Police and Crime Commissioner\nE: Police forces are headed by **Chief Constables** and are **independent of government**.\n\nQ: When were Police and Crime Commissioners first elected in England and Wales?\n+ November 2012\n- May 2010\n- November 2015\n- May 2005\nE: The public first elected **PCCs** in **November 2012**.\n\nQ: Which TWO are responsibilities of Police and Crime Commissioners?\n+ Setting local police priorities\n+ Appointing the Chief Constable\n- Deciding court sentences\n- Making national laws\nE: **PCCs** set local priorities and budgets and **appoint the Chief Constable**.\n\nQ: Who supports police officers by patrolling the streets and working with the public?\n+ Police Community Support Officers (PCSOs)\n- Magistrates\n- Special Advisers\n- Traffic wardens\nE: **PCSOs** patrol, work with the public and support officers at crime scenes and events.\n\nQ: Which body handles independent complaints about the police in Northern Ireland?\n+ The Police Ombudsman\n- The Independent Police Complaints Commission\n- The Police Complaints Commissioner for Scotland\n- The Home Office\nE: In NI it is the **Police Ombudsman**; in England and Wales the **IPCC**; in Scotland the **Police Complaints Commissioner**.\n\nQ: What does \"extremism\" mean?\n+ Vocal or active opposition to fundamental British values\n- Strong support for a sports team\n- Belonging to any religion\n- Voting for a minor political party\nE: **Extremism** is **vocal or active opposition to fundamental British values**.\n\nQ: Which statement is correct?\n+ The government cannot interfere with the judiciary\n- The government can tell judges how to decide cases\nE: Judges interpret the law and ensure fair trials – **the government cannot interfere**.\n\nQ: In England and Wales, where are most minor criminal cases dealt with?\n+ Magistrates' Court\n- Crown Court\n- County Court\n- High Court\nE: Most minor criminal cases go to a **Magistrates' Court** (a **Justice of the Peace Court** in Scotland).\n\nQ: In Scotland, where are minor criminal offences dealt with?\n+ Justice of the Peace Court\n- Sheriff Court\n- Magistrates' Court\n- Court of Session\nE: In Scotland minor offences go to a **Justice of the Peace Court**.\n\nQ: Which TWO statements about magistrates in England and Wales are correct?\n+ They usually work unpaid\n+ They do not need legal qualifications\n- They are always senior lawyers\n- They are elected by the public\nE: Magistrates are local people who usually work **unpaid** and **need no legal qualifications**.\n\nQ: Where are serious criminal offences tried in England, Wales and Northern Ireland?\n+ Crown Court\n- Magistrates' Court\n- County Court\n- Youth Court\nE: Serious offences are tried before a **judge and jury** in a **Crown Court**.\n\nQ: How many members are there on a jury in England, Wales and Northern Ireland?\n+ 12\n- 10\n- 15\n- 20\nE: A jury has **12 members** in England, Wales and NI, and **15 in Scotland**.\n\nQ: How many people are on a jury in Scotland?\n+ 15\n- 12\n- 10\n- 9\nE: A Scottish jury has **15 members**.\n\nQ: Which verdict can a jury give in Scotland but not in England?\n+ Not proven\n- Not guilty\n- Guilty\n- Innocent\nE: In Scotland a third verdict of **\"not proven\"** is possible.\n\nQ: How are jury members chosen?\n+ At random from the electoral register\n- By the judge\n- By the defendant's lawyer\n- From volunteers\nE: Jury members are chosen **at random from the local electoral register**.\n\nQ: In England, Wales and Northern Ireland, what ages are dealt with by Youth Courts?\n+ 10 to 17\n- 12 to 18\n- 8 to 16\n- 14 to 21\nE: The **Youth Court** handles accused people aged **10 to 17**.\n\nQ: Which TWO are true of Youth Courts?\n+ Members of the public are not allowed in\n+ The young person's name cannot be published\n- They are always held in front of a jury\n- Parents are not allowed to attend\nE: The **public cannot attend**, and the accused's **name or photo cannot be published**. Parents are expected to attend.\n\nQ: What system is used in Scotland to deal with children who commit offences?\n+ The Children's Hearings System\n- Youth conferencing\n- The Youth Court\n- The Magistrates' Court\nE: Scotland uses the **Children's Hearings System**; Northern Ireland uses **youth conferencing**.\n\nQ: Which court deals with civil disputes such as divorce and debt in England and Wales?\n+ County Court\n- Crown Court\n- Magistrates' Court\n- Youth Court\nE: **County Courts** handle civil disputes – money owed, personal injury, family matters, contracts and **divorce**.\n\nQ: Where are serious civil cases heard in Scotland?\n+ The Court of Session in Edinburgh\n- The High Court in London\n- The Sheriff Court in Glasgow\n- The Justice of the Peace Court\nE: Serious civil cases go to the **Court of Session in Edinburgh** (the **High Court** elsewhere).\n\nQ: What is the small claims limit in England and Wales?\n+ £10,000\n- £5,000\n- £1,000\n- £25,000\nE: Small claims are under **£10,000 in England and Wales** and **£5,000 in Scotland and NI**.\n\nQ: What is the small claims limit in Scotland and Northern Ireland?\n+ £5,000\n- £10,000\n- £3,000\n- £15,000\nE: In **Scotland and Northern Ireland** the limit is **£5,000**.\n\nQ: How are solicitors' charges usually calculated?\n+ By how much time they spend on a case\n- By a fixed government fee\n- By the outcome of the case\n- They are always free\nE: Solicitors usually charge by **time spent**, so find out costs at the start.\n\nQ: Which TWO types of income is income tax paid on?\n+ Wages from employment\n+ Profits from self-employment\n- Winnings from the National Lottery\n- Gifts from family\nE: Income tax is paid on **wages, self-employment profits, taxable benefits, pensions** and income from **property, savings and dividends**.\n\nQ: What does PAYE stand for?\n+ Pay As You Earn\n- Pay All Your Earnings\n- Public Annual Yearly Expenses\n- Pay After Your Employment\nE: Under **PAYE** your employer deducts tax and pays it to **HMRC**.\n\nQ: Which government department collects taxes?\n+ HM Revenue & Customs (HMRC)\n- The Department for Work and Pensions\n- The Treasury\n- The Home Office\nE: **HMRC** collects taxes.\n\nQ: How do self-employed people pay their tax?\n+ Through self-assessment\n- Through PAYE\n- Through their bank automatically\n- They do not pay tax\nE: The **self-employed** pay tax through **self-assessment**, completing a **tax return**.\n\nQ: Which TWO are paid for by National Insurance Contributions?\n+ The state retirement pension\n+ The National Health Service\n- Local council services\n- Roads\nE: NI Contributions pay for **state benefits**, the **state pension** and the **NHS**.\n\nQ: When are young people in the UK sent a National Insurance number?\n+ Just before their 16th birthday\n- On their 18th birthday\n- When they start their first job\n- When they finish school\nE: Young people are sent an **NI number just before their 16th birthday**.\n\nQ: A National Insurance number on its own proves you have the right to work in the UK.\n- True\n+ False\nE: An NI number **does not on its own prove** your right to work.\n\nQ: What is the minimum age to drive a car in the UK?\n+ 17\n- 16\n- 18\n- 21\nE: You must be **17** to drive a car or motorcycle; **16** for a **moped**.\n\nQ: What is the minimum age to ride a moped?\n+ 16\n- 15\n- 17\n- 18\nE: You need to be at least **16** to ride a moped.\n\nQ: Until what age can drivers use their driving licence before renewing it every three years?\n+ 70\n- 60\n- 65\n- 75\nE: A licence is valid until **70**, then for **three years at a time**.\n\nQ: How long can you use a driving licence from a non-EU country in the UK?\n+ 12 months\n- 6 months\n- 2 years\n- As long as it is valid\nE: A licence from outside the EU (and Iceland, Liechtenstein, Norway) can be used for **12 months**.\n\nQ: In Northern Ireland, what must a newly qualified driver display for one year?\n+ An \"R\" plate\n- An \"L\" plate\n- A \"P\" plate\n- A \"N\" plate\nE: New drivers in NI show an **\"R\" plate (restricted)** for **one year**.\n\nQ: When must a vehicle take an MOT test?\n+ Every year once it is over three years old\n- Every year from new\n- Every five years\n- Only when it is sold\nE: Vehicles over **three years old** need an **MOT** every year.\n\nQ: Driving without insurance is a serious criminal offence.\n+ True\n- False\nE: It is a **serious criminal offence** to drive without motor insurance.\n\nQ: Who can be selected for jury service?\n+ Anyone on the electoral register aged 18 to 70\n- Only lawyers\n- Anyone over 16\n- Only people who volunteer\nE: Anyone on the **electoral register** aged **18 to 70** can be asked.\n\nQ: Which TWO are key roles of school governors?\n+ Setting the strategic direction of the school\n+ Monitoring and evaluating school performance\n- Teaching classes\n- Paying teachers' salaries personally\nE: The three roles: **setting strategic direction, ensuring accountability, and monitoring school performance**.\n\nQ: What is the minimum age to become a school governor?\n+ 18\n- 21\n- 25\n- 16\nE: Governors must be **18 or over**, with **no upper age limit**.\n\nQ: You must tell a canvasser how you intend to vote.\n- True\n+ False\nE: **You don't have to tell a canvasser** how you will vote.\n\nQ: Which TWO are ways to volunteer with local services?\n+ Becoming a special constable\n+ Becoming a magistrate\n- Becoming a police chief constable\n- Becoming a civil servant\nE: You can become a **special constable**, a **lay representative** or a **magistrate**.\n\nQ: How long does it take to give blood?\n+ About an hour\n- About ten minutes\n- About three hours\n- A whole day\nE: Giving blood takes **about an hour**.\n\nQ: Which charity works with children?\n+ NSPCC\n- Age UK\n- Shelter\n- PDSA\nE: The **NSPCC** works with children. Age UK helps older people; Shelter the homeless; PDSA animals.\n\nQ: Which TWO charities work with homeless people?\n+ Crisis\n+ Shelter\n- Age UK\n- Cancer Research UK\nE: **Crisis** and **Shelter** work with the homeless.\n\nQ: What age group is the National Citizen Service programme for?\n+ 16- and 17-year-olds\n- 12- and 13-year-olds\n- 18- to 25-year-olds\n- Over 65s\nE: The **National Citizen Service** is for **16- and 17-year-olds**.\n\nQ: Which TWO are good ways to help the environment?\n+ Recycling as much waste as you can\n+ Walking or using public transport\n- Driving to local shops\n- Buying products from far away\nE: **Recycle**, **shop locally** and **walk or use public transport** to reduce pollution.\n\nQ: Which statement is correct?\n+ Shopping locally helps reduce your carbon footprint\n- Shopping locally increases your carbon footprint\nE: Local products **don't travel as far**, reducing your **carbon footprint**.\n"]};

/* ---------- content parsing (mirrors the Android ContentParser) ---------- */
function parseChapter(n, raw) {
  const ch = { number: n, title: "", subtitle: "", intro: "", sections: [] };
  let secTitle = null, blocks = [], para = [], bullets = [], quote = [], table = [], inRem = false, rem = [];
  const flushPara = () => { if (para.length) { blocks.push({ t: "p", text: para.join(" ") }); para = []; } };
  const flushBullets = () => { if (bullets.length) { blocks.push({ t: "ul", items: bullets }); bullets = []; } };
  const flushTable = () => { if (table.length) { blocks.push({ t: "table", rows: table }); table = []; } };
  const flushInline = () => { flushPara(); flushBullets(); flushTable(); };
  const flushSection = () => {
    flushInline();
    if (secTitle !== null) ch.sections.push({ id: n + "." + (ch.sections.length + 1), title: secTitle, blocks, remember: rem });
    blocks = []; secTitle = null; inRem = false; rem = [];
  };
  for (const rawLine of raw.split("\n")) {
    const line = rawLine.trim();
    if (line.startsWith("@title ")) ch.title = line.slice(7).trim();
    else if (line.startsWith("@subtitle ")) ch.subtitle = line.slice(10).trim();
    else if (line.startsWith("@intro ")) ch.intro = line.slice(7).trim();
    else if (line.startsWith("@section ")) { flushSection(); secTitle = line.slice(9).trim(); }
    else if (line === "@remember") { flushInline(); inRem = true; }
    else if (inRem) {
      if (line.startsWith("- ")) rem.push({ id: "f" + n + "." + (ch.sections.length + 1) + "." + rem.length, text: line.slice(2).trim() });
    }
    else if (!line) flushInline();
    else if (line.startsWith("## ")) { flushInline(); blocks.push({ t: "h", text: line.slice(3).trim() }); }
    else if (line.startsWith("- ")) { flushPara(); flushTable(); bullets.push(line.slice(2).trim()); }
    else if (line.startsWith("> ")) {
      flushInline();
      const body = line.slice(2), i = body.indexOf("::");
      blocks.push(i > 0 ? { t: "person", name: body.slice(0, i).trim(), text: body.slice(i + 2).trim() } : { t: "person", name: body.trim(), text: "" });
    }
    else if (line.startsWith("! ")) { flushInline(); blocks.push({ t: "tip", text: line.slice(2).trim() }); }
    else if (line.startsWith("\"— ")) { flushInline(); blocks.push({ t: "quote", lines: quote, source: line.slice(3).trim() }); quote = []; }
    else if (line.startsWith("\" ")) { flushInline(); quote.push(line.slice(2).trim()); }
    else if (line.startsWith("| ")) {
      flushPara(); flushBullets();
      const parts = line.replace(/^\|+|\|+$/g, "").split("|").map(s => s.trim());
      table.push([parts[0], parts[1] || ""]);
    }
    else { flushBullets(); flushTable(); para.push(line); }
  }
  flushSection();
  return ch;
}

function parseCards(raw) {
  const cards = []; let chapter = 0, index = 0;
  for (const rawLine of raw.split("\n")) {
    const line = rawLine.trim();
    if (!line) continue;
    if (line.startsWith("# ")) { chapter = parseInt(line.slice(2), 10); index = 0; continue; }
    const sep = line.indexOf(" | ");
    if (sep < 0) continue;
    cards.push({ id: "c" + chapter + "." + index, chapter, front: line.slice(0, sep).trim(), back: line.slice(sep + 3).trim() });
    index++;
  }
  return cards;
}

function parseQuestions(raws) {
  const out = [];
  raws.forEach(raw => {
    let chapter = 0, index = 0, q = null;
    const flush = () => {
      if (q && q.text && q.options.length) { q.id = "q" + chapter + "." + index; q.chapter = chapter; out.push(q); index++; }
      q = null;
    };
    for (const rawLine of raw.split("\n")) {
      const line = rawLine.trim();
      if (line.startsWith("# ")) { flush(); chapter = parseInt(line.slice(2), 10); index = 0; continue; }
      if (!line) { flush(); continue; }
      q = q || { text: "", options: [], correct: [], explanation: "" };
      if (line.startsWith("Q: ")) q.text = line.slice(3).trim();
      else if (line.startsWith("+ ")) { q.correct.push(q.options.length); q.options.push(line.slice(2).trim()); }
      else if (line.startsWith("- ")) q.options.push(line.slice(2).trim());
      else if (line.startsWith("E: ")) q.explanation = line.slice(3).trim();
    }
    flush();
  });
  return out;
}

const CHAPTERS = CONTENT.chapters.map((raw, i) => parseChapter(i + 1, raw));
const SECTIONS = CHAPTERS.flatMap(c => c.sections);
const CARDS = parseCards(CONTENT.cards);
const QUESTIONS = parseQuestions(CONTENT.questions);
const CARD_BY_ID = Object.fromEntries(CARDS.map(c => [c.id, c]));
const Q_BY_ID = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));
const chapterOf = id => CHAPTERS.find(c => c.sections.some(s => s.id === id));
const sectionById = id => SECTIONS.find(s => s.id === id);
const cardsFor = n => CARDS.filter(c => c.chapter === n);
const questionsFor = n => QUESTIONS.filter(q => q.chapter === n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const allFacts = chs => chs.flatMap(c => c.sections.flatMap(s => s.remember));

/** 24 questions split roughly like the real test: mostly history, society and government. */
function mockTest() {
  const quota = { 1: 2, 2: 1, 3: 8, 4: 6, 5: 7 };
  let picked = [];
  for (const ch in quota) picked = picked.concat(shuffle(questionsFor(+ch)).slice(0, quota[ch]));
  const ids = new Set(picked.map(q => q.id));
  picked = picked.concat(shuffle(QUESTIONS.filter(q => !ids.has(q.id))).slice(0, 24 - picked.length));
  return shuffle(picked).map(q => q.id);
}

/* ---------- progress: browser storage, plus the viewer's private store when available ---------- */
const LS_KEY = "uk-study-progress-v1";
const P = { read: new Set(), cards: new Set(), facts: new Set(), missed: new Set(), answered: new Set(), last: null, results: [], scale: 1, updated: 0 };
const SET_KEYS = ["read", "cards", "facts", "missed", "answered"];
let syncState = "device"; // "device" | "account" (claude.ai) | "firebase"

function toPlain() {
  const o = { last: P.last, results: P.results, scale: P.scale, updated: P.updated };
  SET_KEYS.forEach(k => { o[k] = [...P[k]]; });
  return o;
}
function applyPlain(o) {
  if (!o) return;
  SET_KEYS.forEach(k => { P[k] = new Set(Array.isArray(o[k]) ? o[k] : []); });
  P.last = o.last || null;
  P.results = Array.isArray(o.results) ? o.results : [];
  P.scale = typeof o.scale === "number" ? o.scale : 1;
  P.updated = o.updated || 0;
}
try { applyPlain(JSON.parse(localStorage.getItem(LS_KEY) || "null")); } catch (e) { /* storage unavailable */ }

let remote = null, writeChain = Promise.resolve(), writeTimer = null;
function persistLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(toPlain())); } catch (e) { /* storage unavailable */ }
}
function save() {
  P.updated = Date.now();
  persistLocal();
  if (remote) {
    clearTimeout(writeTimer);
    writeTimer = setTimeout(() => {
      const body = toPlain(), target = remote;
      writeChain = writeChain.then(() => target.write(body)).catch(err => {
        if (err && err.code !== "unavailable" && remote === target) { remote = null; syncState = "device"; render(false); }
      });
    }, 1200);
  }
}
function mergeRemote(o) {
  SET_KEYS.forEach(k => { (Array.isArray(o[k]) ? o[k] : []).forEach(v => P[k].add(v)); });
  const seen = new Set(P.results.map(r => r.t));
  (Array.isArray(o.results) ? o.results : []).forEach(r => { if (!seen.has(r.t)) P.results.push(r); });
  P.results.sort((a, b) => a.t - b.t);
  P.results = P.results.slice(-50);
  if ((o.updated || 0) > P.updated) { P.last = o.last || P.last; if (typeof o.scale === "number") P.scale = o.scale; }
}

/* claude.ai: the viewer's private per-user store, when the page is opened as an artifact. */
async function connectAccount() {
  if (FIREBASE_CONFIG || !window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await Promise.race([ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 10000))]);
    if (snap.exists) mergeRemote(snap.data());
    remote = { write: body => ref.set(body) }; syncState = "account";
    save();
    render(false);
  } catch (e) { /* keep device-only progress */ }
}

/* Firebase: sign-in plus a Firestore document per user (users/{uid}), synced live between devices. */
const FB_VERSION = "10.14.1";
const LS_LINK_KEY = "uk-study-linked-uid";
let fb = null, fbUser = null, fbFailed = false, unsubDoc = null;
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src; el.onload = resolve; el.onerror = () => reject(new Error("Could not load " + src));
    document.head.appendChild(el);
  });
}
async function connectFirebase() {
  if (!FIREBASE_CONFIG) return;
  try {
    const base = "https://www.gstatic.com/firebasejs/" + FB_VERSION + "/";
    await loadScript(base + "firebase-app-compat.js");
    await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]);
    firebase.initializeApp(FIREBASE_CONFIG);
    fb = { auth: firebase.auth(), db: firebase.firestore() };
    fb.auth.getRedirectResult().catch(err => showAuthError(err));
    fb.auth.onAuthStateChanged(onFirebaseUser);
  } catch (e) {
    fbFailed = true; render(false);
  }
}
async function onFirebaseUser(user) {
  if (unsubDoc) { unsubDoc(); unsubDoc = null; }
  fbUser = user; remote = null; syncState = "device";
  if (!user) { render(false); return; }
  const ref = fb.db.collection("users").doc(user.uid);
  try {
    const snap = await ref.get();
    const server = snap.exists ? (snap.data() || {}).progress : null;
    let linked = null;
    try { linked = localStorage.getItem(LS_LINK_KEY); } catch (e) { /* storage unavailable */ }
    let push = true;
    if (server) {
      if (linked === user.uid && (server.updated || 0) >= P.updated) { applyPlain(server); persistLocal(); push = false; }
      else mergeRemote(server); // first sign-in on this device: keep progress from both
    }
    try { localStorage.setItem(LS_LINK_KEY, user.uid); } catch (e) { /* storage unavailable */ }
    remote = { write: body => ref.set({ progress: body, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }) };
    syncState = "firebase";
    if (push) save();
    unsubDoc = ref.onSnapshot(s => {
      if (s.metadata.hasPendingWrites || !s.exists) return;
      const p = (s.data() || {}).progress;
      if (p && (p.updated || 0) > P.updated) { applyPlain(p); persistLocal(); render(false); }
    }, () => { /* keep working from local progress */ });
  } catch (e) {
    remote = null; syncState = "device";
  }
  const cur = curScreen();
  if (cur && cur.name === "signin") pop(); else render(false);
}

function showAuthError(err) {

}

async function authSubmit() {
  const s = curScreen();
  if (!fb || !s || s.name !== "signin" || s.busy) return;
  const email = (s.email || "").trim();
  if (!email) { s.error = "Enter your email address."; render(false); return; }
  s.busy = true; s.error = ""; s.info = ""; render(false);
  try {
    if (s.mode === "reset") {
      await fb.auth.sendPasswordResetEmail(email);
      s.busy = false; s.mode = "signin"; s.info = "Check your email for a link to reset your password."; render(false);
    } else if (s.mode === "signup") {
      await fb.auth.createUserWithEmailAndPassword(email, s.password || "");
    } else {
      await fb.auth.signInWithEmailAndPassword(email, s.password || "");
    }
  } catch (err) { showAuthError(err); }
}

/* ---------- quiz ---------- */
function newQuiz(title, ids, mock, continueTo) {
  const items = ids.map(id => Q_BY_ID[id]).filter(Boolean).map(q => {
    const tf = q.options.length === 2 && q.options.includes("True") && q.options.includes("False");
    const order = tf ? q.options.map((_, i) => i) : shuffle(q.options.map((_, i) => i));
    return { q, tf, options: order.map(i => q.options[i]), correct: order.map((o, i) => (q.correct.includes(o) ? i : -1)).filter(i => i >= 0), sel: [], checked: false };
  });
  return { name: "quiz", title, ids, mock, continueTo, items, i: 0, finished: false, left: 45 * 60, showAll: false };
}
const isRight = it => it.sel.length === it.correct.length && it.sel.every(i => it.correct.includes(i));
const fmtTime = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function finishQuiz(s) {
  if (s.finished) return;
  cleanup(s);
  if (s.mock) {
    s.items.forEach(it => recordAnswer(it.q.id, isRight(it)));
    P.results.push({ t: Date.now(), s: s.items.filter(isRight).length, n: s.items.length });
    P.results = P.results.slice(-50);
    save();
  }
  s.finished = true;
  render(true);
}
function recordAnswer(id, ok) { P.answered.add(id); if (ok) P.missed.delete(id); else P.missed.add(id); }

function viewQuiz(s) {
  if (s.finished) return viewResults(s);
  const it = s.items[s.i], q = it.q, multi = q.correct.length > 1;
  const low = s.left < 300;
  let h = topbar(s.title, s.mock ? '<div class="timer' + (low ? " low" : "") + '" id="timer">' + icon("timer") + "<span>" + fmtTime(s.left) + "</span></div>" : "", "quizBack");
  h += '<main class="wrap">';
  if (s.mock) {
    h += '<div class="qdots" id="qdots">' + s.items.map((x, i) =>
      '<button class="qdot' + (i === s.i ? " cur" : x.sel.length === x.correct.length ? " done" : "") + '" data-act="jump" data-arg="' + i + '">' + (i + 1) + "</button>").join("") + "</div>";
  } else {
    h += '<div class="bar-row">' + bar((s.i + (it.checked ? 1 : 0)) / s.items.length) + "<span>" + (s.i + 1) + " / " + s.items.length + "</span></div>";
  }
  h += '<div class="eyebrow" style="margin-top:22px">Question ' + (s.i + 1) + '</div><h2 class="qtext">' + esc(q.text) + "</h2>" +
    '<div class="small" style="margin-top:6px;font-size:14px">' + (multi ? "Select TWO answers" : it.tf ? "Is this statement true or false?" : "Select ONE answer") + "</div>";
  h += '<div class="opts' + (multi ? " multi" : "") + '">' + it.options.map((o, i) => {
    const sel = it.sel.includes(i), right = it.correct.includes(i);
    let cls = "", key = String.fromCharCode(65 + i);
    if (it.checked && right) { cls = " right"; key = icon("check"); }
    else if (it.checked && sel) { cls = " wrong"; key = icon("x"); }
    else if (sel) cls = " sel";
    return '<button class="opt' + cls + '" data-act="opt" data-arg="' + i + '"' + (it.checked ? " disabled" : "") + '><span class="key">' + key + "</span><span>" + esc(o) + "</span></button>";
  }).join("") + "</div>";
  if (it.checked) {
    const ok = isRight(it);
    h += '<div class="explain ' + (ok ? "good" : "bad") + '"><h3>' + (ok ? "Correct" : "Not quite") + "</h3><div>" + hl(q.explanation) + "</div></div>";
  }
  const ready = it.sel.length === it.correct.length;
  h += '<div class="quiz-foot">';
  if (s.mock) {
    h += '<div class="btn-row"><button class="btn btn-outline" data-act="prev"' + (s.i === 0 ? " disabled" : "") + '>Previous</button>' +
      (s.i === s.items.length - 1 ? '<button class="btn btn-primary" data-act="finishAsk">Finish test</button>' : '<button class="btn btn-primary" data-act="next">Next</button>') + "</div>";
  } else {
    h += '<button class="btn btn-primary" data-act="' + (it.checked ? "next" : "check") + '"' + (!it.checked && !ready ? " disabled" : "") + ">" +
      (!it.checked ? "Check answer" : s.i === s.items.length - 1 ? "See results" : "Next question") + "</button>";
  }
  return h + "</div></main>";
}

function viewResults(s) {
  const score = s.items.filter(isRight).length, n = s.items.length, ok = score * 4 >= n * 3;
  const shown = s.showAll ? s.items : s.items.filter(it => !isRight(it));
  let h = topbar(s.title) + '<main class="wrap"><div class="result-top">' +
    ring(score / n, 140, 12, ok ? "var(--ok)" : "var(--bad)", "var(--surface-2)", '<b style="font-size:28px">' + score + "/" + n + '</b><small class="small">' + Math.round(score * 100 / n) + "%</small>") +
    '<div class="verdict ' + (ok ? "good" : "bad") + '">' + (s.mock ? (ok ? "Pass" : "Not a pass yet") : ok ? "Great work" : "Keep practising") + "</div>" +
    '<p class="sub" style="font-size:14px">' + (s.mock ? "You need 18 out of 24 (75%) to pass the real test." : "Wrong answers are saved to “Review mistakes”.") + "</p></div>";
  h += '<div class="stack">';
  if (s.continueTo) h += '<button class="btn btn-primary" data-act="read" data-arg="' + CHAPTERS[s.continueTo - 1].sections[0].id + '" data-replace="1">Continue to Chapter ' + s.continueTo + "</button>";
  h += '<div class="btn-row"><button class="btn btn-outline" data-act="back">Done</button><button class="btn ' + (s.continueTo ? "btn-outline" : "btn-primary") + '" data-act="retry">' + (s.mock ? "New test" : "Try again") + "</button></div>";
  h += '<div style="display:flex;align-items:center;justify-content:space-between"><div class="label">' + (s.showAll ? "All questions" : "Questions to review") + '</div><button class="text-btn-sm" style="font-size:15px;color:var(--primary)" data-act="toggleAll">' + (s.showAll ? "Only mistakes" : "Show all") + "</button></div>";
  if (!shown.length) h += '<p class="sub" style="padding:4px">No mistakes. Every answer was correct.</p>';
  shown.forEach(it => {
    const good = isRight(it);
    h += '<div class="card rv"><div style="display:flex;align-items:center;gap:10px"><span class="dot' + (good ? " ok" : "") + '" style="width:22px;height:22px;' + (good ? "" : "background:var(--bad);color:var(--surface)") + '">' + icon(good ? "check" : "x") + "</span>" +
      '<span class="small" style="font-weight:600">Question ' + (s.items.indexOf(it) + 1) + '</span></div><div class="row-title" style="margin-top:8px">' + esc(it.q.text) + "</div>" +
      (good ? "" : '<div class="yours">Your answer: ' + (it.sel.length ? it.sel.map(i => esc(it.options[i])).join(" · ") : "not answered") + "</div>") +
      '<div class="correct">Correct: ' + it.correct.slice().sort().map(i => esc(it.options[i])).join(" · ") + "</div>" +
      (it.q.explanation ? '<div class="small" style="margin-top:8px">' + hl(it.q.explanation) + "</div>" : "") + "</div>";
  });
  return h + "</div></main>";
}

/* ---------- modal ---------- */
function showModal(title, text, confirmLabel, onConfirm, cancelLabel) {
  const m = document.getElementById("modal");
  m.innerHTML = '<div class="scrim" data-act="modalClose"><div class="dialog" role="dialog" aria-modal="true"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p>" +
    '<div class="acts"><button data-act="modalClose">' + esc(cancelLabel || "Cancel") + '</button><button data-act="modalOk">' + esc(confirmLabel) + "</button></div></div></div>";
  modalOk = onConfirm;
}
let modalOk = null;
function closeModal() { document.getElementById("modal").innerHTML = ""; modalOk = null; }

/* ---------- render ---------- */
const app = document.getElementById("app");
function render(toTop) {
  document.documentElement.style.setProperty("--read-scale", P.scale);
  const s = curScreen();
  let html;
  if (!s) html = viewTabs();
  else if (s.name === "chapter") html = viewChapter(s);
  else if (s.name === "reader") html = viewReader(s);
  else if (s.name === "remember") html = viewRemember(s);
  else if (s.name === "complete") html = viewChapterComplete(s);
  else if (s.name === "signin") html = viewSignin(s);
  else if (s.name === "cards") html = viewCards(s);
  else if (s.name === "quiz") html = viewQuiz(s);
  app.innerHTML = html;
  if (toTop) window.scrollTo(0, 0);
  if (s && s.name === "reader") { P.last = s.id; onScroll(); }
  if (s && s.name === "quiz" && s.mock && !s.finished) {
    const cur = document.querySelector(".qdot.cur");
    if (cur) cur.scrollIntoView({ block: "nearest", inline: "center" });
    if (!s.timer) s.timer = setInterval(() => {
      s.left--;
      const t = document.getElementById("timer");
      if (t) { t.querySelector("span").textContent = fmtTime(Math.max(0, s.left)); t.classList.toggle("low", s.left < 300); }
      if (s.left <= 0) finishQuiz(s);
    }, 1000);
  }
}

function onScroll() {
  const s = curScreen();
  if (!s || s.name !== "reader") return;
  const max = document.documentElement.scrollHeight - innerHeight;
  const frac = max <= 0 ? 1 : Math.min(1, scrollY / max);
  const b = document.getElementById("readbar");
  if (b) b.style.width = frac * 100 + "%";
  if (frac > 0.97 && !P.read.has(s.id)) { P.read.add(s.id); save(); }
}
addEventListener("scroll", onScroll, { passive: true });

/* ---------- actions ---------- */
const actions = {
  tab: el => goTab(el.dataset.arg),
  back: () => pop(),
  menu: () => { menuOpen = !menuOpen; render(false); },
  reset: () => {
    menuOpen = false; render(false);
    showModal("Reset all progress?", "Reading progress, flashcards, ticked facts and test results will be cleared.", "Reset", () => {
      SET_KEYS.forEach(k => P[k].clear()); P.last = null; P.results = []; P.scale = 1; save(); render(false);
    });
  },
  chapter: el => push({ name: "chapter", n: +el.dataset.arg }),
  signin: () => { menuOpen = false; push({ name: "signin", mode: "signin", email: "", password: "", error: "", info: "", busy: false }); },
  signout: () => { menuOpen = false; if (fb) fb.auth.signOut(); },
  authMode: el => { const s = curScreen(); s.mode = el.dataset.arg; s.error = ""; s.info = ""; render(false); },
  google: async () => {
    const s = curScreen();
    if (!fb || s.busy) return;
    const provider = new firebase.auth.GoogleAuthProvider();
    try { await fb.auth.signInWithPopup(provider); }
    catch (err) {
      if (err && (err.code === "auth/popup-blocked" || err.code === "auth/operation-not-supported-in-this-environment")) {
        try { await fb.auth.signInWithRedirect(provider); } catch (e2) { showAuthError(e2); }
      } else showAuthError(err);
    }
  },
  read: el => (el.dataset.replace ? replace : push)({ name: "reader", id: el.dataset.arg }),
  nextSection: el => { P.read.add(curScreen().id); save(); replace({ name: "reader", id: el.dataset.arg }); },
  finishChapter: el => { P.read.add(curScreen().id); save(); replace({ name: "complete", n: +el.dataset.arg }); },
  remember: el => push({ name: "remember", n: el.dataset.arg === "all" ? "all" : +el.dataset.arg }),
  fact: el => {
    const id = el.dataset.arg;
    if (P.facts.has(id)) P.facts.delete(id); else P.facts.add(id);
    save(); render(false);
  },
  scale: el => { P.scale = Math.max(0.85, Math.min(1.4, Math.round((P.scale + 0.1 * +el.dataset.arg) * 100) / 100)); save(); render(false); },
  chapterTest: el => {
    const n = +el.dataset.arg;
    replace(newQuiz("Chapter " + n + " test", shuffle(questionsFor(n)).slice(0, 20).map(q => q.id), false, n < CHAPTERS.length ? n + 1 : null));
  },
  cardsStudy: () => {
    const learning = CARDS.filter(c => !P.cards.has(c.id));
    push({ name: "cards", title: "Study session", ids: shuffle(learning.length ? learning : CARDS).slice(0, 30).map(c => c.id), i: 0, missed: [] });
  },
  cardsAll: () => push({ name: "cards", title: "All cards", ids: shuffle(CARDS).map(c => c.id), i: 0, missed: [] }),
  cardsChapter: el => push({ name: "cards", title: "Chapter " + el.dataset.arg, ids: shuffle(cardsFor(+el.dataset.arg)).map(c => c.id), i: 0, missed: [] }),
  flip: () => { const f = document.getElementById("flash"); if (f) f.classList.toggle("flipped"); },
  cardYes: () => { const s = curScreen(); P.cards.add(s.ids[s.i]); save(); s.i++; render(false); },
  cardNo: () => { const s = curScreen(); P.cards.delete(s.ids[s.i]); s.missed.push(s.ids[s.i]); save(); s.i++; render(false); },
  cardsRetry: () => { const s = curScreen(); s.ids = shuffle(s.missed); s.missed = []; s.i = 0; render(true); },
  mock: el => (el.dataset.replace ? replace : push)(newQuiz("Mock test", mockTest(), true, null)),
  quizChapter: el => { const n = +el.dataset.arg; push(newQuiz("Chapter " + n + " quiz", shuffle(questionsFor(n)).slice(0, 20).map(q => q.id), false, null)); },
  quizMissed: () => push(newQuiz("Review mistakes", shuffle(QUESTIONS.filter(q => P.missed.has(q.id))).slice(0, 30).map(q => q.id), false, null)),
  opt: el => {
    const s = curScreen(), it = s.items[s.i], i = +el.dataset.arg;
    if (it.checked) return;
    if (it.correct.length === 1) it.sel = [i];
    else if (it.sel.includes(i)) it.sel = it.sel.filter(x => x !== i);
    else { if (it.sel.length >= it.correct.length) it.sel.shift(); it.sel.push(i); }
    render(false);
  },
  check: () => { const s = curScreen(), it = s.items[s.i]; it.checked = true; recordAnswer(it.q.id, isRight(it)); save(); render(false); },
  next: () => { const s = curScreen(); if (s.i < s.items.length - 1) { s.i++; render(true); } else finishQuiz(s); },
  prev: () => { const s = curScreen(); if (s.i > 0) { s.i--; render(true); } },
  jump: el => { const s = curScreen(); s.i = +el.dataset.arg; render(true); },
  finishAsk: () => {
    const s = curScreen(), un = s.items.filter(it => it.sel.length !== it.correct.length).length;
    showModal("Finish the test?", un ? "You have " + un + " unanswered question" + (un === 1 ? "" : "s") + ". Unanswered questions count as wrong." : "All questions answered. Ready to see your score?",
      "Finish", () => finishQuiz(s), "Review");
  },
  quizBack: () => {
    const s = curScreen();
    if (s.finished) return pop();
    showModal("Leave this " + (s.mock ? "test" : "quiz") + "?", "Your answers so far won't be scored.", "Leave", () => pop(), "Keep going");
  },
  retry: () => { const s = curScreen(); replace(newQuiz(s.title, s.mock ? mockTest() : shuffle(s.ids), s.mock, s.continueTo)); },
  toggleAll: () => { curScreen().showAll = !curScreen().showAll; render(false); },
  modalClose: (el, ev) => { if (ev.target === el) closeModal(); },
  modalOk: () => { const f = modalOk; closeModal(); if (f) f(); },
};

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el) { if (menuOpen) { menuOpen = false; render(false); } return; }
  const act = el.dataset.act;
  if (menuOpen && act !== "menu" && act !== "reset") menuOpen = false;
  if (actions[act]) actions[act](el, ev);
});
document.addEventListener("keydown", ev => {
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.id === "flash") { ev.preventDefault(); actions.flip(); }
});

document.addEventListener("input", ev => {
  const s = curScreen();
  if (s && s.name === "signin" && ev.target.name) s[ev.target.name] = ev.target.value;
});
document.addEventListener("submit", ev => {
  if (ev.target.id === "authform") { ev.preventDefault(); authSubmit(); }
});

render(true);
connectAccount();
connectFirebase();
</script>

</body>
</html>
