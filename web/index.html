2012 site was in **Stratford, East London**, and Britain finished **third in the medal table**.\n\nThe **Paralympics** began with the work of **Dr Sir Ludwig Guttmann**, a German refugee, at **Stoke Mandeville** hospital in **Buckinghamshire**, helping people with spinal injuries.\n\n## Famous British sportspeople\n| Roger Bannister | First man to run **a mile in under four minutes** (1954)\n| Jackie Stewart | Scottish racing driver, **Formula 1 world champion three times**\n| Bobby Moore | Captained England's **1966 World Cup** winning team\n| Ian Botham | Captained **England's cricket team**; many Test records\n| Torvill and Dean | **Ice dancing** gold, **1984 Olympics**\n| Steve Redgrave | **Rowing** gold at **five consecutive Olympics**\n| Tanni Grey-Thompson | Wheelchair athlete; **16 Paralympic medals** (11 gold); won the **London Marathon six times**\n| Kelly Holmes | **Two running golds** at the **2004 Olympics**\n| Ellen MacArthur | Yachtswoman; in **2004** the **fastest person to sail around the world single-handed**\n| Chris Hoy | Scottish **cyclist**; **six Olympic golds**\n| David Weir | Wheelchair Paralympian; **six golds**; won the **London Marathon six times**\n| Bradley Wiggins | **Cyclist**; **first Briton to win the Tour de France** (2012)\n| Mo Farah | Born in **Somalia**; **2012** golds in **5,000m and 10,000m**\n| Jessica Ennis | **2012** gold in the **heptathlon** (seven events)\n| Andy Murray | Scottish **tennis** player; won the **US Open in 2012** – first British man to win a Grand Slam singles title **since 1936**\n| Ellie Simmonds | Paralympic **swimmer**; youngest of the British team in **2008**\n\n## Popular sports\n- **Football** is **the UK's most popular sport**. Each UK country has its own league and national team. The **English Premier League** has a huge international audience. **England's only international tournament victory** was the **1966 World Cup**, hosted in the UK.\n- **Cricket** originated in England; games can last up to **five days** and still end in a draw. The most famous competition is **the Ashes** – **England v Australia**. Phrases like \"it's just not cricket\" and \"batting on a sticky wicket\" come from it.\n- **Rugby** originated in England in the **early 19th century**. There are two types: **union** and **league**. The most famous union competition is the **Six Nations**: **England, Ireland, Scotland, Wales, France and Italy**. The **Super League** is the best-known rugby league club competition. Northern Ireland plays with the **Irish Republic**.\n- **Horse racing** dates back to **Roman times** and has links with royalty: **Royal Ascot** (five days, **Berkshire**), the **Grand National** at **Aintree near Liverpool**, and the **Scottish Grand National** at **Ayr**. The **National Horseracing Museum** is in **Newmarket, Suffolk**.\n- **Golf** dates back to **15th-century Scotland**. **St Andrews** is known as **the home of golf**. **The Open Championship** is the only \"Major\" held outside the USA.\n- **Tennis** evolved in England in the **late 19th century**; the first club was founded in **Leamington Spa in 1872**. **Wimbledon**, at the All England Lawn Tennis and Croquet Club, is **the oldest tennis tournament in the world** and **the only Grand Slam played on grass**.\n- **Sailing**: **Sir Francis Chichester** was the first to sail **single-handed around the world (1966/67)**; two years later **Sir Robin Knox-Johnston** did it **without stopping**. The most famous sailing event is at **Cowes on the Isle of Wight**. The **Oxford v Cambridge** boat race is rowed on **the Thames**.\n- **Motor sport**: car racing in the UK started in **1902**. A **Formula 1 Grand Prix** is held every year; recent British champions include **Damon Hill, Lewis Hamilton and Jensen Button**.\n- **Skiing**: there are **five ski centres in Scotland** and **Europe's longest dry ski slope near Edinburgh**.\n\n@remember\n- Olympics hosted **1908, 1948, 2012**; Paralympics began at **Stoke Mandeville**\n- **Football** most popular; England's only win – **1966 World Cup** (Bobby Moore)\n- **Ashes** – cricket, England v Australia\n- **Six Nations** – England, Ireland, Scotland, Wales, **France, Italy**\n- **Grand National** – Aintree; **Royal Ascot** – Berkshire; museum – **Newmarket**\n- **St Andrews** – home of golf; **The Open** – only Major outside the USA\n- **Wimbledon** – oldest tournament, only Grand Slam on **grass**; first club **Leamington Spa 1872**\n- **Bannister** – 4-minute mile; **Redgrave** – 5 rowing golds; **Wiggins** – Tour de France\n- **Farah** – 5,000m and 10,000m; **Ennis** – heptathlon; **Murray** – US Open 2012\n\n@section Music and theatre\n## Classical music\n**The Proms** is an **eight-week summer** season of orchestral music, including at the **Royal Albert Hall**, organised by the **BBC since 1927**. The **Last Night of the Proms** is the best-known concert.\n\n> Henry Purcell (1659–95) :: Organist at **Westminster Abbey**; developed a distinctly British style of church music and opera.\n\n> George Frederick Handel (1695–1759) :: **German-born**, became a British citizen in **1727**. Wrote **Water Music** for **George I**, **Music for the Royal Fireworks** for **George II**, and the oratorio **Messiah**, often sung at Easter.\n\n> Gustav Holst (1874–1934) :: Wrote **The Planets**. **Jupiter** became the tune for the hymn **I Vow to Thee My Country**.\n\n> Sir Edward Elgar (1857–1934) :: Born in **Worcester**. Best known for the **Pomp and Circumstance Marches**; March No 1 (**Land of Hope and Glory**) is played at the **Last Night of the Proms**.\n\n> Ralph Vaughan Williams (1872–1958) :: Wrote for orchestras and choirs; strongly influenced by **English folk music**.\n\n> Sir William Walton (1902–83) :: Wrote **coronation marches** for **George VI and Elizabeth II**; best known for **Façade** (became a ballet) and **Belshazzar's Feast**.\n\n> Benjamin Britten (1913–76) :: Best known for the operas **Peter Grimes** and **Billy Budd**, and **A Young Person's Guide to the Orchestra** (based on Purcell). Founded the **Aldeburgh festival** in **Suffolk**.\n\n## Popular music\nSince the 1960s British pop has been hugely influential – **The Beatles** and **The Rolling Stones**, the **Punk** movement of the **late 1970s**, and **boy and girl bands** in the **1990s**.\n- Big venues: **Wembley Stadium**, **The O2** in **Greenwich**, and the **SECC** in **Glasgow**.\n- Summer festivals: **Glastonbury**, the **Isle of Wight Festival** and the **V Festival**.\n- The **National Eisteddfod of Wales**: an annual festival of music, dance and art, largely **in Welsh**, with competitions for Welsh poetry.\n- The **Mercury Music Prize** (each **September**) is for the best album from the **UK and Ireland**. The **Brit Awards** give awards such as best British group.\n\n## Theatre\nLondon's **West End** is known as **\"Theatreland\"**. **The Mousetrap**, a murder mystery by **Agatha Christie**, has run there since **1952** – **the longest initial run of any show in history**.\n\n- **Gilbert and Sullivan** wrote 19th-century **comic operas**: **HMS Pinafore, The Pirates of Penzance** and **The Mikado**.\n- **Andrew Lloyd Webber** wrote the music for **Jesus Christ Superstar** and **Evita** (with **Tim Rice**), and **Cats** and **The Phantom of the Opera**.\n- **Pantomime** is a Christmas tradition, based on fairy stories. The **Dame** is a woman played by a man, and there is often a **pantomime horse or cow**.\n- The **Edinburgh Festival** takes place every **summer**; its biggest part is the **Edinburgh Festival Fringe**, mainly theatre and comedy, often experimental.\n- The **Laurence Olivier Awards** are held annually in **London**, named after the actor best known for Shakespeare roles.\n\n@remember\n- **Proms** – 8 weeks, Royal Albert Hall, **BBC** since 1927\n- **Handel** – Water Music, Messiah; **Elgar** – Land of Hope and Glory; **Holst** – The Planets\n- **Britten** – Peter Grimes, Aldeburgh; **Purcell** – Westminster Abbey organist\n- **Eisteddfod** – Welsh festival; **Mercury Prize** – best album; **Brit Awards**\n- **The Mousetrap** – longest initial run, since 1952\n- **Gilbert and Sullivan** – HMS Pinafore, The Mikado\n- **Lloyd Webber** – Cats, Phantom, Evita, Jesus Christ Superstar\n- Pantomime **Dame** = a woman played by a man; **Edinburgh Fringe**; **Olivier Awards**\n\n@section Art, architecture and design\n## Art\nIn the Middle Ages most art was **religious**. In the 16th and 17th centuries many painters in Britain came from abroad, like **Hans Holbein** and **Sir Anthony Van Dyck**. British **portrait and landscape** painters became famous from the 18th century.\n\nGalleries: the **National Gallery, Tate Britain and Tate Modern** (London), the **National Museum** in **Cardiff**, and the **National Gallery of Scotland** in **Edinburgh**.\n\nThe **Turner Prize** for **contemporary art** was set up in **1984**, named after Joseph Turner. **Four works are shortlisted** and shown at **Tate Britain**. Winners include **Damien Hirst** and **Richard Wright**.\n\n| Gainsborough | **Portraits**, often in country or garden scenery\n| David Allan | **Scottish** portrait painter – **The Origin of Painting**\n| Joseph Turner | Influential **landscape** painter in a modern style\n| John Constable | **Landscapes** of **Dedham Vale** (Suffolk–Essex border)\n| Pre-Raphaelites | 2nd half of 19th c.: **Holman Hunt, Dante Gabriel Rossetti, John Millais** – detailed, bright pictures\n| John Lavery | **Northern Irish** portrait painter, painted the **Royal Family**\n| Henry Moore | English **sculptor** – large **bronze abstract** sculptures\n| John Petts | **Welsh** artist – **engravings and stained glass**\n| Lucian Freud | **German-born** British artist – **portraits**\n| David Hockney | **Pop art** movement of the **1960s**\n\n## Architecture\n- **Middle Ages**: great cathedrals at **Durham, Lincoln, Canterbury and Salisbury**. The **White Tower** in the Tower of London is a **Norman keep** built for **William the Conqueror**.\n- Great country houses such as **Hardwick Hall** in **Derbyshire**.\n- **17th century**: **Inigo Jones** designed the **Queen's House at Greenwich** and the **Banqueting House** in Whitehall. **Sir Christopher Wren** designed the new **St Paul's Cathedral**.\n- **18th century**: simpler designs. Scottish architect **Robert Adam** designed **Dumfries House** inside and out; his ideas influenced the **Royal Crescent in Bath**.\n- **19th century**: **gothic** style returned – the **Houses of Parliament**, **St Pancras Station** and town halls in **Manchester and Sheffield**.\n- **20th century**: **Sir Edwin Lutyens** designed **New Delhi** and many war memorials, including the **Cenotaph** in Whitehall.\n- **Modern** architects: **Sir Norman Foster, Lord (Richard) Rogers** and **Dame Zaha Hadid**.\n\n## Gardens and design\n**Lancelot \"Capability\" Brown** (18th century) designed natural-looking grounds for country houses. **Gertrude Jekyll** designed colourful gardens, often with **Lutyens**. The annual **Chelsea Flower Show** showcases garden design.\n\nDesigners: **Thomas Chippendale** (18th-century **furniture**), **Clarice Cliff** (**Art Deco ceramics**), **Sir Terence Conran** (**interior** design). Fashion: **Mary Quant, Alexander McQueen, Vivienne Westwood**.\n\n@remember\n- **Turner Prize** – contemporary art, since **1984**, at **Tate Britain**\n- **Constable** – Dedham Vale; **Gainsborough** – portraits; **Turner** – landscapes\n- **Henry Moore** – bronze sculptures; **Hockney** – pop art; **Petts** – Welsh stained glass\n- **Wren** – St Paul's; **Inigo Jones** – Queen's House, Banqueting House\n- **Robert Adam** – Dumfries House; **Lutyens** – Cenotaph, New Delhi\n- Gothic revival: **Houses of Parliament**, **St Pancras**\n- **Capability Brown** – natural landscapes; **Gertrude Jekyll** – colourful gardens\n- **Chippendale** – furniture; **Mary Quant, McQueen, Westwood** – fashion\n\n@section Literature and poetry\n**Nobel Prize in Literature** winners include novelist **Sir William Golding**, poet **Seamus Heaney** and playwright **Harold Pinter**. **Agatha Christie**'s detective stories are read worldwide and **Ian Fleming** created **James Bond**. In **2003** **The Lord of the Rings** by **JRR Tolkien** was voted the **country's best-loved novel**.\n\nThe **Man Booker Prize** (since **1968**) is for the best fiction by an author from the **Commonwealth, Ireland or Zimbabwe**. Winners include **Ian McEwan, Hilary Mantel and Julian Barnes**.\n\n## Notable authors\n| Jane Austen | **Pride and Prejudice**, **Sense and Sensibility** – marriage and family\n| Charles Dickens | **Oliver Twist**, **Great Expectations**; characters **Scrooge** (mean) and **Mr Micawber** (always hopeful)\n| Robert Louis Stevenson | **Treasure Island**, **Kidnapped**, **Dr Jekyll and Mr Hyde**\n| Thomas Hardy | Rural novels **Far from the Madding Crowd**, **Jude the Obscure**\n| Arthur Conan Doyle | **Scottish doctor**; **Sherlock Holmes**\n| Evelyn Waugh | Satire: **Decline and Fall**, **Scoop**; best known for **Brideshead Revisited**\n| Kingsley Amis | Over 20 novels; best known **Lucky Jim**\n| Graham Greene | Religious themes: **Brighton Rock**, **Our Man in Havana**, **The Heart of the Matter**, **The Honorary Consul**\n| J K Rowling | **Harry Potter**\n\n## Poets\n- **Beowulf** – an **Anglo-Saxon** poem about a hero fighting monsters.\n- Medieval: Chaucer's **Canterbury Tales** and **Sir Gawain and the Green Knight** (a knight of King Arthur's court).\n- **Shakespeare** wrote many **sonnets** – poems of **14 lines**.\n- **John Milton** wrote **Paradise Lost**, inspired by his religious views.\n- **William Wordsworth** was inspired by **nature**. **Sir Walter Scott** wrote poems and novels inspired by **Scotland**.\n- 19th century: **William Blake, John Keats, Lord Byron, Percy Shelley, Alfred Lord Tennyson**, and **Robert and Elizabeth Browning**.\n- **First World War**: **Wilfred Owen** and **Siegfried Sassoon**.\n- More recently: **Walter de la Mare, John Masefield, Sir John Betjeman** and **Ted Hughes**.\n- Many poets are buried or commemorated in **Poets' Corner, Westminster Abbey**.\n\n## Famous lines\n\" Oh to be in England now that April's there\n\"— Robert Browning, Home Thoughts from Abroad\n\" She walks in beauty, like the night / Of cloudless climes and starry skies\n\"— Lord Byron, She Walks in Beauty\n\" I wander'd lonely as a cloud … A host of golden daffodils\n\"— William Wordsworth, The Daffodils\n\" Tyger! Tyger! burning bright / In the forests of the night\n\"— William Blake, The Tyger\n\" What passing-bells for these who die as cattle?\n\"— Wilfred Owen, Anthem for Doomed Youth\n\n@remember\n- Nobel: **Golding, Heaney, Pinter**; **Lord of the Rings** voted best-loved (2003)\n- **Man Booker** – since 1968; Commonwealth, Ireland, Zimbabwe\n- **Austen** – Pride and Prejudice; **Dickens** – Oliver Twist; **Conan Doyle** – Sherlock Holmes\n- **Stevenson** – Treasure Island; **Hardy** – Far from the Madding Crowd; **Waugh** – Brideshead\n- **Beowulf** – Anglo-Saxon; **Milton** – Paradise Lost; sonnet = **14 lines**\n- **Wordsworth** – daffodils; **Blake** – The Tyger; **Byron** – She Walks in Beauty\n- WWI poets: **Wilfred Owen, Siegfried Sassoon**\n- **Poets' Corner** – Westminster Abbey\n\n@section Leisure, film and media\n## Gardens, shopping and food\nMany people garden; some rent an **allotment** to grow fruit and vegetables. Famous gardens: **Kew Gardens, Sissinghurst and Hidcote** (England), **Crathes Castle and Inveraray Castle** (Scotland), **Bodnant Garden** (Wales) and **Mount Stewart** (Northern Ireland).\n\nMost shops open **seven days a week**, with shorter hours on Sundays and public holidays.\n\n| England | **Roast beef** with **Yorkshire puddings**; **fish and chips**\n| Wales | **Welsh cakes** – flour, dried fruit and spices\n| Scotland | **Haggis** – sheep's stomach stuffed with offal, suet, onions and oatmeal\n| Northern Ireland | **Ulster fry** – bacon, eggs, sausage, black and white pudding, soda and potato bread\n\n## Film\nFilms were first shown publicly in the UK in **1896**. **Sir Charles (Charlie) Chaplin** became famous in silent films for his **tramp** character. In the 1930s, **Sir Alexander Korda** and **Sir Alfred Hitchcock** were leading directors. In the war, films like **In Which We Serve** boosted morale. Later, **Sir David Lean** and **Ridley Scott** found international success.\n\n- The **1950s and 1960s** were a high point for comedies: **Passport to Pimlico, The Ladykillers** and the **Carry On** films.\n- The two highest-grossing film franchises – **Harry Potter and James Bond** – were produced in the UK.\n- **Ealing Studios** claims to be **the oldest continuously working film studio** in the world.\n- **Nick Park** has won **four Oscars**, three for **Wallace and Gromit**.\n- Recent British Oscar winners: **Colin Firth, Sir Anthony Hopkins, Dame Judi Dench, Kate Winslet, Tilda Swinton**.\n- The **BAFTAs** are the British equivalent of the Oscars.\n\nFamous films: **The 39 Steps** (1935, Hitchcock), **Brief Encounter** (1945, Lean), **The Third Man** (1949), **Lawrence of Arabia** (1962, Lean), **Chariots of Fire** (1981), **Four Weddings and a Funeral** (1994), **Touching the Void** (2003).\n\n## Comedy\nMedieval kings had **jesters**. Political cartoons grew in the 18th century, and the satirical magazine **Punch** first appeared in the **1840s** (today **Private Eye** continues the tradition). Music hall stars like **Morecambe and Wise** moved to TV. TV satire included **That Was The Week That Was** (1960s) and **Spitting Image** (1980s–90s). **Monty Python's Flying Circus** began in **1969**.\n\n## TV and radio\nPopular soaps include **Coronation Street** and **EastEnders**. There is a **Welsh-language** channel in Wales and a **Gaelic** channel in Scotland.\n\nEveryone who watches TV needs a **TV licence** – one per home (people with **separate tenancies** in a shared house each need one). People **over 75** can apply for a **free licence** and **blind people get 50% off**. Watching without a licence can bring a fine of **up to £1,000**.\n\nThe licence fee pays for the **BBC**, the **largest broadcaster in the world** and **the only wholly state-funded media organisation independent of government**. Other channels are funded by **advertising and subscriptions**.\n\n## Pubs, betting and pets\n- You must be **18** to buy alcohol in a pub or club. At **16** you can drink **wine or beer with a meal** in a hotel or restaurant if with someone over 18.\n- Pubs usually open at **11.00 am** (**12 noon on Sundays**); the **licensee** decides closing hours. **Pool and darts** are traditional pub games.\n- You must be **18** to enter betting shops or gambling clubs, and to play the **National Lottery**.\n- It is illegal to treat a pet **cruelly or neglect** it. Dogs in public must wear a **collar with the owner's name and address**, and owners must **clean up** after them. **Vets** provide animal care; charities help those who can't pay.\n\n@remember\n- Foods: **roast beef** (England), **Welsh cakes**, **haggis** (Scotland), **Ulster fry** (NI)\n- **Chaplin** – tramp; **Hitchcock**, **David Lean**; **Nick Park** – Wallace and Gromit\n- **Ealing Studios** – oldest working studio; **BAFTAs** = British Oscars\n- **Harry Potter** and **James Bond** – top film franchises\n- **Monty Python** – 1969; **Punch** – 1840s satire\n- TV licence: free for **over-75s** (apply), **50% off** for blind people, fine up to **£1,000**\n- **BBC** – funded by the licence, independent of government\n- Alcohol at **18**; beer or wine with a meal at **16**; betting and Lottery at **18**\n- Dogs need a **collar with the owner's name and address**\n\n@section Places of interest\nThere are **15 national parks** in England, Wales and Scotland. The **National Trust** (founded in **1895 by three volunteers**) and the **National Trust for Scotland** are **charities** that preserve buildings, coastline and countryside; more than **61,000 volunteers** help.\n\n| Big Ben | Nickname of the **great bell** of the clock at the **Houses of Parliament**. The clock is over **150 years** old. The tower was renamed **Elizabeth Tower** for the **Diamond Jubilee in 2012**.\n| Eden Project | In **Cornwall**. Giant greenhouses called **biomes** with plants from around the world; also a charity.\n| Edinburgh Castle | Dominates Edinburgh's skyline; looked after by **Historic Scotland**.\n| Giant's Causeway | **North-east coast of Northern Ireland**. Columns of **volcanic lava** about **50 million years** old.\n| Loch Lomond and the Trossachs | National park in the **west of Scotland**. **Loch Lomond** is the **largest expanse of fresh water in mainland Britain**.\n| London Eye | Ferris wheel on the **south bank of the Thames**, **135 metres (443 ft)**, built for the **millennium**.\n| Snowdonia | National park in **North Wales**. **Snowdon** is the **highest mountain in Wales**.\n| Tower of London | First built by **William the Conqueror**. Tours by **Yeoman Warders (Beefeaters)**; home of the **Crown Jewels**.\n| Lake District | **England's largest national park**. Biggest lake: **Windermere**. **Wastwater** was voted **Britain's favourite view** (2007).\n\n@remember\n- **15 national parks**; **National Trust** founded **1895** by three volunteers\n- **Big Ben** = the bell; tower = **Elizabeth Tower**\n- **Eden Project** – Cornwall; **Giant's Causeway** – NI\n- **Snowdon** – highest in Wales; **Lake District** – England's largest park, **Windermere**\n- **Loch Lomond** – largest fresh water in mainland Britain\n- **London Eye** – millennium; **Tower of London** – Beefeaters, Crown Jewels\n- **Wastwater** – Britain's favourite view (2007)\n", "@title The UK government, the law and your role\n@subtitle Parliament, elections, courts, rights and community\n@intro How the UK is run and how the law works. Expect questions on **the monarch's role**, **the two Houses of Parliament**, **who can vote**, **the devolved governments**, **the courts**, and the difference between **criminal and civil law**.\n\n@section How democracy developed\n**Democracy** is a system where the whole adult population has a say, either by voting directly or by choosing representatives.\n\nAt the start of the 19th century only **men over 21 who owned a certain amount of property** could vote. In the **1830s and 1840s** the **Chartists** campaigned for six changes:\n- **every man** to have the vote\n- **elections every year**\n- **all regions equal** in the electoral system\n- **secret ballots**\n- **any man** able to stand as an MP\n- **MPs to be paid**\n\nThe campaign was seen as a failure at the time, but by **1918** most of these reforms had been adopted.\n\n| 1918 | Women **over 30** get the vote\n| 1928 | Men and women **over 21** can vote\n| 1969 | Voting age lowered to **18**\n\n@remember\n- Early 1800s: only **men over 21 with property** could vote\n- Chartists wanted: votes for every man, annual elections, equal regions, **secret ballots**, any man as MP, **paid MPs**\n- **1918** women over 30; **1928** everyone over 21; **1969** voting age **18**\n\n@section The constitution and the monarchy\nA **constitution** is the set of principles by which a country is governed. The British constitution is **not written down in any single document**, so it is called **\"unwritten\"** – mainly because the UK has never had a revolution that created a totally new system.\n\nThe main constitutional institutions are: **the monarchy, Parliament (the House of Commons and House of Lords), the Prime Minister, the cabinet, the judiciary (courts), the police, the civil service and local government**.\n\n## The monarch\nThe UK is a **constitutional monarchy**: the king or queen **does not rule** the country but **appoints the government** the people have chosen. The monarch invites the leader of the largest party (or a coalition) to become **Prime Minister**, meets the PM regularly and can **advise, warn and encourage** – but **decisions are made by the PM and cabinet**.\n\n**Queen Elizabeth II** reigned from **1952**, celebrated her **Diamond Jubilee (60 years) in 2012** and died on **8 September 2022**. Her eldest son **King Charles III** is the monarch. His heir is **Prince William, Prince of Wales**, followed by **Prince George, Princess Charlotte and Prince Louis**.\n\nThe monarch's roles include:\n- **opening each new parliamentary session** with a speech setting out the government's policies\n- giving assent: **all Acts of Parliament are made in the monarch's name**\n- **representing the UK** abroad: receiving ambassadors, hosting heads of state, making state visits\n- providing **stability and continuity** and a focus for national identity\n\n## The national anthem and the oath\nThe national anthem is **\"God Save the King\"** (or Queen).\n\n\" God save our gracious King! Long live our noble King! God save the King!\n\"— The national anthem, first lines\n\nNew citizens **swear (oath) or affirm (affirmation)** loyalty to the King at the citizenship ceremony: \"…I will be **faithful and bear true allegiance** to His Majesty King Charles the Third, his Heirs and Successors, according to law.\"\n\n! The **oath** mentions \"Almighty God\"; the **affirmation** is the non-religious version. Both promise allegiance to the monarch.\n\n@remember\n- The constitution is **unwritten** (no single document)\n- The monarch **appoints** the government but **does not rule**; can **advise, warn and encourage**\n- The monarch **opens each parliamentary session**; Acts are made in the monarch's name\n- **King Charles III**; heir **Prince William, Prince of Wales**\n- Anthem: **God Save the King**\n- New citizens **swear an oath or make an affirmation** of allegiance\n\n@section Parliament and elections\nThe UK is a **parliamentary democracy**, divided into **constituencies**. Voters in each elect a **Member of Parliament (MP)** at a **General Election**. All MPs together form the **House of Commons**. The party with the majority of MPs forms the government; if no party has a majority, two can form a **coalition**.\n\n## The House of Commons\nThe Commons is the **more important** chamber because its members are **democratically elected**. The PM and almost all the cabinet are MPs. MPs:\n- **represent everyone** in their constituency\n- **help create new laws**\n- **scrutinise and comment** on what the government is doing\n- **debate important national issues**\n\n## The House of Lords\nMembers are called **peers**. They are **not elected** and do not represent a constituency.\n- **Until 1958** all peers were **hereditary**, **senior judges** or **Church of England bishops**.\n- **Since 1958** the PM can nominate **life peers**, appointed by the **monarch on the advice of the Prime Minister** (some are nominated by other party leaders or an **independent Appointments Commission**).\n- **Since 1999** hereditary peers have **lost the automatic right** to attend; they elect a few of their number.\n\nThe Lords is usually **more independent of the government**. It can suggest amendments or propose new laws, **checks laws passed by the Commons** and holds the government to account. The **Commons can overrule the Lords**, but rarely does.\n\n## The Speaker\nDebates in the Commons are chaired by **the Speaker**, an MP who is **politically neutral**. The Speaker is **chosen by other MPs in a secret ballot**, keeps order, makes sure **the opposition gets time** to debate, and represents Parliament on ceremonial occasions. The Speaker still represents a constituency like any MP.\n\n## Elections\n- MPs are elected at a **General Election** held **at least every five years**.\n- If an MP dies or resigns, there is a **by-election** in that constituency.\n- The system is **\"first past the post\"**: the candidate with **the most votes** wins.\n- European Parliament elections (while the UK was in the EU) used **proportional representation**, where seats match the share of votes.\n\n## Contacting your representatives\nYou can write to or phone your MP at their constituency office or at the **House of Commons, Westminster, London SW1A 0AA**. Many MPs hold local **\"surgeries\"** where constituents can raise issues in person.\n\n@remember\n- **Commons** = elected MPs (more important); **Lords** = unelected **peers**\n- **Life peers** since **1958** (monarch appoints on PM's advice); hereditary peers lost automatic right in **1999**\n- The Commons can **overrule** the Lords\n- **Speaker** – neutral, chosen by MPs in a **secret ballot**\n- General Election **at least every five years**; **by-election** if an MP dies or resigns\n- **First past the post** – most votes wins\n- MPs hold **surgeries** for constituents\n\n@section The government\n## The Prime Minister\nThe **PM** is the **leader of the party in power**, appoints the cabinet and controls many public appointments. The PM's official home is **10 Downing Street**; the country house is **Chequers**. The PM can be changed by MPs of the governing party, or resign, and usually resigns after losing a General Election.\n\n## The cabinet\nAbout **20 senior MPs** run government departments, including:\n- **Chancellor of the Exchequer** – the **economy**\n- **Home Secretary** – **crime, policing and immigration**\n- **Foreign Secretary** – relationships with **foreign countries**\n- **Secretaries of State** for areas such as education, health and defence\n\nThe cabinet usually **meets weekly** to make important policy decisions; many need Parliament's approval.\n\n## The opposition\nThe **second-largest party** in the Commons is **the opposition**. Its leader challenges the government, especially at **Prime Minister's Questions** every week, and appoints **shadow ministers** who form the **shadow cabinet**.\n\n## Parties and pressure groups\n**Anyone aged 18 or over** can stand as an MP, but is unlikely to win without a major party: the **Conservatives, Labour, the Liberal Democrats**, or parties for Scottish, Welsh or Northern Irish interests. MPs with no party are **independents**.\n\n**Pressure and lobby groups** try to influence government policy, e.g. the **CBI** (British business), **Greenpeace** (environment) and **Liberty** (human rights).\n\n## The civil service\nCivil servants **support the government** and deliver public services. They are **chosen on merit** and are **politically neutral**. Core values: **integrity, honesty, objectivity and impartiality**.\n\n## Local government\nTowns, cities and rural areas are run by elected **councils** (\"**local authorities**\"), funded by **central government and local taxes**. Many appoint a ceremonial **mayor**. **London has 33 local authorities**, coordinated by the **Greater London Authority** and the **Mayor of London**. Local elections for councillors are usually held in **May** every year.\n\n@remember\n- PM: **10 Downing Street**; country house **Chequers**\n- Cabinet of about **20**; **Chancellor** = economy; **Home Secretary** = crime, policing, immigration; **Foreign Secretary**\n- **Opposition** = second-largest party; **shadow cabinet**; **PMQs** weekly\n- Stand as MP at **18**; non-party MPs are **independents**\n- Pressure groups: **CBI, Greenpeace, Liberty**\n- Civil service: **politically neutral**; integrity, honesty, objectivity, impartiality\n- **London has 33 local authorities**; local elections in **May**\n\n@section Devolved government\nSince **1997** some powers have been **devolved** to Wales, Scotland and Northern Ireland. The **Welsh Assembly** and **Scottish Parliament** have existed since **1999**.\n\n**Defence, foreign affairs, immigration, taxation and social security** stay with the **UK government**. Services like **education** are run by the devolved administrations, which each have **their own civil service**.\n\n| Wales | **Welsh Assembly (Senedd)** in **Cardiff**. **60 members (AMs)**, elected every **four years** by **proportional representation**. Can make laws in **20 areas**, e.g. education, health, economic development, housing – since **2011** without the UK Parliament's agreement. Members can speak **Welsh or English**.\n| Scotland | **Scottish Parliament** at **Holyrood, Edinburgh** (formed **1999**). **129 MSPs**, elected by **proportional representation**. Can legislate on everything not reserved to Westminster, e.g. **civil and criminal law, health, education, planning** and **additional tax-raising powers**.\n| Northern Ireland | **NI Assembly** at **Stormont, Belfast**, set up after the **Good Friday (Belfast) Agreement 1998**. **90 MLAs**, elected by **proportional representation**, with **power-sharing** between the main parties. Decides on education, agriculture, the environment, health and social services.\n\nA **Northern Ireland Parliament** was set up in **1922** and **abolished in 1972**, soon after the Troubles began. The UK government **can suspend** the devolved assemblies and has done so several times in Northern Ireland; it has run successfully since **2007**.\n\n## The media\nParliament's proceedings are broadcast on TV and published in **Hansard**. The UK has a **free press** – newspapers are free from government control and may support particular parties. **Radio and TV coverage of political parties must be balanced**, giving equal time to rival views.\n\n@remember\n- Devolution since **1997**; Scottish Parliament and Welsh Assembly since **1999**\n- UK keeps **defence, foreign affairs, immigration, taxation, social security**\n- **Wales**: Cardiff, **60** members, elections every **4** years\n- **Scotland**: Holyrood, **129 MSPs**; civil and criminal law, extra tax powers\n- **Northern Ireland**: Stormont, **90 MLAs**, **power-sharing**\n- All use **proportional representation**; UK can **suspend** them\n- **Hansard** records Parliament; broadcast coverage must be **balanced**\n\n@section Voting and standing for office\nThe UK has had a **fully democratic voting system since 1928**, and the voting age of **18** was set in **1969**.\n\n## Who can vote\n- **UK citizens**, and **Commonwealth and Irish Republic citizens** resident in the UK, can vote in **all public elections**.\n- Under the handbook's rules, citizens of other **EU** states resident in the UK could vote in all elections **except General Elections**.\n\n## Registering\nYou must be on the **electoral register**. Register through your **local council electoral registration office**. The register is **updated every year in September or October** – a form is sent to every household. In **Northern Ireland** each person registers **individually**. The register can be inspected, under supervision, at registration offices and some **libraries**.\n\n## How to vote\nYou vote at a **polling station** (a **polling place** in Scotland). A **poll card** tells you where and when. Polling stations open from **7.00 am to 10.00 pm**. In **Northern Ireland** you must show **photographic ID**. You mark your **ballot paper** privately in a booth – **no one can make you vote for a particular candidate**. If you can't get there, you can register for a **postal ballot**.\n\n## Standing for office\nMost citizens of the **UK, Irish Republic or Commonwealth aged 18 or over** can stand for public office, except:\n- members of the **armed forces**\n- **civil servants**\n- people found guilty of certain **criminal offences**\n\nMembers of the **House of Lords cannot stand for the House of Commons**.\n\n## Visiting Parliament\nYou can watch debates free from the **public galleries** in both Houses – write to your MP for tickets or queue on the day; the Lords is usually easier to get into. You can also visit **Stormont** (NI), **Holyrood** (Scotland) and the **Senedd in Cardiff Bay** (Wales).\n\n@remember\n- **UK, Commonwealth and Irish** citizens living here vote in **all** elections\n- Electoral register updated every **September or October**; NI registers **individually**\n- Polling stations open **7 am – 10 pm**; NI voters need **photo ID**\n- Can't get there? Use a **postal ballot**\n- Stand for office at **18**; not **armed forces, civil servants** or certain criminals\n- Peers **cannot** stand for the Commons\n\n@section The UK and the world\n## The Commonwealth\nAn association of countries, most **once part of the British Empire**, working towards democracy and development. The **monarch is its ceremonial head**. Membership is **voluntary**; it has **no power over members** but **can suspend** them. Core values: **democracy, good government and the rule of law**. It now has **56 members** (the original handbook says 54).\n\n## The European Union\nThe EEC was founded by **six countries** – **Belgium, France, Germany, Italy, Luxembourg and the Netherlands** – who signed the **Treaty of Rome on 25 March 1957**. The UK **joined in 1973** and **left on 31 January 2020** after the Brexit vote. The EU now has **27** members.\n\n## The Council of Europe\n**Separate from the EU**. It protects and promotes **human rights**. It **cannot make laws** but draws up conventions – most famously the **European Convention on Human Rights**.\n\n## The United Nations\nSet up **after the Second World War** to prevent war and promote peace, with **more than 190 members**. The **Security Council** has **15 members**; the **UK is one of five permanent members**.\n\n## NATO\nA group of **European and North American** countries who agree to **help each other if attacked**. The UK joined after the war.\n\n@remember\n- **Commonwealth**: monarch is head; voluntary; can **suspend** members; democracy, good government, rule of law\n- **Treaty of Rome 1957** – 6 founders; UK joined **1973**, left **31 January 2020**\n- **Council of Europe** – separate from EU; human rights; **cannot make laws**\n- **UN Security Council** – 15 members, UK one of **5 permanent**\n- **NATO** – members help each other if attacked\n\n@section Rights and responsibilities\nBritain's tradition of rights has its roots in **Magna Carta, the Habeas Corpus Act and the Bill of Rights (1689)**.\n\nBritish lawyers helped draft the **European Convention on Human Rights**, and the UK was **one of the first to sign it, in 1950**. It includes:\n- **right to life**\n- **prohibition of torture**\n- **prohibition of slavery and forced labour**\n- **right to liberty and security**\n- **right to a fair trial**\n- **freedom of thought, conscience and religion**\n- **freedom of expression (speech)**\n\nThe **Human Rights Act 1998** brought the Convention into **UK law**.\n\n## Equal opportunities\nIt is illegal to treat people unfairly because of **age, disability, sex, pregnancy and maternity, race, religion or belief, sexuality or marital status**. Help is available from **Citizens Advice** and the **Equality and Human Rights Commission**.\n\n## Protecting people\n- **Domestic violence** is a serious crime, whether the victim is a man or woman, married or not. A man who forces a woman to have sex – **including her husband** – can be charged with **rape**. **Refuges or shelters** offer safe places to stay.\n- **Female genital mutilation (FGM)** is **illegal**, as is **taking a girl abroad** for it.\n- **Forced marriage** is a **criminal offence**; **arranged marriages** with both people's consent are acceptable. **Forced Marriage Protection Orders** were introduced in **2008** (England, Wales and NI) and **2011** (Scotland). Breaking an order can mean **up to two years in jail**.\n\n@remember\n- Roots: **Magna Carta, Habeas Corpus, Bill of Rights**\n- UK signed the **ECHR in 1950**; **Human Rights Act 1998**\n- No discrimination by age, disability, sex, pregnancy, race, religion, sexuality or marital status\n- **Domestic violence** is a crime; a husband can be charged with **rape**\n- **FGM** is illegal – including taking a girl **abroad** for it\n- **Forced marriage** is a crime; breaching a protection order = up to **2 years** in jail\n\n@section Respecting the law\n**Everyone receives equal treatment under the law.** Some things allowed elsewhere are **not acceptable in the UK**.\n\n## Criminal and civil law\n**Criminal law** covers crimes, investigated by the **police** and punished by the courts. **Civil law** settles **disputes between people or groups**.\n\nExamples of **criminal** offences:\n- carrying **any weapon**, even for **self-defence**\n- **buying or selling drugs** such as heroin, cocaine, ecstasy and cannabis\n- **racial crime** – harassment because of religion or ethnic origin\n- selling **tobacco** to anyone **under 18**\n- **smoking** in nearly every **enclosed public place**\n- selling alcohol to, or buying it for, anyone **under 18** (16-year-olds may drink with a meal in a hotel or restaurant)\n- drinking in **alcohol-free zones**\n\nExamples of **civil** law: **housing** (landlord–tenant disputes), **consumer rights** (faulty goods), **employment** (unfair dismissal, discrimination) and **debt**.\n\n## The police\nThe police **protect life and property**, **prevent disturbances (keep the peace)** and **prevent and detect crime**. Forces are led by **Chief Constables** and are **independent of government**.\n\nSince **November 2012**, **Police and Crime Commissioners (PCCs)** have been **elected** in England and Wales. They set local police priorities and budgets and **appoint the Chief Constable**.\n\nPolice officers must obey the law themselves. They are supported by **Police Community Support Officers (PCSOs)**. If arrested, you will be **told why** and can **seek legal advice**. Complaints can go to a police station, the Chief Constable, or an independent body: the **Independent Police Complaints Commission** (England and Wales), the **Police Complaints Commissioner for Scotland** or the **Police Ombudsman for Northern Ireland**.\n\n## Terrorism and extremism\nThe most serious terrorist threat is from **Al Qa'ida** and similar groups; there is also **Northern Ireland-related** terrorism. **Extremism** means **vocal or active opposition to fundamental British values**. If someone tries to recruit you, tell your **local police**.\n\n@remember\n- **Criminal law** = crimes; **civil law** = disputes (housing, consumer, employment, debt)\n- Carrying **any weapon** is a crime – even for self-defence\n- Tobacco and alcohol: not sold to under-**18**s\n- Police: **protect life and property, keep the peace, prevent and detect crime**\n- Forces led by **Chief Constables**; **PCCs** elected since **November 2012**\n- **PCSOs** support police officers\n- Extremism = opposition to **fundamental British values**\n\n@section The courts\n**Judges** (the **judiciary**) interpret the law and make sure trials are fair; **the government cannot interfere**. If judges find the government acted illegally, it must **change its policies or ask Parliament to change the law**.\n\n## Criminal courts\n| Minor crimes | **Magistrates' Court** (England, Wales, NI); **Justice of the Peace Court** (Scotland)\n| Serious crimes | **Crown Court** with a judge and jury (England, Wales, NI); **Sheriff Court** (Scotland)\n| Most serious, Scotland | **High Court** with judge and jury (e.g. murder)\n\n**Magistrates and JPs** are members of the local community who usually work **unpaid** and **need no legal qualifications**. In Northern Ireland, cases are heard by a **District Judge**, who is legally qualified and paid.\n\nA **jury** is chosen **at random from the electoral register**. It has **12 members** in England, Wales and NI, and **15 in Scotland**. The jury decides **\"guilty\" or \"not guilty\"** – in Scotland also **\"not proven\"**. If guilty, **the judge decides the penalty**. Everyone summoned must serve unless ineligible or excused for a good reason.\n\n## Youth justice\n- England, Wales and NI: people aged **10 to 17** go to a **Youth Court** (up to three magistrates or a District Judge). The **public is not allowed in**, and the young person's **name and photo cannot be published**. Parents are expected to attend.\n- Scotland: the **Children's Hearings System**.\n- Northern Ireland: **youth conferencing**.\n\n## Civil courts\n- **County Courts** handle civil disputes: money owed, personal injury, family matters, breach of contract and **divorce**. In Scotland these go to the **Sheriff Court**.\n- Serious civil cases go to the **High Court** (England, Wales, NI) or the **Court of Session in Edinburgh** (Scotland).\n- The **small claims procedure** is an informal way to settle disputes without a lawyer: claims under **£10,000 in England and Wales** and **£5,000 in Scotland and NI**. The hearing is held around a table in front of a judge; claims can be made through **Money Claims Online**.\n\n## Legal advice\n**Solicitors** give legal advice and represent clients. **Citizens Advice** and the **Law Society** can recommend one. Charges are usually based on **time spent**, so ask about costs at the start.\n\n@remember\n- The government **cannot interfere** with judges\n- Minor crime: **Magistrates' Court** (Scotland: **Justice of the Peace Court**)\n- Serious crime: **Crown Court** (Scotland: **Sheriff Court**; murder: **High Court**)\n- Jury: **12** (**15** in Scotland); Scotland also has **\"not proven\"**\n- **Youth Court** 10–17; Scotland: **Children's Hearings**; NI: **youth conferencing**\n- Civil: **County Court**; serious civil: **High Court** / **Court of Session**\n- Small claims under **£10,000** (England & Wales), **£5,000** (Scotland & NI)\n\n@section Tax, National Insurance and driving\n## Income tax\nYou pay income tax on **wages, self-employment profits, taxable benefits, pensions** and income from **property, savings and dividends**. It pays for services like **roads, education, police and the armed forces**.\n\nMost employees pay automatically through **PAYE (Pay As You Earn)** – the employer pays it to **HM Revenue & Customs (HMRC)**. The **self-employed** pay through **self-assessment**, completing a **tax return**.\n\n## National Insurance\nAlmost everyone in paid work pays **National Insurance Contributions**, which fund **state benefits**, the **state retirement pension** and the **NHS**. Without enough contributions you may not get benefits such as **Jobseeker's Allowance** or a **full state pension**.\n\nYoung people are sent a **National Insurance number just before their 16th birthday**. Others apply through the **Department for Work and Pensions (DWP)**. An NI number **does not on its own prove your right to work**.\n\n## Driving\n- Minimum age: **17** for a car or motorcycle; **16** for a **moped**.\n- Get a **provisional licence**, then pass a **theory test** (multiple choice and **hazard perception**) and a **practical test**.\n- A licence lasts until you are **70**, then must be renewed **every three years**.\n- In Northern Ireland, new drivers display an **\"R\" plate** (restricted) for **one year**.\n- A licence from the **EU, Iceland, Liechtenstein or Norway** is valid as long as it is valid. Other foreign licences can be used for **12 months**.\n- Vehicles must be **registered with the DVLA**, have **road tax** and **insurance** (driving uninsured is a **serious criminal offence**), and cars over **three years old** need an annual **MOT** test.\n\n@remember\n- Income tax through **PAYE** to **HMRC**; self-employed use **self-assessment**\n- **National Insurance** pays for benefits, the state pension and the **NHS**\n- NI number arrives just before you turn **16**; it doesn't prove right to work\n- Drive at **17** (moped **16**); licence to **70**, then every **3** years\n- Non-EU licence valid **12 months**; NI new drivers show an **R plate** for 1 year\n- **MOT** yearly for vehicles over **3 years** old; driving uninsured is a crime\n\n@section Your role in the community\n## Shared values and responsibilities\n- to **obey and respect the law**\n- to be aware of and **respect the rights of others**\n- to **treat others with fairness**\n- to **behave responsibly**\n- to **help and protect your family**\n- to **respect and preserve the environment**\n- to **treat everyone equally**, regardless of sex, race, religion, age, disability, class or sexual orientation\n- to **work to provide** for yourself and your family\n- to **help others**\n- to **vote** in local and national elections\n\n## Being a good neighbour\nIntroduce yourself to neighbours, respect their privacy, **limit noise**, keep your garden tidy, and only put rubbish out **on collection day**.\n\n## Ways to get involved\n- **Jury service**: anyone on the electoral register aged **18 to 70** can be selected.\n- **Schools**: help in classrooms or join a **parent-teacher association (PTA)**.\n- **School governors** (school boards in Scotland) must be **18 or over**, with **no upper age limit**. Their three key roles: **setting the strategic direction**, **ensuring accountability**, and **monitoring and evaluating school performance**. In England, parents can apply to open a **free school**.\n- **Political parties**: members help at elections, e.g. **canvassing** door to door. **You don't have to tell a canvasser how you will vote.**\n- **Local services**: volunteer at hospitals or youth projects, become a **special constable**, a **lay (non-police) representative** or a **magistrate**.\n- **Blood and organ donation**: giving blood takes about **an hour**; you can join the **organ donor register**, and living people can donate a **kidney**.\n\n## Volunteering\nVolunteering is working for good causes **without payment** – it helps you meet people, practise English and gain skills for your CV. Charities include the **British Red Cross**, **Age UK** (older people), the **NSPCC** (children), **Crisis** and **Shelter** (homeless), **Cancer Research UK**, the **National Trust** and **Friends of the Earth** (environment), and the **PDSA** (animals).\n\nThe **National Citizen Service** gives **16- and 17-year-olds** outdoor activities, skills and a community project.\n\n## Looking after the environment\n**Recycle** as much as you can – it uses less energy and reduces landfill. **Shop locally** to support local businesses and reduce your **carbon footprint**. **Walk or use public transport** to create less pollution.\n\n@remember\n- **Jury service**: on the electoral register, aged **18–70**\n- School governors: **18+**, no upper age limit; set direction, ensure accountability, monitor performance\n- You **don't have to tell a canvasser** how you will vote\n- Volunteer as a **special constable**, **lay representative** or **magistrate**\n- Giving blood takes about **an hour**; living donors can give a **kidney**\n- **NSPCC** – children; **Age UK** – older people; **Crisis/Shelter** – homeless; **PDSA** – animals\n- **National Citizen Service** – ages **16–17**\n- Recycle, **shop locally**, walk or use public transport\n"], "cards": "# 1\nWhat are the five fundamental principles of British life? | Democracy, the rule of law, individual liberty, tolerance of different faiths and beliefs, participation in community life\nName two responsibilities of UK residents | Respect and obey the law; respect others' rights; treat others fairly; look after yourself and your family; look after your area and the environment\nName the five freedoms the UK offers | Freedom of belief and religion, freedom of speech, freedom from unfair discrimination, a fair trial, a right to join in electing a government\nWhere do British values come from? | History and traditions – protected by law, customs and expectations\nWhat do new citizens make at the citizenship ceremony? | A pledge of loyalty to the UK (and an oath or affirmation of allegiance to the King)\nHow many questions are in the Life in the UK test? | 24\nWhat is the pass mark for the test? | 75% – 18 out of 24\nHow long do you have for the test? | 45 minutes\nWhich other languages can the test be taken in? | Welsh or Scottish Gaelic (by special arrangement)\nHow many test centres are there? | About 60 registered centres\nHow can you book the test? | Online only\nWhat must you bring to the test? | Identification and proof of your address\nWhat English level is needed for settlement? | B1 (equivalent to ESOL Entry Level 3)\nWhat can you take instead if your English is below ESOL Entry Level 3? | An ESOL course in English with Citizenship\n\n# 2\nWhich countries make up the UK? | England, Scotland, Wales and Northern Ireland\nWhich countries make up Great Britain? | England, Scotland and Wales (not Northern Ireland)\nWhat is the UK's official name? | The United Kingdom of Great Britain and Northern Ireland\nWhat are the Crown dependencies? | The Channel Islands and the Isle of Man\nAre the Crown dependencies part of the UK? | No – they have their own governments\nName two British overseas territories | St Helena and the Falkland Islands\nWhere does the UK Parliament sit? | Westminster\nWhich parts of the UK have devolved parliaments or assemblies? | Scotland, Wales and Northern Ireland\nIs the rest of Ireland part of the UK? | No – it is an independent country\n\n# 3\nWhen did Britain become separated from the continent? | About 10,000 years ago\nWhen did the first farmers arrive in Britain? | About 6,000 years ago (probably from south-east Europe)\nWhere is Stonehenge? | Wiltshire, England\nWhat is Skara Brae? | The best-preserved prehistoric village in northern Europe, on Orkney\nWhat were Bronze Age tombs called? | Round barrows\nWhat is Maiden Castle? | An impressive Iron Age hill fort in Dorset\nWhat language family did Iron Age people speak? | Celtic\nWho led the failed Roman invasion of 55 BC? | Julius Caesar\nWhich emperor led the successful Roman invasion of AD 43? | Claudius\nWho was Boudicca? | Queen of the Iceni who fought the Romans – statue on Westminster Bridge\nWhy was Hadrian's Wall built? | To keep out the Picts (ancestors of the Scottish people)\nHow long did the Romans stay in Britain? | About 400 years (AD 43 – AD 410)\ d the First World War? | The assassination of Archduke Franz Ferdinand (28 June 1914)\nWhen did the First World War end? | 11.00 am on 11 November 1918\nHow many British casualties on the first day of the Somme? | About 60,000 (July 1916)\nWhat was the Easter Rising? | A 1916 uprising against the British in Dublin\nWhen did Ireland become two countries? | 1922\nWhen did the Irish Free State become a republic? | 1949\nWhen did the Great Depression begin? | 1929\nWhen did the BBC start the world's first regular TV service? | 1936\nWhy did Britain declare war in 1939? | Hitler invaded Poland\nWho were the Axis powers? | Germany, Italy and Japan\nWhat was Dunkirk? | The 1940 evacuation of over 300,000 soldiers, helped by small civilian boats\nWhat was the Battle of Britain? | The 1940 air battle won by the RAF (Spitfires and Hurricanes)\nWhat was the Blitz? | German night bombing of British cities\nWhich city was almost totally destroyed in the Blitz? | Coventry\nWhat was D-Day? | The allied landing in Normandy on 6 June 1944\nWho discovered penicillin? | Alexander Fleming (1928)\nWho first \"split the atom\"? | Scientists led by Ernest Rutherford\nWho was the Labour PM elected in 1945? | Clement Attlee\nWho led the creation of the NHS in 1948? | Aneurin (Nye) Bevan\nWhat were Beveridge's five Giant Evils? | Want, Disease, Ignorance, Squalor and Idleness\nWhat did the 1944 Education Act introduce? | Free secondary education (the \"Butler Act\")\nWho wrote Under Milk Wood? | Dylan Thomas, Welsh poet\nWho gave the \"wind of change\" speech? | Harold Macmillan\nWhen did the UK join the EEC? | 1973\nWho was Britain's first woman Prime Minister? | Margaret Thatcher (1979–1990)\nWhat happened in the Falklands in 1982? | Argentina invaded; a British taskforce recovered the islands\nWhat was signed in 1998? | The Good Friday Agreement (Northern Ireland)\nWho wrote Charlie and the Chocolate Factory? | Roald Dahl\nWho won Olympic gold in the pentathlon in 1972? | Mary Peters\nWho otland)\nWhich countries have their patron saint's day as an official holiday? | Scotland and Northern Ireland\nWhat are the national flowers of the UK? | England – rose; Scotland – thistle; Wales – daffodil; NI – shamrock\nWhen is Boxing Day? | 26 December – a public holiday\nWhat is Lent? | The 40 days before Easter\nWhat is Shrove Tuesday also called? | Pancake Day\nWho celebrates Diwali? | Hindus and Sikhs – the Festival of Lights\nWhich city has a famous Diwali celebration? | Leicester\nWhat is lit during Hannukah? | Candles on a menorah (eight days)\nWhat does Eid al-Fitr celebrate? | The end of Ramadan\nWhat does Vaisakhi celebrate? | The founding of the Sikh Khalsa (14 April)\nWhat is Hogmanay? | New Year's Eve in Scotland\nWhen is Mothering Sunday? | Three weeks before Easter\nWhat is remembered on Bonfire Night (5 November)? | The failed 1605 plot by Guy Fawkes to blow up Parliament\nWhat happens on Remembrance Day? | Poppies, a two-minute silence at 11 am, wreaths at the Cenotaph\nWhen has the UK hosted the Olympics? | 1908, 1948 and 2012\nWhere did the Paralympics originate? | Stoke Mandeville hospital (Dr Sir Ludwig Guttmann)\nWho first ran a mile in under four minutes? | Sir Roger Bannister (1954)\nWho captained England to win the 1966 World Cup? | Bobby Moore\nWho won rowing gold at five consecutive Olympics? | Sir Steve Redgrave\nWho was the first Briton to win the Tour de France? | Bradley Wiggins (2012)\nWhat did Mo Farah win in 2012? | Olympic gold in the 5,000m and 10,000m\nWhat did Jessica Ennis win in 2012? | Olympic gold in the heptathlon\nWhat did Andy Murray win in 2012? | The US Open men's singles\nWho won ice dancing gold in 1984? | Jayne Torvill and Christopher Dean\nWho is the fastest person to sail around the world single-handed? | Dame Ellen MacArthur (2004)\nWhat is the UK's most popular sport? | Football\nWhat is the Ashes? | Cricket Test series between England and Australia\nWhich countries play in the Six Nations? | England, Irelan ly held? | May\nWhich powers stay with the UK government? | Defence, foreign affairs, immigration, taxation and social security\nHow many members does the Scottish Parliament have? | 129 MSPs\nWhere does the Scottish Parliament sit? | Holyrood, Edinburgh\nHow many members does the Welsh Assembly have? | 60\nHow many members does the Northern Ireland Assembly have? | 90 MLAs\nWhere does the Northern Ireland Assembly meet? | Stormont, Belfast\nWhat is Hansard? | The official report of proceedings in Parliament\nWho can vote in all UK public elections? | UK citizens and resident Commonwealth and Irish citizens\nWhen is the electoral register updated? | Every September or October\nWhat are polling station opening hours? | 7.00 am to 10.00 pm\nWhat must voters in Northern Ireland show? | Photographic identification\nName groups who cannot stand for public office | Armed forces members, civil servants, people convicted of certain crimes\nWho is the head of the Commonwealth? | The monarch (King Charles III)\nWhat are the Commonwealth's core values? | Democracy, good government and the rule of law\nWhich treaty created the EEC in 1957? | The Treaty of Rome\nWhen did the UK leave the EU? | 31 January 2020\nWhat does the Council of Europe do? | Protects and promotes human rights (it cannot make laws)\nHow many permanent members does the UN Security Council have? | Five – including the UK\nWhat is NATO? | European and North American countries that help each other if attacked\nWhen did the UK sign the European Convention on Human Rights? | 1950\nWhich Act made the ECHR part of UK law? | The Human Rights Act 1998\nIs forced marriage legal in the UK? | No – it is a criminal offence (arranged marriage with consent is fine)\nWhat is the penalty for breaking a forced marriage protection order? | Up to two years in jail\nWhat is the difference between criminal and civil law? | Criminal law deals with crimes; civil law settles disputes between people\nGive two examples of civil law | Housing, consumer rights, employment, debt\nCan you carry a knife for self-defence? | No – carrying any weapon is a criminal offence\nWhat are the three duties of the police? | Protect life and property, prevent disturbances, prevent and detect crime\nWhat do Police and Crime Commissioners do? | Set local police priorities and budget and appoint the Chief Constable\nWhen were PCCs first elected? | November 2012\nWhere are minor criminal cases heard in England and Wales? | The Magistrates' Court\nWhere are minor criminal cases heard in Scotland? | The Justice of the Peace Court\nWhere are serious criminal cases heard in England? | The Crown Court\nHow many people are on a jury in England? | 12\nHow many people are on a jury in Scotland? | 15\nWhat third verdict exists in Scotland? | Not proven\nWhat ages does the Youth Court deal with? | 10 to 17\nWhat is used in Scotland for young offenders? | The Children's Hearings System\nWhich court deals with divorce and debt claims? | The County Court\nWhat is the small claims limit in England and Wales? | £10,000\nWhat is the small claims limit in Scotland and Northern Ireland? | £5,000\nWhat is PAYE? | Pay As You Earn – income tax taken directly from wages\nWhich department collects taxes? | HM Revenue & Customs (HMRC)\nWhat does National Insurance pay for? | State benefits, the state pension and the NHS\nWhen do young people get a National Insurance number? | Just before their 16th birthday\nWhat is the minimum age to drive a car? | 17\nWhat is the minimum age to ride a moped? | 16\nUntil what age is a driving licence valid? | 70 – then renewed every three years\nHow long can you drive on a non-EU foreign licence? | 12 months\nWhen does a car need an MOT? | Every year once it is over three years old\nWhat must new drivers in Northern Ireland display? | An \"R\" plate for one year\nWho can be called for jury service? | Anyone on the electoral register aged 18 to 70\nWhat are the three roles of school governors? | Setting strategic direction, ensuring accountability, monitoring school performance\nDo you have to tell a canvasser how you will vote? | No\nWhat is the National Citizen Service? | A programme for 16- and 17-year-olds\nName a charity that helps children | The NSPCC\nName a charity that helps older people | Age UK\nHow long does giving blood take? | About an hour\n", "questions": ["# 1\nQ: Which TWO are fundamental principles of British life?\n+ Democracy\n+ The rule of law\n- Loyalty to your employer\n- A duty to vote in every election\nE: The five principles are **democracy, the rule of law, individual liberty, tolerance of different faiths and beliefs, and participation in community life**.\n\nQ: Which of these is a fundamental principle of British life?\n+ Individual liberty\n- National service\n- Free healthcare for visitors\n- Compulsory religious worship\nE: **Individual liberty** is one of the five fundamental principles.\n\nQ: Which TWO are fundamental principles of British life?\n+ Tolerance of those with different faiths and beliefs\n+ Participation in community life\n- Extremism\n- Intolerance of other religions\nE: Tolerance and **participation in community life** are both principles. There is **no place for extremism or intolerance**.\n\nQ: What are TWO responsibilities you will have as a UK resident or citizen?\n+ To look after the area in which you live and the environment\n+ To look after yourself and your family\n- To stay in the UK forever\n- To join a political party\nE: You should **respect and obey the law, respect others' rights, treat others fairly, look after yourself and your family, and look after your area and the environment**.\n\nQ: Which TWO freedoms does the UK offer its residents?\n+ Freedom of speech\n+ Freedom of belief and religion\n- Freedom to ignore the law\n- Freedom from paying tax\nE: The UK offers **freedom of belief and religion, freedom of speech, freedom from unfair discrimination, a fair trial and a right to join in the election of a government**.\n\nQ: Which TWO are rights offered by the UK to residents?\n+ A right to a fair trial\n+ Freedom from unfair discrimination\n- A right to free housing\n- A right to vote at the age of 16\nE: The UK offers **a right to a fair trial** and **freedom from unfair discrimination**, among others.\n\nQ: British values are based on which TWO things?\n+ History\n+ Traditions\n- Wealth\n- Religion only\nE: British values are **based on history and traditions** and are protected by law, customs and expectations.\n\nQ: There is a place in British society for extremism and intolerance.\n- True\n+ False\nE: There is **no place in British society for extremism or intolerance**.\n\nQ: Which statement is correct?\n+ New citizens pledge to uphold British values at their citizenship ceremony\n- New citizens pledge to join the armed forces at their citizenship ceremony\nE: At the **citizenship ceremony** new citizens make a **pledge** to uphold British values and observe the law.\n\nQ: How many questions are in the Life in the UK test?\n+ 24\n- 20\n- 30\n- 40\nE: The test has **24 questions** about important aspects of life in the UK.\n\nQ: What percentage do you need to pass the Life in the UK test?\n+ 75%\n- 50%\n- 60%\n- 90%\nE: You need **75% – 18 out of 24 correct**.\n\nQ: Life in the UK test questions are based only on the history chapter of the handbook.\n- True\n+ False\nE: Questions are based on **all parts of the handbook**, including the introduction.\n\nQ: Which TWO languages, besides English, can the Life in the UK test be taken in by special arrangement?\n+ Welsh\n+ Scottish Gaelic\n- French\n- Irish Gaelic\nE: The test can be taken in **Welsh or Scottish Gaelic** by special arrangement.\n\nQ: How can you book the Life in the UK test?\n+ Online only\n- By telephone\n- At a post office\n- At any public library\nE: You can **only book online**, and must take the test at a registered centre.\n\nQ: What must you take with you to the Life in the UK test?\n+ Identification and proof of your address\n- Your birth certificate and a passport photo\n- A letter from your employer\n- Your national insurance card only\nE: You need **identification and proof of your address** or you will not be able to take the test.\n\nQ: About how many Life in the UK test centres are there?\n+ 60\n- 10\n- 200\n- 500\nE: There are **about 60** registered and approved test centres around the UK.\n\nQ: You can take the Life in the UK test at any college or school.\n- True\n+ False\nE: You must take the test at a **registered and approved test centre** – other certificates are not accepted.\n\nQ: Which TWO places have different arrangements for taking the Life in the UK test?\n+ The Isle of Man\n+ The Channel Islands\n- Northern Ireland\n- Wales\nE: People living on the **Isle of Man** or in the **Channel Islands** have different arrangements.\n\nQ: Which statement is correct?\n+ To settle in the UK you need to pass the Life in the UK test and show English at B1 level\n- To settle in the UK you only need to have lived here for one year\nE: For settlement you must **pass the Life in the UK test** and show speaking and listening skills in English at **B1** (ESOL Entry Level 3).\n", "# 2\nQ: Which countries make up Great Britain?\n+ England, Scotland and Wales\n- England, Scotland, Wales and Northern Ireland\n- England and Scotland only\n- England, Wales and Northern Ireland\nE: **Great Britain** is England, Scotland and Wales – it does **not** include Northern Ireland.\n\nQ: What is the official name of the country?\n+ The United Kingdom of Great Britain and Northern Ireland\n- Great Britain\n- The British Isles\n- The United Kingdom of England and Ireland\nE: The official name is **the United Kingdom of Great Britain and Northern Ireland**.\n\nQ: Northern Ireland is part of Great Britain.\n- True\n+ False\nE: Northern Ireland is part of the **UK**, but **Great Britain** means only England, Scotland and Wales.\n\nQ: Which TWO places are Crown dependencies?\n+ The Isle of Man\n+ The Channel Islands\n- The Falkland Islands\n- St Helena\nE: The **Channel Islands** and the **Isle of Man** are **Crown dependencies** with their own governments.\n\nQ: Which statement is correct?\n+ The Channel Islands are not part of the UK\n- The Channel Islands are part of the UK\nE: The Channel Islands are closely linked to the UK but are **not part of it**.\n\nQ: Which TWO are British overseas territories?\n+ The Falkland Islands\n+ St Helena\n- The Isle of Man\n- Jersey\nE: **St Helena** and the **Falkland Islands** are British overseas territories – linked to the UK but not part of it.\n\nQ: Where does the UK Parliament sit?\n+ Westminster\n- Windsor\n- Edinburgh\n- Manchester\nE: The UK is governed by the Parliament sitting in **Westminster**.\n\nQ: The Republic of Ireland is part of the UK.\n- True\n+ False\nE: The rest of Ireland is an **independent country**.\n\nQ: Which countries have their own devolved parliaments or assemblies?\n+ Scotland, Wales and Northern Ireland\n- England, Scotland and Wales\n- Only Scotland\n- England and Northern Ireland\nE: **Scotland, Wales and Northern Ireland** have their own parliaments or assemblies with **devolved powers**.\n\nQ: Which TWO countries are part of the UK?\n+ Wales\n+ Northern Ireland\n- The Republic of Ireland\n- The Isle of Man\nE: The UK is **England, Scotland, Wales and Northern Ireland**.\n\nQ: Which statement is correct?\n+ The Crown dependencies have their own governments\n- The Crown dependencies are governed directly by the Scottish Parliament\nE: The **Channel Islands** and the **Isle of Man** have **their own governments**.\n", "# 3\nQ: When did Britain become permanently separated from the continent?\n+ About 10,000 years ago\n- About 6,000 years ago\n- About 4,000 years ago\n- About 2,000 years ago\nE: Britain became separated by the Channel **about 10,000 years ago**.\n\nQ: When did the first farmers arrive in Britain?\n+ About 6,000 years ago\n- About 10,000 years ago\n- About 2,000 years ago\n- About 1,000 years ago\nE: The first farmers arrived **about 6,000 years ago**, probably from **south-east Europe**.\n\nQ: In which English county is Stonehenge?\n+ Wiltshire\n- Dorset\n- Kent\n- Yorkshire\nE: **Stonehenge** stands in **Wiltshire**.\n\nQ: Where is Skara Brae?\n+ Orkney\n- Wiltshire\n- Dorset\n- Anglesey\nE: **Skara Brae on Orkney** is the best-preserved prehistoric village in northern Europe.\n\nQ: What is Maiden Castle in Dorset?\n+ An Iron Age hill fort\n- A Norman castle\n- A Roman villa\n- A Stone Age village\nE: **Maiden Castle** is an impressive **Iron Age hill fort**.\n\nQ: What were Bronze Age tombs called?\n+ Round barrows\n- Hill forts\n- Roundhouses\n- Crofts\nE: People in the Bronze Age buried their dead in **round barrows** and lived in roundhouses.\n\nQ: Which language family did people in the Iron Age speak?\n+ Celtic\n- Anglo-Saxon\n- Norman French\n- Latin\nE: Iron Age people spoke languages from the **Celtic** family.\n\nQ: Which statement is correct?\n+ The first coins minted in Britain were made in the Iron Age\n- The first coins minted in Britain were made by the Normans\nE: Iron Age people made **the first coins minted in Britain**, marking the beginning of British history.\n\nQ: Who led the unsuccessful Roman invasion of Britain in 55 BC?\n+ Julius Caesar\n- Claudius\n- Hadrian\n- Boudicca\nE: **Julius Caesar** invaded in **55 BC** but failed.\n\nQ: In what year did the Romans successfully invade Britain under Emperor Claudius?\n+ AD 43\n- 55 BC\n- AD 410\n- AD 789\nE: In **AD 43 Emperor Claudius** led the successful invasion.\n\nQ: Who was Boudicca?\n+ Queen of the Iceni who fought the Romans\n- A Saxon queen who defeated the Vikings\n- A Roman empress\n- A Scottish queen who fought the English\nE: **Boudicca**, queen of the **Iceni**, fought the Romans. Her statue stands on **Westminster Bridge**.\n\nQ: Why was Hadrian's Wall built?\n+ To keep out the Picts\n- To keep out the Vikings\n- To keep out the Normans\n- To defend against the French\nE: Emperor **Hadrian** built the wall to keep out the **Picts**, ancestors of the Scottish people.\n\nQ: How long did the Romans stay in Britain?\n+ 400 years\n- 100 years\n- 200 years\n- 600 years\nE: The Romans stayed for **400 years** (AD 43 to AD 410).\n\nQ: Which TWO forts on Hadrian's Wall can still be seen?\n+ Housesteads\n+ Vindolanda\n- Maiden Castle\n- Sutton Hoo\nE: **Housesteads** and **Vindolanda** are forts on Hadrian's Wall, a **UNESCO World Heritage Site**.\n\nQ: In which centuries did the first Christian communities appear in Britain?\n+ 3rd and 4th centuries AD\n- 1st and 2nd centuries AD\n- 6th and 7th centuries AD\n- 9th and 10th centuries AD\nE: The first Christian communities appeared in the **3rd and 4th centuries AD**, under the Romans.\n\nQ: Which TWO tribes invaded Britain after the Romans left?\n+ The Angles\n+ The Saxons\n- The Normans\n- The Picts\nE: The **Jutes, Angles and Saxons** invaded after AD 410. Their languages are the basis of modern English.\n\nQ: Where was an Anglo-Saxon king buried with treasure in a ship?\n+ Sutton Hoo\n- Skara Brae\n- Iona\n- Canterbury\nE: A king was buried in a ship at **Sutton Hoo in Suffolk**.\n\nQ: Who became the first Archbishop of Canterbury?\n+ St Augustine\n- St Columba\n- St Patrick\n- St David\nE: **St Augustine** led missionaries from Rome and became the first Archbishop of Canterbury.\n\nQ: Who founded a monastery on the island of Iona?\n+ St Columba\n- St Augustine\n- St Andrew\n- St George\nE: **St Columba**, a missionary from Ireland, founded a monastery on **Iona**.\n\nQ: Where did the Vikings come from?\n+ Denmark and Norway\n- Germany and the Netherlands\n- France and Belgium\n- Sweden and Finland\nE: The Vikings came from **Denmark and Norway**, first raiding in **AD 789**.\n\nQ: Who defeated the Vikings and united the Anglo-Saxon kingdoms?\n+ King Alfred the Great\n- King Cnut\n- Kenneth MacAlpin\n- William the Conqueror\nE: The Anglo-Saxon kingdoms united under **King Alfred the Great**, who defeated the Vikings.\n\nQ: What was the area of Viking settlement in England called?\n+ The Danelaw\n- The Pale\n- The Highlands\n- Wessex\nE: Vikings settled in the east and north of England in the **Danelaw**.\n\nQ: Who was the first Danish king to rule England?\n+ Cnut\n- Alfred\n- Harold\n- Kenneth MacAlpin\nE: The first Danish king was **Cnut (Canute)**.\n\nQ: Under which king did the people of Scotland first unite?\n+ Kenneth MacAlpin\n- Robert the Bruce\n- James VI\n- Alfred the Great\nE: The Viking threat led the people of Scotland to unite under **Kenneth MacAlpin**.\n\nQ: Which battle took place in 1066?\n+ The Battle of Hastings\n- The Battle of Bannockburn\n- The Battle of Agincourt\n- The Battle of Bosworth Field\nE: In **1066 William of Normandy** defeated **King Harold** at the **Battle of Hastings**.\n\nQ: Where can the Bayeux Tapestry be seen today?\n+ France\n- London\n- Edinburgh\n- The Netherlands\nE: The **Bayeux Tapestry**, showing the Battle of Hastings, is in **France**.\n\nQ: What was the Domesday Book?\n+ A record of towns, villages, people, land and animals in England\n- A collection of Anglo-Saxon poems\n- The first English Bible\n- A list of laws made by King John\nE: William the Conqueror ordered the **Domesday Book**, which still exists and gives a picture of England after the conquest.\n\nQ: The Norman Conquest was the last successful foreign invasion of England.\n+ True\n- False\nE: The Norman Conquest of **1066** was **the last successful foreign invasion of England**.\n\nQ: Which TWO castles were built in Wales by Edward I?\n+ Conwy\n+ Caernarvon\n- Windsor\n- Edinburgh\nE: After the **Statute of Rhuddlan (1284)**, Edward I built castles such as **Conwy and Caernarvon**.\n\nQ: In which battle did Robert the Bruce defeat the English?\n+ Bannockburn\n- Culloden\n- Hastings\n- Agincourt\nE: In **1314** the Scots, led by **Robert the Bruce**, won at **Bannockburn**.\n\nQ: What was the area of Ireland ruled by the English by 1200 called?\n+ The Pale\n- The Danelaw\n- Ulster\n- The Plantation\nE: By **1200** the English ruled an area around **Dublin** known as **the Pale**.\n\nQ: How long did the Hundred Years War actually last?\n+ 116 years\n- 100 years\n- 99 years\n- 150 years\nE: Despite its name, the Hundred Years War lasted **116 years**.\n\nQ: Which king's army defeated the French at the Battle of Agincourt in 1415?\n+ Henry V\n- Henry VIII\n- Edward I\n- Richard III\nE: **Henry V**'s outnumbered army won at **Agincourt in 1415**.\n\nQ: What fraction of the population of England died in the Black Death?\n+ One third\n- One half\n- One quarter\n- Two thirds\nE: The **Black Death (1348)** killed **one third** of England's population.\n\nQ: Which TWO things happened after the Black Death?\n+ There were labour shortages and peasants demanded higher wages\n+ A strong middle class developed in the towns\n- The population grew rapidly\n- Peasants were forbidden to leave the countryside forever\nE: After the Black Death there were **labour shortages**, the **gentry** appeared and a **middle class** grew in the towns.\n\nQ: What was the system of land ownership used by the Normans?\n+ Feudalism\n- Communism\n- The clan system\n- Capitalism\nE: Under **feudalism** the king gave land to lords in return for help in war; most peasants were **serfs**.\n\nQ: Which king was forced to agree to the Magna Carta in 1215?\n+ King John\n- King Henry VIII\n- King Edward I\n- King Charles I\nE: In **1215 King John** was forced by his noblemen to agree to the **Magna Carta**.\n\nQ: What did the Magna Carta establish?\n+ That even the king was subject to the law\n- That all men could vote\n- That the Church was independent of the king\n- That Parliament would be elected every year\nE: Magna Carta established that **the king was subject to the law** and restricted his power to tax or change laws.\n\nQ: The Scottish Parliament in the Middle Ages had three Houses. What were they called?\n+ Estates\n- Chambers\n- Assemblies\n- Councils\nE: Scotland's Parliament had three **Estates**: the lords, the commons and the clergy.\n\nQ: How did judges in England develop common law?\n+ By precedent and tradition\n- By writing every law down in one book\n- By following the instructions of the king\n- By asking the Pope\nE: English judges developed **common law** by **precedent** (following previous decisions); Scottish laws were **codified**.\n\nQ: By about which year was English the preferred language of the royal court and Parliament?\n+ 1400\n- 1066\n- 1215\n- 1603\nE: By **1400** official documents were written in English.\n\nQ: Who wrote The Canterbury Tales?\n+ Geoffrey Chaucer\n- William Caxton\n- John Barbour\n- William Shakespeare\nE: **Geoffrey Chaucer** wrote The Canterbury Tales, about pilgrims travelling to Canterbury.\n\nQ: Who was the first person in England to print books using a printing press?\n+ William Caxton\n- Geoffrey Chaucer\n- Samuel Pepys\n- John Milton\nE: **William Caxton** was the first person in England to print books; The Canterbury Tales was one of his first.\n\nQ: Which cathedral is famous for its medieval stained glass?\n+ York Minster\n- St Paul's Cathedral\n- Westminster Cathedral\n- Liverpool Cathedral\nE: **York Minster** is a famous example of medieval stained glass.\n\nQ: Which TWO families fought in the Wars of the Roses?\n+ The House of York\n+ The House of Lancaster\n- The House of Tudor\n- The House of Stuart\nE: The **House of Lancaster (red rose)** and the **House of York (white rose)** fought the Wars of the Roses.\n\nQ: Which battle ended the Wars of the Roses?\n+ Bosworth Field\n- Hastings\n- Agincourt\n- Culloden\nE: The war ended at **Bosworth Field in 1485**, where **Richard III** was killed.\n\nQ: What is the symbol of the House of Tudor?\n+ A red rose with a white rose inside\n- A white rose with a red rose inside\n- A thistle\n- A red dragon\nE: The **Tudor rose** shows a red ro
