se with a white rose inside, uniting Lancaster and York.\n\nQ: Who was the first Tudor king?\n+ Henry VII\n- Henry VIII\n- Richard III\n- Edward VI\nE: **Henry Tudor** became **Henry VII** after Bosworth and married Elizabeth of York.\n\nQ: Who was Henry VIII's first wife?\n+ Catherine of Aragon\n- Anne Boleyn\n- Jane Seymour\n- Catherine Parr\nE: Henry's wives in order: **Catherine of Aragon, Anne Boleyn, Jane Seymour, Anne of Cleves, Catherine Howard, Catherine Parr**.\n\nQ: Which wife of Henry VIII gave birth to his son Edward?\n+ Jane Seymour\n- Anne Boleyn\n- Catherine Howard\n- Anne of Cleves\nE: **Jane Seymour** gave Henry his son **Edward** but died shortly after the birth.\n\nQ: Which TWO wives of Henry VIII were executed?\n+ Anne Boleyn\n+ Catherine Howard\n- Catherine Parr\n- Anne of Cleves\nE: **Anne Boleyn** and her cousin **Catherine Howard** were both executed.\n\nQ: Which wife of Henry VIII outlived him?\n+ Catherine Parr\n- Catherine of Aragon\n- Jane Seymour\n- Anne of Cleves\nE: **Catherine Parr**, a widow, survived Henry.\n\nQ: Why did Henry VIII establish the Church of England?\n+ The Pope refused to let him divorce his first wife\n- He wanted to become Pope\n- Parliament ordered him to\n- He wanted to make Scotland Protestant\nE: When the **Pope refused** Henry a divorce, he set up the **Church of England**, where the king appointed bishops.\n\nQ: Under which king was Wales formally united with England by the Act for the Government of Wales?\n+ Henry VIII\n- Edward I\n- Henry VII\n- James I\nE: During **Henry VIII**'s reign, the **Act for the Government of Wales** united Wales with England.\n\nQ: Which book was written for the Church of England during Edward VI's reign?\n+ The Book of Common Prayer\n- The King James Bible\n- The Domesday Book\n- The Canterbury Tales\nE: The **Book of Common Prayer** was written in **Edward VI**'s reign.\n\nQ: Why was Queen Mary I known as \"Bloody Mary\"?\n+ She persecuted Protestants\n- She executed her husband\n- She lost a war against France\n- She persecuted Catholics\nE: Mary was a devout **Catholic** who **persecuted Protestants**.\n\nQ: What happened in 1588?\n+ The English defeated the Spanish Armada\n- Elizabeth I became queen\n- The Great Fire of London\n- The Act of Union\nE: In **1588** the English defeated the **Spanish Armada**, sent to restore Catholicism.\n\nQ: Elizabeth I was the daughter of Henry VIII and Anne Boleyn.\n+ True\n- False\nE: **Elizabeth I** was the daughter of **Henry VIII and Anne Boleyn**.\n\nQ: Which statement is correct about the Church of Scotland established in 1560?\n+ It was not a state Church\n- It was a Roman Catholic Church\nE: The Protestant **Church of Scotland** was **not a state Church**, unlike the Church of England.\n\nQ: Who was Mary, Queen of Scots?\n+ A Catholic queen of Scotland who was executed for plotting against Elizabeth I\n- Elizabeth I's daughter\n- The wife of James I\n- A Protestant queen who ruled England and Scotland\nE: **Mary Stuart** was Catholic. Elizabeth I held her prisoner for **20 years** before she was **executed**.\n\nQ: Who sailed the Golden Hind, one of the first ships to sail around the world?\n+ Sir Francis Drake\n- Sir Walter Raleigh\n- Captain James Cook\n- Admiral Nelson\nE: **Sir Francis Drake**, a commander against the Armada, sailed the **Golden Hind**.\n\nQ: Where was William Shakespeare born?\n+ Stratford-upon-Avon\n- London\n- Oxford\n- Canterbury\nE: Shakespeare was born in **Stratford-upon-Avon**.\n\nQ: Which play contains the line \"To be or not to be\"?\n+ Hamlet\n- Macbeth\n- Romeo and Juliet\n- Henry V\nE: \"To be or not to be\" is from **Hamlet**.\n\nQ: \"Once more unto the breach\" is a quote from which Shakespeare play?\n+ Henry V\n- Hamlet\n- As You Like It\n- A Midsummer Night's Dream\nE: \"Once more unto the breach\" is from **Henry V**.\n\nQ: Which Shakespeare play includes \"All the world's a stage\"?\n+ As You Like It\n- Romeo and Juliet\n- Macbeth\n- Hamlet\nE: \"All the world's a stage\" is from **As You Like It**.\n\nQ: Who became King James I of England in 1603?\n+ James VI of Scotland\n- James II\n- The son of Henry VIII\n- William of Orange\nE: When Elizabeth I died in **1603**, her cousin **James VI of Scotland** became **James I** of England, Wales and Ireland.\n\nQ: Which statement is correct?\n+ When James I became king, Scotland remained a separate country\n- When James I became king, Scotland and England became one country\nE: James ruled both, but **Scotland remained a separate country** until 1707.\n\nQ: What was the King James Version?\n+ A translation of the Bible into English\n- A new set of laws\n- A book of prayers for Scotland\n- A history of England\nE: The **King James Version (Authorised Version)** of the Bible is still used in many Protestant churches.\n\nQ: What were the \"plantations\" in Ireland?\n+ Settlements of Protestants on land taken from Catholics in Ulster\n- Farms growing tobacco\n- Monasteries founded by St Patrick\n- Royal parks\nE: Scottish and English Protestants settled in **Ulster**, taking over Catholic land – these were the **plantations**.\n\nQ: What was the \"Divine Right of Kings\"?\n+ The idea that the king was appointed by God\n- The right of kings to choose bishops\n- The right of Parliament to remove the king\n- The king's right to marry more than once\nE: **James I and Charles I** believed in the **Divine Right of Kings** – that they did not need Parliament's approval.\n\nQ: When did the English Civil War begin?\n+ 1642\n- 1603\n- 1649\n- 1660\nE: Civil war between the king and Parliament began in **1642**.\n\nQ: What were supporters of the king called during the Civil War?\n+ Cavaliers\n- Roundheads\n- Puritans\n- Jacobites\nE: The king's supporters were **Cavaliers**; Parliament's were **Roundheads**.\n\nQ: At which TWO battles was the king's army defeated in the Civil War?\n+ Marston Moor\n+ Naseby\n- Bannockburn\n- Culloden\nE: Charles I's army was defeated at **Marston Moor and Naseby**.\n\nQ: In what year was Charles I executed?\n+ 1649\n- 1642\n- 1660\n- 1688\nE: Charles I was **executed in 1649** and England became a republic.\n\nQ: What was England called when it became a republic after 1649?\n+ The Commonwealth\n- The Protectorate of Great Britain\n- The Union\n- The Free State\nE: England declared itself a republic called **the Commonwealth**.\n\nQ: What title did Oliver Cromwell hold?\n+ Lord Protector\n- King of England\n- Prime Minister\n- Lord Chancellor\nE: **Oliver Cromwell** ruled as **Lord Protector** until his death in **1658**.\n\nQ: How did Charles II famously escape after the Battle of Worcester?\n+ He hid in an oak tree\n- He disguised himself as a woman\n- He swam across a river\n- He hid in a church\nE: Charles II escaped from **Worcester**, famously **hiding in an oak tree**.\n\nQ: What was the Restoration?\n+ Charles II returning as king in 1660\n- The rebuilding of London after the Great Fire\n- The return of the Catholic Church\n- The repair of Hadrian's Wall\nE: In **1660** Parliament invited **Charles II** back from the Netherlands: **the Restoration**.\n\nQ: Who designed the new St Paul's Cathedral after the Great Fire of London?\n+ Sir Christopher Wren\n- Inigo Jones\n- Robert Adam\n- Isambard Kingdom Brunel\nE: **Sir Christopher Wren** designed the new **St Paul's Cathedral**.\n\nQ: Who wrote a famous diary describing the plague and the Great Fire of London?\n+ Samuel Pepys\n- Isaac Newton\n- John Milton\n- Christopher Wren\nE: **Samuel Pepys** wrote about these events in a diary that is still read today.\n\nQ: What did the Habeas Corpus Act of 1679 guarantee?\n+ That no one could be held prisoner unlawfully\n- That everyone could vote\n- That the king must be Protestant\n- Freedom of the press\nE: **Habeas corpus** means \"you must present the person in court\" – **every prisoner has a right to a court hearing**.\n\nQ: What is the Royal Society?\n+ The oldest surviving scientific society in the world\n- A group of royal advisers\n- A charity for the poor\n- The first political party\nE: The **Royal Society**, formed under Charles II, is **the oldest surviving scientific society** in the world.\n\nQ: Which TWO discoveries did Isaac Newton make?\n+ How gravity applies to the whole universe\n+ That white light is made up of the colours of the rainbow\n- Penicillin\n- The structure of DNA\nE: Newton's **Principia Mathematica** described **gravity**, and he showed **white light contains the colours of the rainbow**.\n\nQ: What was the Glorious Revolution of 1688?\n+ William of Orange took the throne from James II without fighting in England\n- A violent uprising against Charles I\n- The restoration of Charles II\n- The union of England and Scotland\nE: It was \"glorious\" because there was **no fighting in England** and it **guaranteed the power of Parliament**.\n\nQ: Where was James II defeated in 1690?\n+ The Battle of the Boyne\n- The Battle of Culloden\n- The Battle of Naseby\n- The Battle of Waterloo\nE: William III defeated James II at the **Battle of the Boyne** in Ireland in **1690**.\n\nQ: What were supporters of James II known as?\n+ Jacobites\n- Whigs\n- Roundheads\n- Huguenots\nE: James's supporters were called **Jacobites**.\n\nQ: What did the Bill of Rights of 1689 confirm?\n+ The rights of Parliament and the limits of the king's power\n- The right of all adult men to vote\n- The abolition of slavery\n- The union of England and Scotland\nE: The **Bill of Rights (1689)** confirmed **the rights of Parliament** and the **limits of the king's power**.\n\nQ: The Bill of Rights of 1689 gave the vote to all adult men.\n- True\n+ False\nE: Only **men who owned property** could vote; no women had the vote.\n\nQ: Which TWO groups were the beginning of party politics in Parliament?\n+ The Whigs\n+ The Tories\n- The Chartists\n- The Jacobites\nE: The **Whigs** and the **Tories** were the two main groups – the beginning of **party politics**.\n\nQ: From which year could newspapers operate without a government licence?\n+ 1695\n- 1215\n- 1832\n- 1918\nE: From **1695** newspapers did not need a licence – the beginning of a **free press**.\n\nQ: What were \"rotten boroughs\"?\n+ Constituencies with hardly any voters\n- Constituencies controlled by one wealthy family\n- Towns destroyed in the Civil War\n- Areas with a lot of crime\nE: **Rotten boroughs** had hardly any voters; **pocket boroughs** were controlled by one wealthy family.\n\nQ: Who were the Huguenots?\n+ French Protestant refugees\n- Dutch settlers in South Africa\n- Scottish Catholics\n- Russian Jews\nE: Between **1680 and 1720** many **Huguenots** – French Protestants persecuted for their religion – came to Britain.\n\nQ: In which year did the first Jews since the Middle Ages settle in London?\n+ 1656\n- 1066\n- 1707\n- 1870\nE: The first Jews to come to Britain since the Middle Ages settled in London in **1656**.\n\nQ: What did the Act of Union of 1707 create?\n+ The Kingdom of Great Britain\n- The United Kingdom of Great Britain and Ireland\n- The Commonwealth\n- The European Union\nE: The **Act of Union (Treaty of Union) of 1707** joined England, Wales and Scotland as **the Kingdom of Great Britain**.\n\nQ: Which TWO things did Scotland keep after the Act of Union in 1707?\n+ Its own legal system\n+ Its own education system\n- Its own king\n- Its own parliament\nE: Scotland kept its own **legal and education systems** and **Presbyterian Church**.\n\nQ: Who was the first Prime Minister of Great Britain?\n+ Sir Robert Walpole\n- Winston Churchill\n- William Pitt\n- The Duke of Wellington\nE: **Sir Robert Walpole** was the first Prime Minister, from **1721 to 1742**.\n\nQ: Why did George I rely heavily on his ministers?\n+ He did not speak very good English\n- He was too young to rule\n- He was often ill\n- He lived in Scotland\nE: **George I**, a German, did not speak good English, so relied on ministers – leading to the role of **Prime Minister**.\n\nQ: Who was defeated at the Battle of Culloden in 1746?\n+ Bonnie Prince Charlie\n- James II\n- Robert the Bruce\n- Napoleon\nE: **Charles Edward Stuart (Bonnie Prince Charlie)** was defeated by George II's army at **Culloden in 1746**.\n\nQ: What were the Highland Clearances?\n+ Scottish landlords destroying small farms to make way for sheep and cattle\n- The removal of English settlers from Scotland\n- The building of roads in the Highlands\n- The clearing of forests for farmland by the Romans\nE: Landlords destroyed small farms (**crofts**) for sheep and cattle; many Scots emigrated to North America.\n\nQ: Who wrote \"Auld Lang Syne\"?\n+ Robert Burns\n- Walter Scott\n- Dylan Thomas\n- William Wordsworth\nE: **Robert Burns**, known as **\"The Bard\"**, wrote Auld Lang Syne, sung at New Year.\n\nQ: Which TWO were important Scottish thinkers of the Enlightenment?\n+ Adam Smith\n+ David Hume\n- Isaac Newton\n- Charles Dickens\nE: **Adam Smith** (economics) and **David Hume** (human nature) were leading Enlightenment thinkers.\n\nQ: What was the Bessemer process used for?\n+ Mass-producing steel\n- Spinning cotton\n- Printing books\n- Making penicillin\nE: The **Bessemer process** for mass-producing **steel** helped shipbuilding and the railways.\n\nQ: What job did Richard Arkwright originally do?\n+ Barber\n- Teacher\n- Soldier\n- Doctor\nE: **Richard Arkwright** trained as a **barber**, then improved the carding machine and ran efficient factories.\n\nQ: Who opened the first curry house in Britain?\n+ Sake Dean Mahomet\n- Mahatma Gandhi\n- Isambard Kingdom Brunel\n- William Wilberforce\nE: **Sake Dean Mahomet** opened the **Hindoostane Coffee House** in London in **1810**.\n\nQ: Which group set up the first formal anti-slavery groups?\n+ The Quakers\n- The Puritans\n- The Methodists\n- The Huguenots\nE: The **Quakers** set up the first formal anti-slavery groups in the late 1700s.\n\nQ: Which MP played an important part in abolishing the slave trade?\n+ William Wilberforce\n- Robert Walpole\n- Winston Churchill\n- Oliver Cromwell\nE: **William Wilberforce**, an evangelical Christian MP, helped turn public opinion against the slave trade.\n\nQ: In which year did the Emancipation Act abolish slavery throughout the British Empire?\n+ 1833\n- 1807\n- 1776\n- 1901\nE: The slave trade was banned in **1807**; the **Emancipation Act of 1833** abolished slavery itself.\n\nQ: When did 13 American colonies declare their independence?\n+ 1776\n- 1707\n- 1783\n- 1805\nE: In **1776** 13 colonies declared independence; Britain recognised it in **1783**.\n\nQ: Who commanded the British fleet at the Battle of Trafalgar in 1805?\n+ Admiral Nelson\n- The Duke of Wellington\n- Sir Francis Drake\n- Captain James Cook\nE: **Admiral Nelson** won at **Trafalgar** but was killed. **Nelson's Column** is in Trafalgar Square.\n\nQ: Where can HMS Victory be visited?\n+ Portsmouth\n- London\n- Plymouth\n- Liverpool\nE: Nelson's ship **HMS Victory** can be visited in **Portsmouth**.\n\nQ: Who defeated Napoleon at the Battle of Waterloo in 1815?\n+ The Duke of Wellington\n- Admiral Nelson\n- George III\n- Oliver Cromwell\nE: The **Duke of Wellington**, \"the Iron Duke\", defeated Napoleon at **Waterloo in 1815**.\n\nQ: Which crosses make up the Union Flag?\n+ St George, St Andrew and St Patrick\n- St George, St David and St Andrew\n- St David, St Patrick and St Andrew\n- St George, St David and St Patrick\nE: The Union Flag combines the crosses of **St George, St Andrew and St Patrick**.\n\nQ: What does the cross of St Andrew look like?\n+ A diagonal white cross on a blue ground\n- A red cross on a white ground\n- A diagonal red cross on a white ground\n- A yellow cross on a black ground\nE: **St Andrew** (Scotland): **diagonal white cross on blue**. St George: red cross on white. St Patrick: diagonal red cross on white.\n\nQ: Why does the Welsh dragon not appear on the Union Flag?\n+ Wales was already united with England when the first Union Flag was created\n- Wales did not want to be included\n- The dragon was too difficult to design\n- Wales was not part of the UK in 1801\nE: When the first Union Flag was made in **1606**, Wales was **already united with England**.\n\nQ: When did Queen Victoria become queen?\n+ 1837\n- 1801\n- 1851\n- 1901\nE: **Victoria** became queen in **1837 aged 18** and reigned until **1901**.\n\nQ: How long did Queen Victoria reign?\n+ Almost 64 years\n- 50 years\n- 45 years\n- 70 years\nE: Victoria reigned for **almost 64 years**.\n\nQ: About how many people did the British Empire include at its height?\n+ More than 400 million\n- 40 million\n- 100 million\n- 1 billion\nE: The British Empire was the largest the world has seen, with **more than 400 million** people.\n\nQ: What did the repeal of the Corn Laws in 1846 allow?\n+ The import of cheap grain\n- Farmers to sell land\n- Children to work in factories\n- Workers to form unions\nE: Repealing the **Corn Laws (1846)** allowed **cheap grain** to be imported.\n\nQ: In 1847 the hours women and children could work were limited to how many per day?\n+ 10\n- 8\n- 12\n- 6\nE: In **1847** the working day for women and children was limited to **10 hours**.\n\nQ: Which TWO people pioneered the railway engine?\n+ George Stephenson\n+ Robert Stephenson\n- Isambard Kingdom Brunel\n- Richard Arkwright\nE: Father and son **George and Robert Stephenson** pioneered the railway engine.\n\nQ: Which railway did Isambard Kingdom Brunel build?\n+ The Great Western Railway\n- The London Underground\n- The Channel Tunnel railway\n- The Edinburgh to Glasgow line\nE: **Brunel** built the **Great Western Railway**, the first major railway in Britain, from **Paddington**.\n\nQ: Where was the Great Exhibition of 1851 held?\n+ The Crystal Palace in Hyde Park\n- Buckingham Palace\n- The Tower of London\n- Windsor Castle\nE: The **Great Exhibition** opened in **1851** in the **Crystal Palace** in **Hyde Park**.\n\nQ: Which country did Britain fight in the Crimean War?\n+ Russia\n- France\n- Turkey\n- Germany\nE: From **1853 to 1856** Britain fought **with Turkey and France against Russia**.\n\nQ: Which medal did Queen Victoria introduce during the Crimean War?\n+ The Victoria Cross\n- The George Cross\n- The Military Cross\n- The Order of the Garter\nE: The **Victoria Cross** honours acts of valour by soldiers.\n\nQ: Who is regarded as the founder of modern nursing?\n+ Florence Nightingale\n- Mary Seacole\n- Emmeline Pankhurst\n- Elizabeth Fry\nE: **Florence Nightingale** nursed in the Crimean War and set up the **Nightingale Training School** at St Thomas' Hospital in **1860**.\n\nQ: What caused a famine in Ireland in the mid-19th century?\n+ The failure of the potato crop\n- A war with England\n- A drought\n- A plague of locusts\nE: The **potato crop failed**; a million people died and a million and a half emigrated.\n\nQ: What did supporters of \"Home Rule\" want for Ireland?\n+ Its own parliament while remaining in the UK\n- Complete independence\n- Direct rule from London\n- A union with Scotland\nE: **Home Rule** meant Ireland would **stay in the UK** but have **its own parliament**.\n\nQ: What did the Reform Act of 1832 do?\n+ Abolished pocket and rotten boroughs and increased the number of voters\n- Gave women the vote\n- Gave every man the vote\n- Abolished the House of Lords\nE: The **1832 Reform Act** increased voters, **abolished pocket and rotten boroughs** and gave seats to towns and cities.\n\nQ: Who were the Chartists?\n+ Campaigners for the vote for working classes\n- Supporters of the king in the Civil War\n- Early Protestant reformers\n- Scottish rebels\nE: The **Chartists** campaigned for votes for the working classes and people without property.\n\nQ: When were women over the age of 30 given the right to vote?\n+ 1918\n- 1928\n- 1903\n- 1969\nE: In **1918** women **over 30** got the vote; in **1928** women could vote at **21**, the same as men.\n\nQ: When were women given the right to vote at the age of 21, the same as men?\n+ 1928\n- 1918\n- 1945\n- 1969\nE: In **1928** women were given the vote at **21**, equal with men.\n\nQ: Which organisation did Emmeline Pankhurst help found in 1903?\n+ The Women's Social and Political Union (WSPU)\n- The Women's Franchise League\n- The Labour Party\n- The National Trust\nE: The **WSPU** (1903) was the first group whose members were called **suffragettes**. Pankhurst set up the Women's Franchise League in 1889.\n\nQ: Where was Emmeline Pankhurst born?\n+ Manchester\n- London\n- Glasgow\n- Cardiff\nE: **Emmeline Pankhurst** was born in **Manchester** in 1858.\n\nQ: Who did the British fight in the Boer War?\n+ Dutch settlers in South Africa\n- Zulu warriors\n- French colonists in Canada\n- Indian rebels\nE: The **Boer War (1899–1902)** was fought against settlers from the Netherlands called **Boers**.\n\nQ: Which TWO books did Rudyard Kipling write?\n+ The Jungle Book\n+ Just So Stories\n- Treasure Island\n- Oliver Twist\nE: **Kipling**, born in India, wrote **The Jungle Book**, **Just So Stories** and the poem **If**. He won the Nobel Prize in 1907.\n\nQ: What event triggered the First World War?\n+ The assassination of Archduke Franz Ferdinand\n- The German invasion of Poland\n- The sinking of the Titanic\n- The Russian Revolution\nE: On **28 June 1914**, **Archduke Franz Ferdinand** of Austria was assassinated.\n\nQ: Which TWO countries were among the Central Powers in the First World War?\n+ Germany\n+ The Austro-Hungarian Empire\n- France\n- Russia\nE: The Central Powers were mainly **Germany, Austria-Hungary, the Ottoman Empire** and later **Bulgaria**.\n\nQ: About how many British casualties were there on the first day of the Battle of the Somme?\n+ 60,000\n- 6,000\n- 20,000\n- 100,000\nE: The attack on the Somme in **July 1916** caused about **60,000 British casualties on the first day**.\n\nQ: When did the First World War end?\n+ 11.00 am on 11 November 1918\n- 11.00 am on 11 November 1914\n- 6 June 1918\n- 8 May 1918\nE: The war ended at **11.00 am on 11 November 1918** – remembered on **Remembrance Day**.\n\nQ: What was the Easter Rising?\n+ A 1916 uprising against the British in Dublin\n- A celebration at the end of the First World War\n- A rebellion in Scotland in 1745\n- A strike by miners in Wales\nE: In **1916** Irish nationalists rose up in Dublin: the **Easter Rising**.\n\nQ: When did Ireland become two countries?\n+ 1922\n- 1916\n- 1801\n- 1949\nE: After a 1921 peace treaty, Ireland split in **1922**: **Northern Ireland** stayed in the UK; the south became the **Irish Free State**.\n\nQ: In which year did the Irish Free State become a republic?\n+ 1949\n- 1922\n- 1937\n- 1973\nE: The Irish Free State became a **republic in 1949**.\n\nQ: When did the Great Depression begin?\n+ 1929\n- 1919\n- 1939\n- 1945\nE: In **1929** the world entered the **Great Depression**; heavy industries like shipbuilding were badly hit.\n\nQ: Which TWO industries developed during the Great Depression of the 1930s?\n+ The automobile industry\n+ The aviation industry\n- Shipbuilding\n- Coal mining\nE: Traditional industries suffered but new **car and aviation** industries developed.\n\nQ: When did the BBC begin the world's first regular television service?\n+ 1936\n- 1922\n- 1950\n- 1927\nE: The BBC began radio in **1922** and the **world's first regular TV service in 1936**.\n\nQ: Why did Britain declare war on Germany in 1939?\n+ Hitler invaded Poland\n- Germany bombed London\n- Germany invaded France\n- Hitler came to power\nE: When **Hitler invaded Poland in 1939**, Britain and France declared war.\n\nQ: Which TWO countries were Axis powers in the Second World War?\n+ Germany\n+ Italy\n- Russia\n- France\nE: The **Axis powers** were **Germany, Italy and Japan**.\n\nQ: Who became Prime Minister in 1940 and led Britain through the Second World War?\n+ Winston Churchill\n- Clement Attlee\n- Neville Chamberlain\n- Harold Macmillan\nE: **Winston Churchill** became PM in **May 1940**.\n\nQ: How many men were rescued from the beaches of Dunkirk?\n+ More than 300,000\n- About 30,000\n- About 100,000\n- More than 1 million\nE: Civilian boats helped the Navy rescue **more than 300,000 men** – giving rise to \"**the Dunkirk spirit**\".\n\nQ: Which TWO planes were used by the RAF in the Battle of Britain?\n+ Spitfire\n+ Hurricane\n- Concorde\n- Harrier jump jet\nE: The **Spitfire** and **Hurricane**, designed and built in Britain, won the Battle of Britain in **1940**.\n\nQ: What was the Blitz?\n+ German bombing of British cities at night\n- The British attack on Normandy\n- The evacuation from Dunkirk\n- A naval battle in the Atlantic\nE: The **Blitz** was night bombing of London and other cities. **Coventry** was almost totally destroyed.\n\nQ: Which city was almost totally destroyed in the Blitz?\n+ Coventry\n- Manchester\n- Edinburgh\n- Cardiff\nE: **Coventry** was almost totally destroyed; the East End of London was also badly damaged.\n\nQ: Churchill said \"Never in the field of human conflict was so much owed by so many to so few\" about which event?\n+ The Battle of Britain\n- D-Day\n- Dunkirk\n- The end of the war\nE: Churchill made this speech **during the Battle of Britain**, 1940.\n\nQ: In 2002 Winston Churchill was voted what?\n+ The greatest Briton of all time\n- The best Prime Minister of the 20th century\n- The bravest soldier of the war\n- The most famous writer\nE: In **2002** the public voted Churchill **the greatest Briton of all time**.\n\nQ: When did the USA enter the Second World War?\n+ After Japan bombed Pearl Harbor in December 1941\n- After Germany invaded Poland in 1939\n- After the fall of France in 1940\n- After D-Day in 1944\nE: The **USA** entered the war after the **Pearl Harbor** attack in **December 1941**.\n\nQ: What happened on D-Day, 6 June 1944?\n+ Allied forces landed in Normandy\n- Germany surrendered\n- Britain declared war on Germany\n- The Blitz began\nE: On **6 June 1944** allied forces landed in **Normandy**.\n\nQ: Which scientist led the team that first \"split the atom\"?\n+ Ernest Rutherford\n- Isaac Newton\n- Alexander Fleming\n- Alan Turing\nE: Scientists led by **Ernest Rutherford** were first to split the atom and took part in the **Manhattan Project**.\n\nQ: Who discovered penicillin?\n+ Alexander Fleming\n- Howard Florey\n- Francis Crick\n- John MacLeod\nE: **Alexander Fleming** discovered **penicillin in 1928**; Florey and Chain developed it into a usable drug.\n\nQ: Who was the Prime Minister of the Labour government elected in 1945?\n+ Clement Attlee\n- Winston Churchill\n- Harold Wilson\n- Aneurin Bevan\nE: **Clement Attlee** was PM from **1945 to 1951** and created the welfare state.\n\nQ: Who led the establishment of the NHS in 1948?\n+ Aneurin (Nye) Bevan\n- William Beveridge\n- Clement Attlee\n- R A Butler\nE: **Aneurin (Nye) Bevan**, Minister for Health, led the creation of the **NHS** in **1948**.\n\nQ: What were the five \"Giant Evils\" in the Beveridge Report?\n+ Want, Disease, Ignorance, Squalor and Idleness\n- Hunger, War, Crime, Poverty and Disease\n- Greed, Envy, Pride, Sloth and Anger\n- Want, Crime, War, Squalor and Hunger\nE: The **1942 Beveridge Report** targeted **Want, Disease, Ignorance, Squalor and Idleness**.\n\nQ: What did the Education Act of 1944 introduce?\n+ Free secondary education in England and Wales\n- Free university education\n- Compulsory religious education\n- School meals for all children\nE: The **Education Act 1944 (the Butler Act)** introduced **free secondary education**.\n\nQ: Which TWO countries were granted independence in 1947?\n+ India\n+ Pakistan\n- Canada\n- Australia\nE: In **1947** nine countries gained independence, including **India, Pakistan and Ceylon (Sri Lanka)**.\n\nQ: Who made the famous \"wind of change\" speech?\n+ Harold Macmillan\n- Winston Churchill\n- Margaret Thatcher\n- Clement Attlee\nE: Conservative PM **Harold Macmillan** spoke of the \"**wind of change**\" – decolonisation.\n\nQ: Who wrote Under Milk Wood?\n+ Dylan Thomas\n- Robert Burns\n- Roald Dahl\n- Rudyard Kipling\nE: **Dylan Thomas**, a Welsh poet, wrote the radio play **Under Milk Wood**.\n\nQ: In 1948 people from which region were invited to come and work in the UK?\n+ The West Indies\n- Australia\n- Canada\n- South America\nE: In **1948** people from the **West Indies** were invited to help rebuild Britain.\n\nQ: What was the 1960s known as?\n+ The Swinging Sixties\n- The Roaring Sixties\n- The Golden Sixties\n- The Silent Sixties\nE: The **\"Swinging Sixties\"** saw growth in fashion, cinema and pop music.\n\nQ: Which TWO social laws were liberalised in the 1960s?\n+ Divorce\n+ Abortion\n- Smoking\n- Gambling\nE: Laws on **divorce** and **abortion** were liberalised in the 1960s.\n\nQ: How many people of Indian origin forced to leave Uganda did Britain admit in the early 1970s?\n+ 28,000\n- 2,800\n- 280,000\n- 100,000\nE: Britain admitted **28,000** people of Indian origin forced to leave **Uganda**.\n\nQ: When did the UK join the European Economic Community?\n+ 1973\n- 1957\n- 1969\n- 1992\nE: The EEC was formed in **1957**; the UK **joined in 1973**.\n\nQ: Who was the first woman Prime Minister of the UK?\n+ Margaret Thatcher\n- Theresa May\n- Liz Truss\n- Barbara Castle\nE: **Margaret Thatcher** became the first woman PM in **1979** and served until **1990**.\n\nQ: Margaret Thatcher was the longest-serving Prime Minister of the 20th century.\n+ True\n- False\nE: Thatcher was **the longest-serving PM of the 20th century** (1979–1990).\n\nQ: Which country invaded the Falkland Islands in 1982?\n+ Argentina\n- Spain\n- Chile\n- Brazil\nE: **Argentina** invaded in **1982**; a British naval taskforce recovered the islands.\n\nQ: Who wrote Charlie and the Chocolate Factory?\n+ Roald Dahl\n- J K Rowling\n- Lewis Carroll\n- Rudyard Kipling\nE: **Roald Dahl**, born in Wales to Norwegian parents, wrote it and **George's Marvellous Medicine**.\n\nQ: Which agreement was signed in Northern Ireland in 1998?\n+ The Good Friday Agreement\n- The Treaty of Rome\n- The Act of Union\n- The Belfast Treaty of 1921\nE: The **Good Friday Agreement** was signed in **1998**.\n\nQ: Which TWO were established by the Blair government in 1999?\n+ The Scottish Parliament\n+ The Welsh Assembly\n- The House of Lords\n- The European Union\nE: Tony Blair's government created the **Scottish Parliament** and the **Welsh Assembly**.\n\nQ: Who won an Olympic gold medal in the pentathlon in 1972?\n+ Mary Peters\n- Kelly Holmes\n- Jessica Ennis\n- Tanni Grey-Thompson\nE: **Mary Peters** won pentathlon gold in **1972** and promoted sport in Northern Ireland.\n\nQ: Who developed the television in the 1920s?\n+ John Logie Baird\n- Robert Watson-Watt\n- Alan Turing\n- Tim Berners-Lee\nE: Scotsman **John Logie Baird** developed the TV; first broadcast London–Glasgow in **1932**.\n\nQ: Who developed radar?\n+ Sir Robert Watson-Watt\n- John Logie Baird\n- Frank Whittle\n- Bernard Lovell\nE: **Sir Robert Watson-Watt** developed radar; the first successful test was in **1935**.\n\nQ: Who invented the jet engine?\n+ Sir Frank Whittle\n- Sir Christopher Cockerell\n- James Goodfellow\n- Sir Peter Mansfield\nE: RAF engineer **Sir Frank Whittle** developed the jet engine in the **1930s**.\n\nQ: Who invented the hovercraft?\n+ Sir Christopher Cockerell\n- Sir Frank Whittle\n- John Logie Baird\n- James Watt\nE: **Sir Christopher Cockerell** invented the hovercraft in the **1950s**.\n\nQ: Who invented the cash machine (ATM)?\n+ James Goodfellow\n- Tim Berners-Lee\n- Alan Turing\n- John Logie Baird\nE: **James Goodfellow** invented the ATM; the first was used by **Barclays in Enfield in 1967**.\n\nQ: Who invented the World Wide Web?\n+ Sir Tim Berners-Lee\n- Alan Turing\n- John Logie Baird\n- Bernard Lovell\nE: **Sir Tim Berners-Lee** invented the web; it was first used on **25 December 1990**.\n\nQ: What was Dolly the sheep?\n+ The first mammal to be cloned\n- The first animal in space\n- The first test-tube baby\n- A famous children's book character\nE: In **1996** a team led by **Ian Wilmut and Keith Campbell** cloned **Dolly the sheep**.\n\nQ: Which TWO people pioneered IVF therapy in Britain?\n+ Sir Robert Edwards\n+ Patrick Steptoe\n- Alexander Fleming\n- Peter Mansfield\nE: **Robert Edwards and Patrick Steptoe** pioneered IVF; the first \"test-tube baby\" was born in **Oldham in 1978**.\n\nQ: Which TWO aircraft were developed in Britain?\n+ Concorde (with France)\n+ The Harrier jump jet\n- The Boeing 747\n- The Spirit of St Louis\nE: **Concorde** was developed with France and the **Harrier jump jet** can take off vertically.\n\nQ: Who co-invented the MRI scanner?\n+ Sir Peter Mansfield\n- Francis Crick\n- Robert Edwards\n- Bernard Lovell\nE: **Sir Peter Mansfield** co-invented the **MRI scanner**.\n\nQ: Where did Sir Bernard Lovell build a radio telescope?\n+ Jodrell Bank, Cheshire\n- Greenwich, London\n- Cambridge\n- Edinburgh\nE: **Bernard Lovell**'s radio telescope at **Jodrell Bank** was for many years the biggest in the world.\n\nQ: Which British scientist co-discovered insulin?\n+ John MacLeod\n- Alexander Fleming\n- Francis Crick\n- Ernest Rutherford\nE: Scottish physician **John MacLeod** was co-discoverer of **insulin**, used to treat diabetes.\n\nQ: Which political parties formed the coalition government in 2010?\n+ Conservatives and Liberal Democrats\n- Labour and Liberal Democrats\n- Conservatives and Labour\n- Labour and the Scottish National Party\nE: In **2010** the **Conservatives and Liberal Democrats** formed a coalition, with **David Cameron** as PM.\n\nQ: Which TWO were achievements of Clement Attlee's government?\n+ Creating the National Health Service\n+ Nationalising major industries\n- Privatising nationalised industries\n- Joining the EEC\nE: Attlee's government **created the NHS** and **nationalised** coal, steel, railways and utilities.\n", "# 4\nQ: Where is the UK located?\n+ North west of Europe\n- North east of Europe\n- South west of Europe\n- South east of Europe\nE: The UK is located in the **north west of Europe**.\n\nQ: What is the longest distance on the UK mainland?\n+ From John O'Groats to Land's End\n- From London to Edinburgh\n- From Cardiff to Belfast\n- From Dover to Aberdeen\nE: John O'Groats to Land's End is about **870 miles (1,400 km)**.\n\nQ: What is the capital city of Wales?\n+ Cardiff\n- Swansea\n- Newport\n- Bangor\nE: The capital of Wales is **Cardiff**.\n\nQ: What is the capital city of Northern Ireland?\n+ Belfast\n- Londonderry\n- Dublin\n- Armagh\nE: The capital of Northern Ireland is **Belfast**.\n\nQ: Which TWO cities are in Scotland?\n+ Dundee\n+ Aberdeen\n- Newport\n- Bradford\nE: Scottish cities include **Edinburgh, Glasgow, Dundee and Aberdeen**.\n\nQ: Which TWO cities are in Wales?\n+ Swansea\n+ Newport\n- Plymouth\n- Norwich\nE: Welsh cities include **Cardiff, Swansea and Newport**.\n\nQ: Which statement is correct?\n+ Scottish and Northern Irish banknotes are valid everywhere in the UK\n- Scottish and Northern Irish banknotes can only be used in Scotland and Northern Ireland\nE: They are **valid everywhere in the UK**, although shops and businesses **do not have to accept them**.\n\nQ: Which TWO are UK banknotes?\n+ £20\n+ £50\n- £25\n- £100\nE: UK notes are **£5, £10, £20 and £50**.\n\nQ: Which of these is NOT a UK coin?\n+ 25p\n- 20p\n- £2\n- 2p\nE: UK coins are **1p, 2p, 5p, 10p, 20p, 50p, £1 and £2**.\n\nQ: In which part of the UK is Gaelic spoken in some areas?\n+ The Highlands and Islands of Scotland\n- North Wales\n- Cornwall\n- The north of England\nE: **Gaelic** is spoken in parts of the **Highlands and Islands**; in Northern Ireland some speak **Irish Gaelic**.\n\nQ: What was the UK population in 2010?\n+ Just over 62 million\n- Just under 60 million\n- 57 million\n- 50 million\nE: In **2010** the population was **just over 62 million**.\n\nQ: What was the population of the UK in 1901?\n+ 40 million\n- 20 million\n- 50 million\n- 8 million\nE: The population was **40 million in 1901** and **50 million in 1951**.\n\nQ: About what percentage of the UK population lives in England?\n+ 84%\n- 50%\n- 70%\n- 95%\nE: **England** has about **84%**, Scotland just over 8%, Wales about 5% and Northern Ireland less than 3%.\n\nQ: Which TWO reasons explain recent UK population growth?\n+ Migration into the UK\n+ Longer life expectancy\n- More people leaving the UK\n- A higher retirement age\nE: **Migration** and **longer life expectancy** have contributed to population growth.\n\nQ: Which statement is correct?\n+ More women than men study at university in the UK\n- Fewer women than men study at university in the UK\nE: **More women than men study at university**, and girls leave school with better qualifications on average.\n\nQ: Women make up about half of the UK workforce.\n+ True\n- False\nE: **Women make up about half of the workforce** in Britain today.\n\nQ: According to the 2009 Citizenship Survey, what percentage of people identified as Christian?\n+ 70%\n- 50%\n- 90%\n- 21%\nE: **70%** identified as Christian and **21%** said they had **no religion**.\n\nQ: What percentage of people said they had no religion in the 2009 Citizenship Survey?\n+ 21%\n- 4%\n- 10%\n- 40%\nE: **21%** said they had **no religion**.\n\nQ: Who is the head of the Church of England?\n+ The monarch\n- The Archbishop of Canterbury\n- The Prime Minister\n- The Pope\nE: The **monarch is the head** of the Church of England; the **Archbishop of Canterbury** is its spiritual leader.\n\nQ: Who is the spiritual leader of the Church of England?\n+ The Archbishop of Canterbury\n- The monarch\n- The Archbishop of York\n- The Moderator\nE: The **Archbishop of Canterbury** is the spiritual leader.\n\nQ: What is the Church of England called in Scotland and the USA?\n+ The Episcopal Church\n- The Presbyterian Church\n- The Methodist Church\n- The Church of Scotland\nE: The Church of England is called the **Anglican Church** in other countries and the **Episcopal Church** in Scotland and the USA.\n\nQ: Which TWO are true about the Church of Scotland?\n+ It is a Presbyterian Church\n+ Its chairperson, the Moderator, is appointed for one year\n- The monarch is its spiritual leader\n- It is a Roman Catholic Church\nE: The **Church of Scotland** is **Presbyterian**, governed by ministers and elders; the **Moderator** serves for **one year**.\n\nQ: Several Church of England bishops sit in the House of Lords.\n+ True\n- False\nE: **Several Church of England bishops** sit in the House of Lords.\n\nQ: Which TWO countries have no established Church?\n+ Wales\n+ Northern Ireland\n- England\n- Scotland\nE: There is **no established Church in Wales or Northern Ireland**.\n\nQ: When is St David's Day?\n+ 1 March\n- 17 March\n- 23 April\n- 30 November\nE: **St David's Day** (Wales) is **1 March**.\n\nQ: When is St Andrew's Day?\n+ 30 November\n- 1 March\n- 17 March\n- 23 April\nE: **St Andrew's Day** (Scotland) is **30 November**.\n\nQ: When is St George's Day?\n+ 23 April\n- 1 March\n- 17 March\n- 30 November\nE: **St George's Day** (England) is **23 April**.\n\nQ: Who is the patron saint of Northern Ireland?\n+ St Patrick\n- St David\n- St Andrew\n- St George\nE: **St Patrick**'s day is **17 March**.\n\nQ: Which TWO countries have their patron saint's day as an official holiday?\n+ Scotland\n+ Northern Ireland\n- England\n- Wales\nE: Only **Scotland and Northern Ireland** have their patron saint's day as an official holiday.\n\nQ: What is the national flower of Wales?\n+ Daffodil\n- Rose\n- Thistle\n- Shamrock\nE: **Wales: daffodil**. England: rose. Scotland: thistle. Northern Ireland: shamrock.\n\nQ: What is the national flower of Scotland?\n+ Thistle\n- Daffodil\n- Rose\n- Shamrock\nE: The **thistle** is associated with **Scotland**.\n\nQ: When is Boxing Day?\n+ 26 December\n- 24 December\n- 25 December\n- 1 January\nE: **Boxing Day** is **26 December**, the day after Christmas, and is a public holiday.\n\nQ: Which TWO days around Easter are public holidays?\n+ Good Friday\n+ Easter Monday\n- Ash Wednesday\n- Shrove Tuesday\nE: **Good Friday** and **Easter Monday** are public holidays.\n\nQ: What is the period of 40 days before Easter called?\n+ Lent\n- Advent\n- Ramadan\n- Hogmanay\nE: **Lent** is the 40 days before Easter, starting on **Ash Wednesday**.\n\nQ: What is Shrove Tuesday also known as?\n+ Pancake Day\n- Ash Wednesday\n- Good Friday\n- Boxing Day\nE: **Shrove Tuesday** is **Pancake Day** – the day before Lent begins.\n\nQ: Which TWO religious groups celebrate Diwali?\n+ Hindus\n+ Sikhs\n- Muslims\n- Jews\nE: **Diwali**, the **Festival of Lights**, is celebrated by **Hindus and Sikhs**.\n\nQ: Which city is famous for its Diwali celebration?\n+ Leicester\n- Birmingham\n- Edinburgh\n- Cardiff\nE: There is a famous celebration of Diwali in **Leicester**.\n\nQ: Which festival is celebrated by Jewish people for eight days with a menorah?\n+ Hannukah\n- Diwali\n- Vaisakhi\n- Eid al-Fitr\nE: **Hannukah**, in November or December, lasts **eight days**; a candle is lit each day on a **menorah**.\n\nQ: What does Eid al-Fitr celebrate?\n+ The end of Ramadan\n- The birth of the Prophet\n- The founding of the Khalsa\n- The new year\nE: **Eid al-Fitr** celebrates **the end of Ramadan**, the month of fasting.\n\nQ: What does Vaisakhi celebrate?\n+ The founding of the Sikh community known as the Khalsa\n- The victory of good over evil\n- The end of Ramadan\n- The birth of Jesus\nE: **Vaisakhi** is a **Sikh** festival on **14 April** celebrating the founding of the **Khalsa**.\n\nQ: What is the Scottish name for New Year's Eve?\n+ Hogmanay\n- Burns Night\n- Eisteddfod\n- Ceilidh\nE: In Scotland **31 December** is called **Hogmanay**, and **2 January** is also a public holiday.\n\nQ: When is Mothering Sunday?\n+ The Sunday three weeks before Easter\n- The second Sunday in May\n- The third Sunday in June\n- The first Sunday in March\nE: **Mothering Sunday** is three weeks before Easter. **Father's Day** is the third Sunday in June.\n\nQ: What event does Bonfire Night commemorate?\n+ The failed plot to blow up Parliament in 1605\n- The Great Fire of London in 1666\n- The end of the First World War\n- The defeat of the Spanish Armada\nE: **Bonfire Night (5 November)** remembers **Guy Fawkes'** failed plot to kill the Protestant king in **1605**.\n\nQ: Which TWO things happen on Remembrance Day?\n+ A two-minute silence at 11.00 am\n+ People wear poppies\n- People give chocolate eggs\n- People play tricks until midday\nE: On **11 November** people wear **poppies**, hold a **two-minute silence at 11 am**, and lay wreaths at the **Cenotaph**.\n\nQ: On April Fool's Day, until what time are jokes played?\n+ Midday\n- Midnight\n- 9.00 am\n- 6.00 pm\nE: On **1 April** people play jokes on each other **until midday**.\n\nQ: Halloween has its roots in a pagan festival marking the beginning of winter.\n+ True\n- False\nE: **Halloween (31 October)** has roots in a **pagan** festival marking the start of winter.\n\nQ: Bank holidays have religious significance.\n- True\n+ False\nE: **Bank holidays** are public holidays with **no religious significance**.\n\nQ: Which TWO sports originated in Britain?\n+ Cricket\n+ Golf\n- Baseball\n- Basketball\nE: **Cricket, football, lawn tennis, golf and rugby** all began in Britain.\n\nQ: In which years has the UK hosted the Olympic Games?\n+ 1908, 1948 and 2012\n- 1908, 1956 and 2012\n- 1924, 1948 and 2012\n- 1896, 1948 and 2012\nE: The UK hosted the Olympics in **1908, 1948 and 2012**.\n\nQ: Where was the main Olympic site for the 2012 Games?\n+ Stratford, East London\n- Wembley, North London\n- Greenwich, South London\n- Manchester\nE: The main 2012 Olympic site was in **Stratford, East London**.\n\nQ: Where did the Paralympics originate?\n+ Stoke Mandeville hospital\n- Wimbledon\n- Wembley Stadium\n- Leamington Spa\nE: The Paralympics began with **Dr Sir Ludwig Guttmann** at **Stoke Mandeville** hospital in Buckinghamshire.\n\nQ: Who was the first man to run a mile in under four minutes?\n+ Sir Roger Bannister\n- Mo Farah\n- Sebastian Coe\n- Steve Redgrave\nE: **Sir Roger Bannister** ran a mile in under four minutes in **1954**.\n\nQ: Who captained the English football team that won the World Cup in 1966?\n+ Bobby Moore\n- David Beckham\n- Bobby Charlton\n- Ian Botham\nE: **Bobby Moore** captained England to victory in **1966**.\n\nQ: Who won gold medals in rowing at five consecutive Olympic Games?\n+ Sir Steve Redgrave\n- Sir Chris Hoy\n- Bradley Wiggins\n- David Weir\nE: **Sir Steve Redgrave** is one of Britain's greatest Olympians.\n\nQ: Who was the first Briton to win the Tour de France?\n+ Bradley Wiggins\n- Chris Hoy\n- Mark Cavendish\n- Jackie Stewart\nE: **Bradley Wiggins** won the Tour de France in **2012**.\n\nQ: Which TWO events did Mo Farah win at the 2012 Olympics?\n+ 5,000 metres\n+ 10,000 metres\n- Marathon\n- 1,500 metres\nE: **Mo Farah**, born in Somalia, won the **5,000m and 10,000m** in **2012**.\n\nQ: Which event did Jessica Ennis win at the 2012 Olympics?\n+ Heptathlon\n- Pentathlon\n- 100 metres\n- Long jump\nE: **Jessica Ennis** won the **heptathlon**, which includes seven track and field events.\n\nQ: Which tennis tournament did Andy Murray win in 2012?\n+ The US Open\n- Wimbledon\n- The French Open\n- The Australian Open\nE: **Andy Murray** won the **US Open** men's singles in **2012**, the first British man to win a Grand Slam singles title since **1936**.\n\nQ: Who won gold medals for ice dancing at the 1984 Olympics?\n+ Jayne Torvill and Christopher Dean\n- Kelly Holmes and Steve Redgrave\n- Ellie Simmonds and David Weir\n- Chris Hoy and Bradley Wiggins\nE: **Torvill and Dean** won Olympic gold in **1984** and four world championships.\n\nQ: Who became the fastest person to sail around the world single-handed in 2004?\n+ Dame Ellen MacArthur\n- Sir Francis Chichester\n- Sir Robin Knox-Johnston\n- Dame Kelly Holmes\nE: **Ellen MacArthur** became the fastest single-handed sailor around the world in **2004**.\n\nQ: Which sport is Sir Jackie Stewart famous for?\n+ Motor racing\n- Golf\n- Cycling\n- Tennis\nE: **Jackie Stewart** is a Scottish former racing driver who won the **Formula 1** world championship **three times**.\n\nQ: Which TWO Paralympians won the London Marathon six times?\n+ Tanni Grey-Thompson\n+ David Weir\n- Ellie Simmonds\n- Chris Hoy\nE: Both **Tanni Grey-Thompson** and **David Weir** won the London Marathon **six times**.\n\nQ: What is the UK's most popular sport?\n+ Football\n- Cricket\n- Rugby\n- Tennis\nE: **Football** is the UK's most popular sport.\n\nQ: England's only international football tournament victory was the 1966 World Cup.\n+ True\n- False\nE: England's only international tournament victory was the **1966 World Cup**, hosted in the UK.\n\nQ: What is the Ashes?\n+ A cricket series between England and Australia\n- A rugby competition between England and Scotland\n- A horse race in Liverpool\n- A rowing race on the Thames\nE: **The Ashes** is a series of Test matches between **England and Australia**.\n\nQ: Which TWO countries take part in the Six Nations rugby championship?\n+ France\n+ Italy\n- Australia\n- New Zealand\nE: The **Six Nations**: **England, Ireland, Scotland, Wales, France and Italy**.\n\nQ: Where is the Grand National held?\n+ Aintree, near Liverpool\n- Ascot, Berkshire\n- Ayr, Scotland\n- Newmarket, Suffolk\nE: The **Grand National** is at **Aintree** near Liverpool. The **Scottish Grand National** is at **Ayr**.\n\nQ: Where is the National Horseracing Museum?\n+ Newmarket, Suffolk\n- Aintree, Liverpool\n- Ascot, Berkshire\n- Cheltenham\nE: The **National Horseracing Museum** is in **Newmarket, Suffolk**.\n\nQ: Which place is known as the home of golf?\n+ St Andrews\n- Wimbledon\n- Edinburgh\n- Augusta\nE: **St Andrews** in Scotland is the home of golf. Modern golf dates back to **15th-century Scotland**.\n\nQ: Which TWO statements are true about Wimbledon?\n+ It is the oldest tennis tournament in the world\n+ It is the only Grand Slam event played on grass\n- It is held in Scotland\n- It is the newest Grand Slam event\nE: **Wimbledon** is the oldest tennis tournament and the **only Grand Slam on grass**.\n\nQ: Where was the first tennis club founded in 1872?\n+ Leamington Spa\n- Wimbledon\n- Bath\n- Oxford\nE: The first tennis club was founded in **Leamington Spa in 1872**.\n\nQ: Who was the first person to sail single-handed around the world?\n+ Sir Francis Chichester\n- Sir Robin Knox-Johnston\n- Dame Ellen MacArthur\n- Sir Francis Drake\nE: **Sir Francis Chichester** did it in **1966/67**; **Sir Robin Knox-Johnston** was first to do it **without stopping**.\n\nQ: Where is Europe's longest dry ski slope?\n+ Near Edinburgh\n- Near Cardiff\n- Near Manchester\n- Near Belfast\nE: **Europe's longest dry ski slope** is near **Edinburgh**; there are five ski centres in Scotland.\n\nQ: What are the Proms?\n+ An eight-week summer season of classical music\n- A dance festival in Wales\n- A pop music festival in Glastonbury\n- A theatre festival in Edinburgh\nE: **The Proms** is an **eight-week summer season** of orchestral music, organised by the **BBC since 1927**.\n\nQ: Which composer wrote Water Music for King George I?\n+ George Frederick Handel\n- Henry Purcell\n- Edward Elgar\n- Gustav Holst\nE: German-born **Handel** wrote **Water Music** for George I and **Music for the Royal Fireworks** for George II.\n\nQ: Which composer wrote The Planets?\n+ Gustav Holst\n- Benjamin Britten\n- Edward Elgar\n- William Walton\nE: **Gustav Holst** wrote **The Planets**; Jupiter became the hymn **I Vow to Thee My Country**.\n\nQ: Which piece is usually played at the Last Night of the Proms?\n+ Land of Hope and Glory\n- God Save the King only\n- Messiah\n- The Planets\nE: **Elgar**'s Pomp and Circumstance March No 1 – **Land of Hope and Glory** – is played at the Last Night of the Proms.\n\nQ: Which TWO operas did Benjamin Britten write?\n+ Peter Grimes\n+ Billy Budd\n- The Mikado\n- HMS Pinafore\nE: **Britten** wrote **Peter Grimes** and **Billy Budd**, and founded the **Aldeburgh festival**.\n\nQ: Who was the organist at Westminster Abbey and wrote church music and operas?\n+ Henry Purcell\n- George Frederick Handel\n- Ralph Vaughan Williams\n- Edward Elgar\nE: **Henry Purcell** developed a distinctly British style of music.\n\nQ: What is the National Eisteddfod?\n+ A Welsh cultural festival including music, dance and poetry\n- A Scottish New Year celebration\n- An Irish horse race\n- An English flower show\nE: The **National Eisteddfod of Wales** is largely **in Welsh** and includes competitions for Welsh poetry.\n\nQ: What is the Mercury Music Prize awarded for?\n+ The best album from the UK and Ireland\n- The best classical composition\n- The best musical theatre show\n- The best live performance\nE: The **Mercury Music Prize** is awarded each **September** for the best album from the **UK and Ireland**.\n\nQ: Which play by Agatha Christie has had the longest initial run of any show in history?\n+ The Mousetrap\n- Murder on the Orient Express\n- Cats\n- The Phantom of the Opera\nE: **The Mousetrap** has run in the West End since **1952**.\n\nQ: Which TWO comic operas did Gilbert and Sullivan write?\n+ The Pirates of Penzance\n+ The Mikado\n- Evita\n- Cats\nE: **Gilbert and Sullivan** wrote **HMS Pinafore, The Pirates of Penzance and The Mikado**.\n\nQ: Which TWO shows did Andrew Lloyd Webber write the music for?\n+ Cats\n+ The Phantom of the Opera\n- The Mousetrap\n- HMS Pinafore\nE: **Lloyd Webber** also wrote **Jesus Christ Superstar** and **Evita** (with Tim Rice).\n\nQ: In a pantomime, what is \"the Dame\"?\n+ A woman played by a man\n- A man played by a woman\n- The villain of the story\n- A pantomime horse\nE: The **Dame** is a woman played by a man.\n\nQ: What is the Edinburgh Festival Fringe?\n+ A showcase of mainly theatre and comedy\n- A classical music festival\n- A Highland games event\n- A film festival in winter\nE: The **Fringe** is the biggest part of the **Edinburgh Festival**, held every summer.\n\nQ: Which awards are named after a British actor known for his Shakespeare roles?\n+ The Laurence Olivier Awards\n- The BAFTAs\n- The Brit Awards\n- The Turner Prize\nE: The **Laurence Olivier Awards** take place annually in London.\n\nQ: What is the Turner Prize awarded for?\n+ Contemporary art\n- Classical music\n- Literature\n- Architecture\nE: The **Turner Prize** (since **1984**) celebrates **contemporary art**; works are shown at **Tate Britain**.\n\nQ: Which artist is famous for landscapes of Dedham Vale?\n+ John Constable\n- Joseph Turner\n- Thomas Gainsborough\n- David Hockney\nE: **John Constable** painted **Dedham Vale** on the Suffolk–Essex border.\n\nQ: Which artist is best known for large bronze abstract sculptures?\n+ Henry Moore\n- Lucian Freud\n- David Allan\n- John Petts\nE: **Henry Moore** was an English sculptor known for **large bronze abstract** works.\n\nQ: Which artist was an important contributor to the 1960s \"pop art\" movement?\n+ David Hockney\n- John Constable\n- Joseph Turner\n- Henry Moore\nE: **David Hockney** contributed to **pop art** in the 1960s.\n\nQ: Which TWO artists were Pre-Raphaelites?\n+ Dante Gabriel Rossetti\n+ Holman Hunt\n- Thomas Gainsborough\n- Henry Moore\nE: The **Pre-Raphaelites** included **Holman Hunt, Dante Gabriel Rossetti and Sir John Millais**.\n\nQ: Which Welsh artist was known for engravings and stained glass?\n+ John Petts\n- John Lavery\n- David Allan\n- Lucian Freud\nE: **John Petts** was a **Welsh** artist known for **engravings and stained glass**.\n\nQ: Who designed the Cenotaph in Whitehall?\n+ Sir Edwin Lutyens\n- Sir Christopher Wren\n- Inigo Jones\n- Robert Adam\nE: **Sir Edwin Lutyens** designed the **Cenotaph** and **New Delhi**.\n\nQ: Which TWO buildings did Inigo Jones design?\n+ The Queen's House at Greenwich\n+ The Banqueting House in Whitehall\n- St Paul's Cathedral\n- The Houses of Parliament\nE: **Inigo Jones** designed the **Queen's House** and the **Banqueting House** in the 17th century.\n\nQ: Which TWO buildings were built in the 19th-century gothic style?\n+ The Houses of Parliament\n+ St Pancras Station\n- St Paul's Cathedral\n- The Queen's House\nE: The **Houses of Parliament** and **St Pancras Station** were built in the revived **gothic** style.\n\nQ: Which Scottish architect designed Dumfries House?\n+ Robert Adam\n- Christopher Wren\n- Edwin Lutyens\n- Norman Foster\nE: **Robert Adam** designed the inside and outside of houses such as **Dumfries House**.\n\nQ: Who designed landscapes for country houses to look natural?\n+ Lancelot \"Capability\" Brown\n- Gertrude Jekyll\n- Thomas Chippendale\n- Clarice Cliff\nE: **Capability Brown** designed natural-looking grounds in the 18th century.\n\nQ: Which TWO are famous British fashion designers?\n+ Mary Quant\n+ Vivienne Westwood\n- Thomas Chippendale\n- Capability Brown\nE: Leading fashion designers include **Mary Quant, Alexander McQueen and Vivienne Westwood**.\n\nQ: What did Thomas Chippendale design?\n+ Furniture\n- Gardens\n- Ceramics\n- Clothes\nE: **Thomas Chippendale** designed **furniture** in the 18th century.\n\nQ: Which novel was voted the country's best-loved novel in 2003?\n+ The Lord of the Rings\n- Pride and Prejudice\n- Harry Potter\n- Oliver Twist\nE: **The Lord of the Rings** by **JRR Tolkien** was voted best-loved in **2003**.\n\nQ: Which TWO writers have won the Nobel Prize in Literature?\n+ Seamus Heaney\n+ Harold Pinter\n- J K Rowling\n- Jane Austen\nE: Nobel winners include **William Golding, Seamus Heaney and Harold Pinter**.\n\nQ: Authors from which places can win the Man Booker Prize?\n+ The Commonwealth, Ireland or Zimbabwe\n- Only the UK\n- Any country in the world\n- Europe only\nE: The **Man Booker Prize** (since **1968**) is open to the **Commonwealth, Ireland or Zimbabwe**.\n\nQ: Who wrote Pride and Prejudice?\n+ Jane Austen\n- Charlotte Brontë\n- Thomas Hardy\n- Charles Dickens\nE: **Jane Austen** wrote **Pride and Prejudice** and **Sense and Sensibility**.\n\nQ: Which TWO novels were written by Charles Dickens?\n+ Oliver Twist\n+ Great Expectations\n- Treasure Island\n- Lucky Jim\nE: **Dickens** wrote **Oliver Twist** and **Great Expectations**.\n\nQ: Who wrote Treasure Island?\n+ Robert Louis Stevenson\n- Arthur Conan Doyle\n- Walter Scott\n- Rudyard Kipling\nE: **Robert Louis Stevenson** wrote **Treasure Island**, **Kidnapped** and **Dr Jekyll and Mr Hyde**.\n\nQ: Who wrote the Sherlock Holmes stories?\n+ Sir Arthur Conan Doyle\n- Agatha Christie\n- Ian Fleming\n- Charles Dickens\nE: **Sir Arthur Conan Doyle**, a Scottish doctor, created **Sherlock Holmes**.\n\nQ: Who wrote Far from the Madding Crowd?\n+ Thomas Hardy\n- Jane Austen\n- Evelyn Waugh\n- Graham Greene\nE: **Thomas Hardy** wrote novels about rural society, including **Jude the Obscure**.\n\nQ: Which poet wrote about daffodils?\n+ William Wordsworth\n- William Blake\n- Lord Byron\n- Robert Browning\nE: **Wordsworth**: \"I wander'd lonely as a cloud … A host of golden daffodils\".\n\nQ: Which TWO poets wrote about their experiences in the First World War?\n+ Wilfred Owen\n+ Siegfried Sassoon\n- John Keats\n- Lord Byron\nE: **Wilfred Owen** and **Siegfried Sassoon** wrote about the First World War.\n\nQ: Who wrote Paradise Lost?\n+ John Milton\n- William Shakespeare\n- Geoffrey Chaucer\n- John Keats\nE: **John Milton** wrote **Paradise Lost**, inspired by his religious views.\n\nQ: How many lines does a sonnet have?\n+ 14\n- 10\n- 12\n- 16\nE: A **sonnet** must be **14 lines** long.\n\nQ: Where are many famous poets buried or commemorated?\n+ Poets' Corner, Westminster Abbey\n- St Paul's Cathedral\n- The British Library\n- The Globe Theatre\nE: Many poets are commemorated in **Poets' Corner** in **Westminster Abbey**.\n\nQ: Which poem is about a hero who battles monsters?\n+ Beowulf\n- The Canterbury Tales\n- Paradise Lost\n- The Tyger\nE: The Anglo-Saxon poem **Beowulf** tells of its hero's battles against monsters.\n\nQ: Which TWO are traditional foods of Wales and Scotland?\n+ Welsh cakes\n+ Haggis\n- Ulster fry\n- Yorkshire pudding\nE: **Welsh cakes** (Wales) and **haggis** (Scotland). Ulster fry is from NI; Yorkshire pudding from England.\n\nQ: Who became famous in silent movies for playing a tramp character?\n+ Charlie Chaplin\n- Alfred Hitchcock\n- Laurence Olivier\n- David Niven\nE: **Sir Charles (Charlie) Chaplin** became famous for his **tramp** character.\n\nQ: Which TWO film franchises, the highest-grossing of all time, were produced in the UK?\n+ Harry Potter\n+ James Bond\n- Star Wars\n- Wallace and Gromit\nE: The two highest-grossing franchises – **Harry Potter and James Bond** – were produced in the UK.\n\nQ: Which British animator has won four Oscars, three for Wallace and Gromit?\n+ Nick Park\n- Ridley Scott\n- David Lean\n- Alfred Hitchcock\nE: **Nick Park** has won **four Oscars**, three for **Wallace and Gromit**.\n\nQ: Which film studio claims to be the oldest continuously working film studio in the world?\n+ Ealing Studios\n- Pinewood Studios\n- Shepperton Studios\n- Elstree Studios\nE: **Ealing Studios** has that claim.\n\nQ: Which British film was directed by David Lean?\n+ Lawrence of Arabia\n- The 39 Steps\n- The Third Man\n- Chariots of Fire\nE: **David Lean** directed **Brief Encounter** and **Lawrence of Arabia**. Hitchcock directed The 39 Steps.\n\nQ: What are the BAFTAs?\n+ The British equivalent of the Oscars\n- Awards for music albums\n- Awards for theatre\n- Awards for contemporary art\nE: The **British Academy Film Awards** are hosted by **BAFTA**.\n\nQ: Which TWO were satirical TV shows?\n+ Spitting Image\n+ That Was The Week That Was\n- Coronation Street\n- EastEnders\nE: **That Was The Week That Was** (1960s) and **Spitting Image** (1980s–90s) were satirical shows.\n\nQ: In which year did Monty Python's Flying Circus first appear?\n+ 1969\n- 1959\n- 1979\n- 1989\nE: In **1969** **Monty Python's Flying Circus** introduced a new type of comedy.\n\nQ: What is the maximum fine for watching TV without a TV licence?\n+ £1,000\n- £100\n- £500\n- £5,000\nE: You can be fined **up to £1,000** for watching TV without a licence.\n\nQ: Which TWO groups can get a free or discounted TV licence?\n+ People over 75\n+ Blind people\n- Students\n- People under 18\nE: People **over 75** can apply for a free licence; **blind people get 50% off**.\n\nQ: How is the BBC funded?\n+ By TV licences\n- By advertisements\n- By subscriptions\n- By donations\nE: The **BBC** is funded by the **TV licence**; other channels by adverts and subscriptions.\n\nQ: The BBC is the only wholly state-funded media organisation that is independent of government.\n+ True\n- False\nE: The **BBC** is state-funded but **independent of government**.\n\nQ: How old must you be to buy alcohol in a pub?\n+ 18\n- 16\n- 17\n- 21\nE: You must be **18** to buy alcohol.\n\nQ: At what age can people drink wine or beer with a meal in a hotel or restaurant, if with someone over 18?\n+ 16\n- 14\n- 17\n- 18\nE: At **16** you can drink wine or beer **with a meal**, if accompanied by someone over 18.\n\nQ: How old must you be to enter a betting shop?\n+ 18\n- 16\n- 21\n- 17\nE: You must be **18** to go into betting shops or gambling clubs.\n\nQ: What must all dogs in public places wear?\n+ A collar showing the name and address of the owner\n- A muzzle\n- A lead at least two metres long\n- A microchip tag with a photo\nE: Dogs in public must wear a **collar with the owner's name and address**.\n\nQ: How many national parks are there in England, Wales and Scotland?\n+ 15\n- 10\n- 20\n- 25\nE: There are **15 national parks** in England, Wales and Scotland.\n\nQ: When was the National Trust founded?\n+ 1895\n- 1795\n- 1945\n- 1851\nE: The **National Trust** was founded in **1895 by three volunteers**.\n\nQ: What is \"Big Ben\"?\n+ The great bell of the clock at the Houses of Parliament\n- The tower of Westminster Abbey\n- A clock in Trafalgar Square\n- The largest bell in St Paul's Cathedral\nE: **Big Ben** is the nickname for the **great bell**. The tower is called **Elizabeth Tower**.\n\nQ: Where is the Eden Project?\n+ Cornwall\n- Devon\n- Kent\n- Wales\nE: The **Eden Project**, with its giant greenhouses (**biomes**), is in **Cornwall**.\n\nQ: Where is the Giant's Causeway?\n+ The north-east coast of Northern Ireland\n- The west coast of Scotland\n- North Wales\n- Cornwall\nE: The **Giant's Causeway** is in **Northern Ireland**, formed from **volcanic lava** about 50 million years ago.\n\nQ: What is the highest mountain in Wales?\n+ Snowdon\n- Ben Nevis\n- Scafell Pike\n- Slieve Donard\nE: **Snowdon**, in **Snowdonia** national park, is the highest mountain in Wales.\n\nQ: What is England's largest national park?\n+ The Lake District\n- Snowdonia\n- Dartmoor\n- The Peak District\nE: The **Lake District** is England's largest national park. Its biggest lake is **Windermere**.\n\nQ: What is the largest expanse of fresh water in mainland Britain?\n+ Loch Lomond\n- Windermere\n- Loch Ness\n- Wastwater\nE: **Loch Lomond** is the largest expanse of fresh water in mainland Britain.\n\nQ: Who gives tours at the Tower of London?\n+ Yeoman Warders (Beefeaters)\n- Members of the Royal Family\n- Soldiers of the Scots Guards\n- National Trust volunteers\nE: Tours are given by the **Yeoman Warders**, known as **Beefeaters**. The **Crown Jewels** are kept there.\n\nQ: The London Eye was originally built to celebrate what?\n+ The new millennium\n- The Queen's Golden Jubilee\n- The 2012 Olympics\n- The end of the Second World War\nE: The **London Eye** was built for the **millennium** and is part of New Year celebrations.\n\nQ: In 2007, which place did TV viewers vote as Britain's favourite view?\n+ Wastwater\n- Windermere\n- Loch Lomond\n- The Giant's Causeway\nE: **Wastwater** in the Lake District was voted Britain's favourite view.\n", "# 5\nQ: Which TWO were demands of the Chartists?\n+ Secret ballots\n+ For MPs to be paid\n- Votes for women over 30\n- Elections every five years\nE: The Chartists wanted **votes for every man, annual elections, equal regions, secret ballots, any man able to stand as an MP, and paid MPs**.\n\nQ: Before the reforms of the 19th century, who could vote?\n+ Men over 21 who owned a certain amount of property\n- All men over 18\n- All men and women over 21\n- Only members of the House of Lords\nE: At the start of the 19th century only **men over 21 who owned property** could vote.\n\nQ: When was the voting age reduced to 18?\n+ 1969\n- 1928\n- 1918\n- 1979\nE: The voting age was lowered to **18 in 1969**.\n\nQ: Which statement is correct?\n+ The British constitution is not written down in a single document\n- The British constitution is written in a single document called the Bill of Rights\nE: The constitution is \"**unwritten**\" – not set out in **any single document**.\n\nQ: Why does the UK not have a written constitution?\n+ The UK has never had a revolution that led to a totally new system of government\n- Parliament has never agreed on the wording\n- The monarch has refused to sign one\n- It was lost in the Great Fire of London\nE: Unlike America or France, the UK has **never had a revolution** that created a totally new system.\n\nQ: Which TWO are constitutional institutions of the UK?\n+ The civil service\n+ The judiciary\n- The BBC\n- The National Trust\nE: The institutions include **the monarchy, Parliament, the PM, the cabinet, the judiciary, the police, the civil service and local government**.\n\nQ: What is a constitutional monarchy?\n+ The monarch does not rule but appoints the government chosen by the people\n- The monarch makes all the laws\n- The monarch is elected every five years\n- The monarch leads the army in wartime only\nE: In a **constitutional monarchy** the monarch **does not rule**; decisions are made by the **PM and cabinet**.\n\nQ: Which TWO things can the monarch do in meetings with the Prime Minister?\n+ Advise and warn\n+ Encourage\n- Veto new laws\n- Dismiss cabinet ministers\nE: The monarch can **advise, warn and encourage**, but the **PM and cabinet** decide policy.\n\nQ: Who is the heir to the throne?\n+ William, Prince of Wales\n- Prince Harry\n- Prince George\n- Prince Edward\nE: King Charles III's heir is his elder son **William, Prince of Wales**, followed by **George, Charlotte and Louis**.\n\nQ: What important ceremonial role does the monarch have each year?\n+ Opening the new parliamentary session\n- Choosing the Speaker\n- Counting votes at elections\n- Writing the national budget\nE: The monarch **opens each new parliamentary session** with a speech summarising the government's policies.\n\nQ: All Acts of Parliament are made in the monarch's name.\n+ True\n- False\nE: **All Acts of Parliament are made in the monarch's name**.\n\nQ: What is the national anthem of the UK?\n+ God Save the King\n- Land of Hope and Glory\n- Rule Britannia\n- Jerusalem\nE: The national anthem is **\"God Save the King\"** (or Queen).\n\nQ: Which statement is correct?\n+ New citizens can swear an oath or make an affirmation of allegiance to the King\n- New citizens must swear an oath of allegiance to the Prime Minister\nE: New citizens **swear or affirm** allegiance to the **King** at the citizenship ceremony.\n\nQ: In which year did Queen Elizabeth II celebrate her Diamond Jubilee?\n+ 2012\n- 2002\n- 2022\n- 1977\nE: Elizabeth II celebrated **60 years as queen in 2012**. She reigned from **1952** until her death in **2022**.\n\nQ: Why is the House of Commons regarded as more important than the House of Lords?\n+ Its members are democratically elected\n- It is older\n- It has more members\n- The monarch sits there\nE: The **Commons** is more important because its members are **democratically elected**.\n\nQ: Which TWO are responsibilities of MPs?\n+ Representing everyone in their constituency\n+ Helping to create new laws\n- Appointing judges\n- Running the police\nE: MPs **represent their constituents, help create laws, scrutinise the government and debate national issues**.\n\nQ: Members of the House of Lords are elected by the people.\n- True\n+ False\nE: Members of the Lords, called **peers**, are **not elected** and do not represent a constituency.\n\nQ: Since 1958, who has had the power to nominate life peers?\n+ The Prime Minister\n- The Speaker\n- The Archbishop of Canterbury\n- The Lord Chancellor\nE: **Since 1958** the **PM** can nominate **life peers**, who are appointed by the monarch.\n\nQ: Which TWO groups were members of the House of Lords before 1958?\n+ Hereditary peers\n+ Bishops of the Church of England\n- Elected councillors\n- Members of the Scottish Parliament\nE: Before 1958 all peers were **hereditary**, **senior judges** or **Church of England bishops**.\n\nQ: What happened to hereditary peers in 1999?\n+ They lost the automatic right to attend the House of Lords\n- They were all removed from Parliament\n- They were given the right to vote in the Commons\n- They became life peers\nE: **Since 1999** hereditary peers elect a few of their number to represent them.\n\nQ: Which statement is correct?\n+ The House of Commons can overrule the House of Lords\n- The House of Lords can overrule the House of Commons\nE: The **Commons** has powers to overrule the **Lords**, though they are not used often.\n\nQ: Who chairs debates in the House of Commons?\n+ The Speaker\n- The Prime Minister\n- The Leader of the Opposition\n- The monarch\nE: Debates are chaired by **the Speaker**, the chief officer of the Commons.\n\nQ: How is the Speaker chosen?\n+ By other MPs in a secret ballot\n- By the Prime Minister\n- By the monarch\n- By a public vote\nE: The **Speaker** is chosen by **other MPs in a secret ballot** and is politically neutral.\n\nQ: The Speaker represents a constituency like any other MP.\n+ True\n- False\nE: The Speaker is **neutral** but is still an MP and deals with constituents' problems.\n\nQ: How often must a General Election be held?\n+ At least every five years\n- Every four years\n- Every three years\n- Every seven years\nE: MPs are elected at a **General Election** held **at least every five years**.\n\nQ: What happens if an MP dies or resigns?\n+ A by-election is held in their constituency\n- The Prime Minister appoints a replacement\n- The seat stays empty until the next General Election\n- The party chooses a replacement without an election\nE: There is a fresh election – a **by-election** – in that constituency.\n\nQ: What is the system used to elect MPs called?\n+ First past the post\n- Proportional representation\n- The alternative vote\n- The single transferable vote\nE: Under **first past the post**, the candidate with **the most votes** in each constituency wins.\n\nQ: What are local meetings where MPs meet constituents called?\n+ Surgeries\n- Clinics\n- Assemblies\n- Councils\nE: Many MPs hold local \"**surgeries**\" where constituents can raise issues in person.\n\nQ: Where is the Prime Minister's official home?\n+ 10 Downing Street\n- 11 Downing Street\n- Buckingham Palace\n- Chequers\nE: The PM lives at **10 Downing Street**; the country house is **Chequers**.\n\nQ: What is the name of the Prime Minister's country house?\n+ Chequers\n- Balmoral\n- Sandringham\n- Windsor\nE: The PM's country house outside London is **Chequers**.\n\nQ: Who is responsible for the economy?\n+ The Chancellor of the Exchequer\n- The Home Secretary\n- The Foreign Secretary\n- The Prime Minister\nE: The **Chancellor of the Exchequer** is responsible for the **economy**.\n\nQ: Who is responsible for crime, policing and immigration?\n+ The Home Secretary\n- The Foreign Secretary\n- The Chancellor of the Exchequer\n- The Justice Secretary\nE: The **Home Secretary** handles **crime, policing and immigration**.\n\nQ: About how many senior MPs make up the cabinet?\n+ 20\n- 10\n- 50\n- 100\nE: The PM appoints about **20 senior MPs** to the cabinet, which usually meets **weekly**.\n\nQ: Which party forms the opposition?\n+ The second-largest party in the House of Commons\n- The party with the fewest MPs\n- All parties not in government together\n- The largest party in the House of Lords\nE: The **opposition** is the **second-largest party** in the Commons.\n\nQ: What is the shadow cabinet?\n+ Senior opposition MPs who challenge the government\n- Ministers who have retired\n- Advisers to the monarch\n- Civil servants who support ministers\nE: The leader of the opposition appoints **shadow ministers** who form the **shadow cabinet**.\n\nQ: What important weekly event lets the opposition challenge the government?\n+ Prime Minister's Questions\n- The King's Speech\n- The Budget\n- Cabinet meetings\nE: **Prime Minister's Questions** takes place every week while Parliament is sitting.\n\nQ: What is the minimum age to stand for election as an MP?\n+ 18\n- 21\n- 16\n- 25\nE: **Anyone aged 18 or over** can stand for election as an MP.\n\nQ: What are MPs who do not represent any of the main political parties called?\n+ Independents\n- Backbenchers\n- Peers\n- Shadow ministers\nE: MPs with no party are called **independents**.\n\nQ: Which TWO are examples of pressure groups?\n+ Greenpeace\n+ Liberty\n- The Labour Party\n- The House of Lords\nE: Pressure groups try to influence policy, e.g. the **CBI**, **Greenpeace** (environment) and **Liberty** (human rights).\n\nQ: Which TWO are core values of the civil service?\n+ Integrity\n+ Impartiality\n- Loyalty to a political party\n- Secrecy\nE: Civil service core values: **integrity, honesty, objectivity and impartiality**.\n\nQ: Civil servants are politically neutral.\n+ True\n- False\nE: Civil servants are **chosen on merit** and are **politically neutral**.\n\nQ: How many local authorities does London have?\n+ 33\n- 12\n- 25\n- 50\nE: **London has 33 local authorities**, coordinated by the **Greater London Authority** and the Mayor of London.\n\nQ: In which month are local elections for councillors usually held?\n+ May\n- January\n- September\n- November\nE: Local elections are held in **May** every year for most local authorities.\n\nQ: Which TWO policy areas remain under UK central government control?\n+ Defence\n+ Foreign affairs\n- Education in Scotland\n- Health in Wales\nE: **Defence, foreign affairs, immigration, taxation and social security** remain with the UK government.\n\nQ: Since when have there been a Scottish Parliament and a Welsh Assembly?\n+ 1999\n- 1997\n- 1707\n- 2007\nE: Both have existed since **1999**; devolution began in **1997**.\n\nQ: How many members does the Scottish Parliament have?\n+ 129\n- 60\n- 90\n- 650\nE: There are **129 MSPs**, elected by **proportional representation**.\n\nQ: Where does the Scottish Parliament sit?\n+ Holyrood, Edinburgh\n- Stormont, Edinburgh\n- Glasgow\n- The Senedd, Edinburgh\nE: The Scottish Parliament meets at **Holyrood** in **Edinburgh**.\n\nQ: How many members does the Welsh Assembly have?\n+ 60\n- 129\n- 90\n- 40\nE: The National Assembly for Wales has **60 members**, elected every **four years**.\n\nQ: Where is the Welsh Assembly based?\n+ Cardiff\n- Swansea\n- Newport\n- Bangor\nE: The Welsh government and Assembly are in **Cardiff**; members meet in the **Senedd** in Cardiff Bay.\n\nQ: How many members does the Northern Ireland Assembly have?\n+ 90\n- 60\n- 129\n- 108\nE: The NI Assembly has **90 MLAs**, elected by **proportional representation**.\n\nQ: Where does the Northern Ireland Assembly meet?\n+ Stormont, Belfast\n- Holyrood, Belfast\n- Belfast City Hall\n- Armagh\nE: MLAs meet at **Stormont** in **Belfast**.\n\nQ: Which TWO matters can the Scottish Parliament legislate on?\n+ Civil and criminal law\n+ Education\n- Defence\n- Foreign affairs\nE: Scotland can legislate on **civil and criminal law, health, education, planning** and **additional tax-raising**.\n\nQ: Which agreement led to the Northern Ireland Assembly?\n+ The Good Friday (Belfast) Agreement\n- The Treaty of Rome\n- The Act of Union\n- The Magna Carta\nE: The NI Assembly was set up soon after the **Good Friday (Belfast) Agreement of 1998**.\n\nQ: The UK government has the power to suspend the devolved assemblies.\n+ True\n- False\nE: It has used this power several times in **Northern Ireland**.\n\nQ: What are the official reports of proceedings in Parliament called?\n+ Hansard\n- The Gazette\n- The Statute Book\n- The Domesday Book\nE: Parliament's proceedings are published in **Hansard**.\n\nQ: Which statement is correct?\n+ Radio and TV coverage of political parties must be balanced\n- Radio and TV stations may support one political party\nE: By law, broadcast coverage must be **balanced**, giving equal time to rival views.\n\nQ: Which TWO groups can vote in all UK public elections if resident in the UK?\n+ Commonwealth citizens\n+ Irish Republic citizens\n- US citizens\n- Chinese citizens\nE: Adult **UK, Commonwealth and Irish Republic** citizens resident in the UK can vote in **all public elections**.\n\nQ: When is the electoral register updated?\n+ Every year in September or October\n- Every five years\n- Every January\n- Only before a General Election\nE: The **electoral register** is updated **every September or October**.\n\nQ: In which part of the UK must every person complete their own voter registration form?\n+ Northern Ireland\n- Scotland\n- Wales\n- England\nE: **Northern Ireland** uses **individual registration**.\n\nQ: What are the opening hours of polling stations on election day?\n+ 7.00 am to 10.00 pm\n- 8.00 am to 8.00 pm\n- 9.00 am to 5.00 pm\n- 6.00 am to midnight\nE: Polling stations are open from **7.00 am until 10.00 pm**.\n\nQ: In which part of the UK must voters show photographic identification at the polling station?\n+ Northern Ireland\n- Scotland\n- Wales\n- England\nE: In **Northern Ireland** you must show **photographic identification**.\n\nQ: What can you do if it is difficult for you to get to a polling station?\n+ Register for a postal ballot\n- Vote by telephone\n- Ask a friend to vote for you without registering\n- Vote at the next election instead\nE: You can register for a **postal ballot** and send your vote by post.\n\nQ: Which TWO groups cannot stand for public office?\n+ Members of the armed forces\n+ Civil servants\n- Teachers\n- Doctors\nE: Exceptions include **armed forces members, civil servants and people convicted of certain crimes**.\n\nQ: Members of the House of Lords may stand for election to the House of Commons.\n- True\n+ False\nE: **Peers cannot stand for the House of Commons**, though they can stand for other public offices.\n\nQ: Who is the ceremonial head of the Commonwealth?\n+ The monarch\n- The Prime Minister\n- The Secretary-General of the UN\n- The President of the USA\nE: The **monarch** is the ceremonial head of the **Commonwealth**.\n\nQ: Which TWO are core values of the Commonwealth?\n+ Democracy\n+ The rule of law\n- A shared currency\n- A single army\nE: The Commonwealth is based on **democracy, good government and the rule of law**.\n\nQ: The Commonwealth has power over its members and can make their laws.\n- True\n+ False\nE: Membership is **voluntary**. The Commonwealth has **no power over its members**, although it can **suspend** them.\n\nQ: Which treaty set up the European Economic Community in 1957?\n+ The Treaty of Rome\n- The Treaty of Paris\n- The Treaty of Versailles\n- The Maastricht Treaty\nE: Six countries signed the **Treaty of Rome on 25 March 1957**.\n\nQ: Which TWO countries were founding members of the European Economic Community?\n+ Belgium\n+ Luxembourg\n- The UK\n- Spain\nE: The founders were **Belgium, France, Germany, Italy, Luxembourg and the Netherlands**.\n\nQ: When did the UK officially leave the European Union?\n+ 31 January 2020\n- 23 June 2016\n- 1 January 2021\n- 31 December 2019\nE: **Brexit** took place at 23:00 GMT on **31 January 2020**.\n\nQ: Which statement is correct?\n+ The Council of Europe is separate from the EU and cannot make laws\n- The Council of Europe is p
