<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">

<body>
<title>Life in the UK Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: single reading column (max 680px) on warm paper; tab screens get a fixed bottom bar, inner screens a sticky top bar. */
:root {
  --bg: #f8f7f3; --surface: #ffffff; --surface-2: #f1efea; --line: #e2e0da;
  --fg: #1b1c1e; --muted: #5d5e61;
  --primary: #1d3557; --on-primary: #ffffff; --primary-soft: #dce5f3; --on-primary-soft: #0f1f36;
  --mark: #ffe89a; --on-mark: #2b2300;
  --ok: #2e7d4f; --ok-soft: #ddf1e4; --bad: #b3261e; --bad-soft: #f9dedc;
  --tip: #e8eef8; --on-tip: #1d3557; --accent: #c8102e;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-read: "Source Serif 4", Georgia, "Times New Roman", serif;
  --read-scale: 1;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121316; --surface: #1b1c20; --surface-2: #232428; --line: #34353a;
    --fg: #e4e2de; --muted: #b3b2ae;
    --primary: #a9c2e8; --on-primary: #0f2440; --primary-soft: #263b5a; --on-primary-soft: #dce5f3;
    --mark: #5a4a12; --on-mark: #fff4cc;
    --ok: #7bd19a; --ok-soft: #1e3a29; --bad: #f2b8b5; --bad-soft: #4a1f1c;
    --tip: #1f2a3a; --on-tip: #c9d8f0; --accent: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121316; --surface: #1b1c20; --surface-2: #232428; --line: #34353a;
  --fg: #e4e2de; --muted: #b3b2ae;
  --primary: #a9c2e8; --on-primary: #0f2440; --primary-soft: #263b5a; --on-primary-soft: #dce5f3;
  --mark: #5a4a12; --on-mark: #fff4cc;
  --ok: #7bd19a; --ok-soft: #1e3a29; --bad: #f2b8b5; --bad-soft: #4a1f1c;
  --tip: #1f2a3a; --on-tip: #c9d8f0; --accent: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; line-height: 1.45;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
mark { background: var(--mark); color: var(--on-mark); font-weight: 600; border-radius: 3px; padding: 0 1px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

.wrap {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 32px;
}
.tabs-page .wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 680px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 4px;
  padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
}
.topbar-title { flex: 1; min-width: 0; font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; flex: none; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 24px; height: 24px; }
.text-btn-sm { height: 40px; padding: 0 10px; border-radius: 20px; font-weight: 600; font-size: 17px; color: var(--muted); }
.readbar { height: 2px; background: var(--line); }
.readbar > div { height: 2px; width: 0; background: var(--primary); }
.timer { display: flex; align-items: center; gap: 4px; font-weight: 600; font-variant-numeric: tabular-nums; padding-right: 6px; }
.timer.low { color: var(--bad); }
.timer svg { width: 18px; height: 18px; }

/* Bottom tabs */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface-2); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tabbar-in { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tab .pill { width: 60px; height: 30px; border-radius: 15px; display: grid; place-items: center; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--fg); }
.tab.on .pill { background: var(--primary-soft); color: var(--on-primary-soft); }

/* Type */
.h-page { font-size: 28px; font-weight: 650; letter-spacing: -0.4px; }
.sub { color: var(--muted); font-size: 16px; }
.label {
  font-size: 12px; font-weight: 650; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted);
  margin: 18px 4px 2px;
}
.small { font-size: 13px; color: var(--muted); }

/* Cards and rows */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
button.card, .row { width: 100%; display: block; }
button.card:active { background: var(--surface-2); }
.row-in { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.row-text { flex: 1; min-width: 0; }
.row-title { font-weight: 600; font-size: 16px; }
.row-sub { color: var(--muted); font-size: 14px; }
.chev { width: 20px; height: 20px; color: var(--muted); flex: none; }
.badge {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none;
  background: var(--primary-soft); color: var(--on-primary-soft); font-weight: 650; font-size: 16px;
}
.badge svg { width: 22px; height: 22px; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.dot { width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--muted); font-size: 14px; font-weight: 600; }
.dot.ok { background: var(--ok); color: var(--surface); }
.dot svg { width: 17px; height: 17px; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; flex: 1; }
.bar > div { height: 100%; border-radius: 3px; background: var(--primary); transition: width .3s; }
.bar.ok > div { background: var(--ok); }
.bar-row { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.hero { background: var(--primary); color: var(--on-primary); border-radius: 24px; padding: 20px; }
.hero .muted { opacity: .78; }
.hero-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 12px; margin-top: 16px; }
.stat-v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stat-l { font-size: 13px; opacity: .78; }
.ring { position: relative; flex: none; }
.ring > svg { display: block; transform: rotate(-90deg); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 650; font-size: 15px; }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; padding: 8px 16px;
  border-radius: 16px; font-weight: 600; text-align: center;
}
.btn svg { width: 19px; height: 19px; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-ok { background: var(--ok); color: var(--surface); }
.btn-outline { border: 1px solid var(--line); background: var(--surface); }
.btn-light { background: var(--on-primary); color: var(--primary); }
.btn:disabled { opacity: .45; cursor: default; }
.btn .two { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.btn .two small { font-size: 12px; font-weight: 500; opacity: .85; }
.btn .two b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-row { display: flex; gap: 12px; }
.btn-row > * { flex: 1; min-width: 0; }
.link-btn { display: block; width: 100%; text-align: center; padding: 14px; color: var(--muted); font-weight: 600; font-size: 15px; }

/* Reader */
.reader { padding-top: 20px; }
.eyebrow { font-size: 12px; font-weight: 650; letter-spacing: 1px; color: var(--primary); text-transform: uppercase; }
.reader h1 { font-family: var(--font-read); font-weight: 600; font-size: calc(30px * var(--read-scale)); line-height: 1.2; margin: 6px 0 20px; }
.prose { font-family: var(--font-read); font-size: calc(18.5px * var(--read-scale)); line-height: 1.62; }
.prose > * + * { margin-top: 16px; }
.prose h3 { font-family: var(--font-ui); color: var(--primary); font-size: calc(19px * var(--read-scale)); font-weight: 650; margin-top: 26px; }
.prose ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.prose li { position: relative; padding-left: 20px; }
.prose li::before { content: ""; position: absolute; left: 4px; top: .7em; width: 6px; height: 6px; border-radius: 3px; background: var(--primary); }
.person { padding: 16px; font-size: .93em; }
.person-head { display: flex; align-items: center; gap: 12px; font-family: var(--font-ui); font-weight: 650; font-size: calc(16px * var(--read-scale)); margin-bottom: 8px; }
.person-head .av { width: 32px; height: 32px; border-radius: 16px; background: var(--primary-soft); color: var(--on-primary-soft); display: grid; place-items: center; flex: none; }
.person-head svg { width: 18px; height: 18px; }
.tip { display: flex; gap: 12px; padding: 16px; border-radius: var(--radius); background: var(--tip); color: var(--on-tip); font-family: var(--font-ui); font-size: calc(15px * var(--read-scale)); line-height: 1.5; }
.tip svg { width: 20px; height: 20px; flex: none; margin-top: 1px; }
.quote { border-left: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); padding-left: 16px; font-style: italic; }
.quote cite { display: block; margin-top: 6px; font-family: var(--font-ui); font-style: normal; font-size: 13px; font-weight: 600; color: var(--muted); }
.table { padding: 4px 0; font-family: var(--font-ui); font-size: calc(15px * var(--read-scale)); line-height: 1.45; }
.trow { display: grid; grid-template-columns: minmax(84px, 30%) 1fr; gap: 10px; padding: 9px 16px; }
.table.narrow .trow { grid-template-columns: 22px 1fr; }
.trow + .trow { border-top: 1px solid var(--line); }
.trow > :first-child { color: var(--primary); font-weight: 650; }
.trow > * { min-width: 0; overflow-wrap: anywhere; }

/* Facts */
.facts-head { display: flex; align-items: center; gap: 12px; padding: 16px 16px 4px; }
.fact { display: flex; gap: 14px; width: 100%; padding: 12px 16px; font-size: 16px; line-height: 1.45; }
.fact + .fact { border-top: 1px solid var(--line); }
.fact .tick { width: 22px; height: 22px; border-radius: 11px; background: var(--surface-2); flex: none; margin-top: 1px; display: grid; place-items: center; color: var(--surface); }
.fact .tick svg { width: 15px; height: 15px; visibility: hidden; }
.fact.on .tick { background: var(--ok); }
.fact.on .tick svg { visibility: visible; }
.fact.on .ft { color: var(--muted); }

/* Flashcards */
.flash-wrap { perspective: 1400px; height: min(58vh, 460px); min-height: 300px; margin: 18px 0; }
.flash { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .4s ease; }
.flash.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px; gap: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,.12);
}
.face.front { background: var(--surface); border: 1px solid var(--line); }
.face.back { background: var(--primary); color: var(--on-primary); transform: rotateY(180deg); }
.face .q { font-size: 23px; font-weight: 650; line-height: 1.3; text-wrap: balance; }

/* Quiz */
.qdots { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 6px; scrollbar-width: none; }
.qdots::-webkit-scrollbar { display: none; }
.qdot { width: 34px; height: 34px; border-radius: 17px; flex: none; display: grid; place-items: center; font-size: 14px; font-weight: 600; background: var(--surface-2); color: var(--muted); font-variant-numeric: tabular-nums; }
.qdot.done { background: var(--primary-soft); color: var(--on-primary-soft); }
.qdot.cur { background: var(--primary); color: var(--on-primary); }
.qtext { font-size: 21px; font-weight: 650; line-height: 1.3; margin-top: 8px; }
.opts { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.opt .key { width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--muted); font-weight: 650; font-size: 14px; }
.opt .key svg { width: 18px; height: 18px; }
.opts.multi .opt .key { border-radius: 8px; }
.opt.sel { border: 2px solid var(--primary); background: var(--primary-soft); padding: 13px 15px; }
.opt.sel .key { background: var(--primary); color: var(--on-primary); }
.opt.right { border: 2px solid var(--ok); background: var(--ok-soft); padding: 13px 15px; }
.opt.right .key { background: var(--ok); color: var(--surface); }
.opt.wrong { border: 2px solid var(--bad); background: var(--bad-soft); padding: 13px 15px; }
.opt.wrong .key { background: var(--bad); color: var(--surface); }
.explain { margin-top: 16px; padding: 16px; border-radius: 16px; }
.explain.good { background: var(--ok-soft); }
.explain.bad { background: var(--bad-soft); }
.explain h3 { font-size: 16px; margin-bottom: 4px; }
.explain.good h3 { color: var(--ok); }
.explain.bad h3 { color: var(--bad); }
.quiz-foot {
  position: sticky; bottom: 0; background: var(--bg); padding-top: 12px;
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); margin-top: 20px;
}
.result-top { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 16px 0 8px; }
.result-top .ring span { font-size: 26px; flex-direction: column; }
.verdict { font-size: 22px; font-weight: 650; margin-top: 10px; }
.verdict.good { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.rv { padding: 16px; }
.rv .yours { color: var(--bad); font-size: 14px; margin-top: 8px; }
.rv .correct { color: var(--ok); font-size: 14px; font-weight: 600; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chip { padding: 9px 14px; border-radius: 14px; flex: none; }
.chip b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.chip.good { background: var(--ok-soft); } .chip.good b { color: var(--ok); }
.chip.bad { background: var(--bad-soft); } .chip.bad b { color: var(--bad); }

/* Chapter complete */
.done-top { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 28px 0 8px; }
.card.choice { display: flex; align-items: center; gap: 16px; padding: 18px; text-align: left; }
.choice svg { width: 26px; height: 26px; flex: none; }
.choice.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.choice.primary .row-sub { color: var(--on-primary); opacity: .8; }

/* Modal */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 24px; }
.dialog { background: var(--surface); border-radius: 24px; padding: 22px; max-width: 360px; width: 100%; }
.dialog h2 { font-size: 20px; margin-bottom: 8px; }
.dialog p { color: var(--muted); }
.dialog .acts { display: flex; justify-content: flex-end; gap: 6px; margin-top: 20px; }
.dialog .acts button { padding: 10px 14px; border-radius: 12px; font-weight: 650; color: var(--primary); }

.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); }
.field input {
  width: 100%; height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  padding: 0 14px; font: inherit; font-size: 17px; font-weight: 400;
}
.field input:focus { outline: 2px solid var(--primary); outline-offset: 0; border-color: transparent; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; margin: 6px 0; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.notice { padding: 12px 14px; border-radius: 14px; font-size: 15px; }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.good { background: var(--ok-soft); color: var(--ok); }
.menu-note { padding: 12px 16px 4px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.foot-note { font-size: 13px; color: var(--muted); padding: 16px 4px 0; }
.menu { position: absolute; right: 0; top: 46px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.15); z-index: 8; min-width: 200px; overflow: hidden; }
.menu button { display: block; width: 100%; padding: 14px 16px; }
@media (prefers-reduced-motion: reduce) { .flash, .bar > div { transition: none; } }
</style>

<script>

const CONTENT = {"chapters": ["@title The values and principles of the UK\n@subtitle British values, your rights and responsibilities, and the test\n@intro This short chapter is fully testable. Expect questions on the **five fundamental principles**, the **responsibilities and freedoms** of residents, and how the Life in the UK test works.\n\n@section British values\nBritish society is built on shared values that everyone living in the UK is expected to respect. They come from **history and tradition** and are protected by **law, customs and expectations**. There is **no place in British society for extremism or intolerance**.\n\n## The fundamental principles of British life\n- **Democracy**\n- **The rule of law**\n- **Individual liberty**\n- **Tolerance of those with different faiths and beliefs**\n- **Participation in community life**\n\n! A common trick is to offer a \"principle\" that sounds plausible but is not on this list, such as \"a duty to vote\" or \"loyalty to your employer\". Learn the five exactly.\n\n## The citizenship pledge\nNew citizens promise to uphold these values at their citizenship ceremony:\n\n\" I will give my loyalty to the United Kingdom and respect its rights and freedoms.\n\" I will uphold its democratic values.\n\" I will observe its laws faithfully and fulfil my duties and obligations as a British citizen.\n\"— The citizenship pledge\n\n## What is expected of you\nIf you want to be a permanent resident or citizen of the UK, you should:\n- **respect and obey the law**\n- **respect the rights of others**, including their right to their own opinions\n- **treat others with fairness**\n- **look after yourself and your family**\n- **look after the area in which you live and the environment**\n\n## What the UK offers in return\n- **freedom of belief and religion**\n- **freedom of speech**\n- **freedom from unfair discrimination**\n- **a right to a fair trial**\n- **a right to join in the election of a government**\n\n! Questions often ask you to pick \"two responsibilities\" or \"two freedoms\". Responsibilities are things you do (obey the law, look after your family); freedoms are things you receive (free speech, fair trial).\n\n@remember\n- The five principles: **democracy, the rule of law, individual liberty, tolerance of other faiths and beliefs, participation in community life**\n- British values are based on **history and traditions** and protected by **law, customs and expectations**\n- There is **no place for extremism or intolerance**\n- New citizens make a **pledge** of loyalty at a **citizenship ceremony**\n- Responsibilities: **obey the law, respect others' rights, treat others fairly, look after yourself and your family, look after your area and the environment**\n- Freedoms: **belief and religion, speech, freedom from unfair discrimination, a fair trial, joining in the election of a government**\n\n@section Becoming a permanent resident\nTo become a permanent resident or citizen you must **speak and read English** and have **a good understanding of life in the UK**.\n\nFor settlement you need to **pass the Life in the UK test** and show **speaking and listening skills in English at B1** of the Common European Framework of Reference (equivalent to **ESOL Entry Level 3**).\n\nThe handbook is written so that anyone who reads English at **ESOL Entry Level 3** can understand it. People below that level can take an **ESOL course in English with Citizenship** instead, which ends with its own test.\n\n@remember\n- You must **speak and read English** and understand **life in the UK**\n- Settlement needs the **Life in the UK test** plus English at **B1** (= **ESOL Entry Level 3**)\n- Below that level you can take an **ESOL course in English with Citizenship**\n\n@section Taking the Life in the UK test\n## The format\n- **24 questions** about important aspects of life in the UK\n- Questions are based on **all parts of the handbook**, including the introduction\n- Every candidate at a session gets **different questions**\n- You have **45 minutes** and need **75% (18 correct)** to pass\n\n## Booking and sitting the test\n- The test is usually taken in **English**, but can be taken in **Welsh or Scottish Gaelic** by special arrangement.\n- It can only be taken at a **registered and approved test centre** – there are about **60** around the UK.\n- You can **only book online**.\n- You must bring **identification and proof of address**, or you will not be allowed to sit the test.\n- The **Isle of Man and the Channel Islands** have different arrangements.\n\n! Only certificates from registered test centres are accepted – a test taken anywhere else does not count.\n\n@remember\n- **24 questions** from **the whole handbook**, **45 minutes**, pass mark **75% (18/24)**\n- About **60 registered test centres**; booking is **online only**\n- Can be taken in **Welsh or Scottish Gaelic** by special arrangement\n- Bring **ID and proof of address**\n- **Isle of Man and Channel Islands** have different arrangements\n", "@title What is the UK?\n@subtitle The countries, the names and the islands\n@intro The shortest chapter, but a favourite source of trick questions: the difference between **the UK**, **Great Britain** and **the British Isles**, and what the **Crown dependencies** are.\n\n@section The countries of the UK\nThe UK is made up of four countries: **England, Scotland, Wales and Northern Ireland**. The rest of Ireland is an **independent country**.\n\nThe official name is **the United Kingdom of Great Britain and Northern Ireland**.\n\n**Great Britain** means only **England, Scotland and Wales** – it does **not** include Northern Ireland. The words \"Britain\" and \"British\" are used in the handbook to mean everyone in the UK.\n\n! \"Great Britain\" vs \"United Kingdom\" is one of the most common test questions. Great Britain = 3 countries. UK = 4 countries.\n\n| UK | England, Scotland, Wales, Northern Ireland\n| Great Britain | England, Scotland, Wales\n\n@remember\n- The UK = **England, Scotland, Wales and Northern Ireland**\n- Official name: **the United Kingdom of Great Britain and Northern Ireland**\n- **Great Britain** = England, Scotland and Wales only (**not** Northern Ireland)\n- The rest of Ireland is an **independent country**\n\n@section Crown dependencies and overseas territories\nSome islands are closely linked to the UK but are **not part of it**:\n\n- **The Channel Islands** and **the Isle of Man** have their **own governments** and are called **Crown dependencies**.\n- **British overseas territories** in other parts of the world, such as **St Helena** and **the Falkland Islands**, are also linked to the UK but are **not part of it**.\n\n## How the UK is governed\nThe UK is governed by **the Parliament sitting in Westminster**. Scotland, Wales and Northern Ireland also have their **own parliaments or assemblies** with **devolved powers** in defined areas.\n\n@remember\n- **Crown dependencies**: the **Channel Islands** and the **Isle of Man** – own governments, **not part of the UK**\n- **Overseas territories**: e.g. **St Helena** and the **Falkland Islands** – also **not part of the UK**\n- The UK is governed from **Westminster**; Scotland, Wales and NI have **devolved** parliaments or assemblies\n", "@title A long and illustrious history\n@subtitle From the Stone Age to the present day\n@intro The biggest chapter and the source of many questions. Told here in order, from the first farmers to today. Focus on **dates**, **who did what**, **battles**, **Acts of Parliament** and how **Parliament and the right to vote** developed.\n\n@section Early Britain\n## The Stone Age\nThe first people in Britain were **hunter-gatherers**. For much of the Stone Age, Britain was joined to the continent by a land bridge. It became an island, separated by the Channel, about **10,000 years ago**.\n\nThe **first farmers arrived about 6,000 years ago**, probably from **south-east Europe**. They built houses, tombs and monuments – including **Stonehenge** in **Wiltshire**, probably a gathering place for seasonal ceremonies. **Skara Brae on Orkney** is the **best-preserved prehistoric village in northern Europe**.\n\n## The Bronze and Iron Ages\nAround **4,000 years ago** people learned to make **bronze**. They lived in **roundhouses** and buried their dead in tombs called **round barrows**, and were skilled metalworkers in bronze and gold.\n\nIn the **Iron Age** people made tools and weapons from iron and built defended sites called **hill forts** – an impressive one is **Maiden Castle in Dorset**. They spoke languages from the **Celtic** family (related languages survive in Wales, Scotland and Ireland) and made **the first coins minted in Britain**, some inscribed with the names of Iron Age kings. This marks **the beginning of British history**.\n\n## The Romans (AD 43 – AD 410)\n**Julius Caesar** invaded in **55 BC** but failed. In **AD 43 Emperor Claudius** led a successful invasion. **Boudicca**, queen of the **Iceni** in eastern England, fought the Romans – her **statue stands on Westminster Bridge** near Parliament.\n\nParts of Scotland were never conquered. **Emperor Hadrian** built **Hadrian's Wall** to keep out the **Picts** (ancestors of the Scots). Forts such as **Housesteads** and **Vindolanda** can still be seen; it is a **UNESCO World Heritage Site**.\n\nThe Romans stayed for **400 years**, building roads and public buildings, creating a structure of law and introducing new plants and animals. The **first Christian communities** appeared in the **3rd and 4th centuries AD**.\n\n## The Anglo-Saxons\nThe Roman army left in **AD 410**. Britain was invaded by the **Jutes, Angles and Saxons** from northern Europe, whose languages are **the basis of modern English**. By about **AD 600** Anglo-Saxon kingdoms were established, mainly in England; Wales and Scotland stayed free of them.\n\nA king was buried with treasure and armour in a ship at **Sutton Hoo in Suffolk**.\n\nMissionaries brought Christianity. From Ireland: **St Patrick** (patron saint of Ireland) and **St Columba**, who founded a monastery on **Iona**. From Rome: **St Augustine**, who became **the first Archbishop of Canterbury**.\n\n## The Vikings\nThe Vikings came from **Denmark and Norway**, first raiding in **AD 789**. The Anglo-Saxon kingdoms united under **King Alfred the Great**, who **defeated the Vikings**. Many Vikings settled in the east and north of England in the **Danelaw** – place names like **Grimsby** and **Scunthorpe** come from Viking languages.\n\nThere was a short period of Danish kings, the first being **Cnut (Canute)**. In the north, the Viking threat led people to unite under **Kenneth MacAlpin**, and the name **Scotland** began to be used.\n\n## The Norman Conquest (1066)\nIn **1066 William, Duke of Normandy** defeated **Harold**, the Saxon king, at the **Battle of Hastings**. William became **William the Conqueror**. The battle is shown in the **Bayeux Tapestry**, which can still be seen **in France**.\n\nIt was **the last successful foreign invasion of England**. Norman French influenced the English language. The Normans conquered Wales at first (the Welsh won land back) but **did not invade Scotland**.\n\nWilliam ordered a survey of every town and village, who owned the land and what animals they had: the **Domesday Book**, which still exists today.\n\n@remember\n- Britain became an island about **10,000 years ago**; first farmers arrived about **6,000 years ago**\n- **Stonehenge** – Wiltshire; **Skara Brae** – Orkney (best-preserved prehistoric village in northern Europe)\n- Bronze Age: **round barrows**; Iron Age: **hill forts** (e.g. **Maiden Castle**, Dorset), **Celtic** languages, **first coins**\n- **55 BC** Julius Caesar fails; **AD 43** Claudius conquers; Romans stay **400 years**, leave **AD 410**\n- **Boudicca** – queen of the **Iceni**; **Hadrian's Wall** kept out the **Picts**\n- **Jutes, Angles and Saxons** – basis of English; **Sutton Hoo** ship burial\n- **St Augustine** – first Archbishop of Canterbury; **St Columba** – Iona; **St Patrick** – Ireland\n- Vikings from **Denmark and Norway** (from **789**); **Alfred the Great** beat them; **Danelaw**; **Cnut** first Danish king; **Kenneth MacAlpin** united Scotland\n- **1066** Battle of Hastings – William beat Harold; **Bayeux Tapestry** (France); **Domesday Book**\n- The Norman Conquest was the **last successful foreign invasion** of England\n\n@section The Middle Ages\nThe period from 1066 to about **1485** is the **Middle Ages** (medieval period) – a time of almost constant war.\n\n## Wars at home and abroad\n- **Wales**: in **1284 Edward I** introduced the **Statute of Rhuddlan**, annexing Wales to the English Crown. Huge castles such as **Conwy** and **Caernarvon** were built. The last Welsh rebellions were defeated by the **mid-15th century**.\n- **Scotland**: in **1314** the Scots, led by **Robert the Bruce**, defeated the English at the **Battle of Bannockburn**. Scotland remained unconquered.\n- **Ireland**: by **1200** the English ruled an area around **Dublin** known as **the Pale**.\n- Abroad: knights fought in the **Crusades** for the Holy Land, and England fought France in the **Hundred Years War** – which actually lasted **116 years**. At the **Battle of Agincourt (1415)**, **Henry V**'s outnumbered army defeated the French. The English left France in the **1450s**.\n\n## Feudalism and the Black Death\nThe Normans used **feudalism**: the king gave land to lords in return for help in war. Most peasants were **serfs** who worked their lord's land and could not move away. In the north of Scotland and Ireland, land was owned by **clans**.\n\nIn **1348** the **Black Death** (probably plague) killed **one third of the population of England**, and a similar share in Scotland and Wales. Afterwards there were labour shortages, peasants demanded higher wages, a new class of large landowners appeared (**the gentry**), and people moved to towns, where a strong **middle class** developed.\n\n## Magna Carta and Parliament\nIn **1215 King John** was forced by his noblemen to agree to the **Magna Carta** (\"Great Charter\"). It established that **even the king was subject to the law**, protected the rights of the nobility and restricted the king's power to collect taxes or change laws.\n\nParliament grew from the king's council. Two Houses formed: the **House of Lords** (nobility, great landowners, bishops) and the **House of Commons** (knights and wealthy townspeople, elected by a small part of the population). Scotland's Parliament had **three Houses called Estates**: the lords, the commons and the clergy.\n\nThe principle that **judges are independent of government** began. English judges developed **common law** by **precedent** (following previous decisions); in Scotland laws were **codified** (written down).\n\n## Language and culture\nNorman French and Anglo-Saxon combined to become **English**. By **1400** official documents were in English, and it was the preferred language of the royal court and Parliament.\n\n**Geoffrey Chaucer** wrote **The Canterbury Tales**, poems about pilgrims travelling to Canterbury. It was one of the first books printed by **William Caxton**, **the first person in England to print books** with a printing press. In Scotland, **John Barbour** wrote **The Bruce** about Bannockburn.\n\nCastles (e.g. **Windsor** and **Edinburgh**, still in use) and great cathedrals (e.g. **Lincoln**) were built; **York Minster** is famous for its stained glass. **English wool** was a major export.\n\n## The Wars of the Roses\nIn **1455** a civil war began between the **House of Lancaster** (**red rose**) and the **House of York** (**white rose**). It ended at the **Battle of Bosworth Field in 1485**: **Richard III** (York) was killed and **Henry Tudor** (Lancaster) became **King Henry VII**. He married **Elizabeth of York**, uniting the families. The **Tudor rose** is a **red rose with a white rose inside**.\n\n@remember\n- **1284** Statute of Rhuddlan (Edward I) annexes Wales; castles **Conwy** and **Caernarvon**\n- **1314** Bannockburn – **Robert the Bruce** beats the English\n- **The Pale** – English-ruled area around Dublin\n- Hundred Years War lasted **116 years**; **Agincourt 1415** – **Henry V**\n- **1348** Black Death kills **one third** of England → labour shortages, **gentry**, **middle class**\n- **1215 Magna Carta** (King John) – **the king is subject to the law**\n- Parliament: **Lords** and **Commons**; Scotland had three **Estates**\n- **Common law** by **precedent** (England); laws **codified** (Scotland)\n- By **1400** English is the language of court and Parliament\n- **Chaucer** – Canterbury Tales; **Caxton** – first printing press in England\n- Wars of the Roses: **Lancaster (red)** v **York (white)**, **1455–1485**, ending at **Bosworth Field**; **Henry VII** first Tudor\n\n@section The Tudors\n**Henry VII** strengthened central government, reduced the power of the nobles and built up the monarchy's finances. His son **Henry VIII** is famous for **breaking away from the Church of Rome** and **marrying six times**.\n\n## The six wives of Henry VIII\n| 1 | **Catherine of Aragon** – Spanish princess; mother of **Mary**. Henry divorced her.\n| 2 | **Anne Boleyn** – English; mother of **Elizabeth**. **Executed** at the Tower of London.\n| 3 | **Jane Seymour** – gave Henry his son **Edward**; died shortly after the birth.\n| 4 | **Anne of Cleves** – German princess, married for political reasons; **divorced**.\n| 5 | **Catherine Howard** – cousin of Anne Boleyn; **executed**.\n| 6 | **Catherine Parr** – a widow; she **survived** Henry.\n\n! Memory aid: divorced, beheaded, died, divorced, beheaded, survived.\n\nWhen the **Pope refused** Henry a divorce, he established the **Church of England**, in which **the king, not the Pope**, appointed bishops. This happened alongside the **Reformation** across Europe – a Protestant movement against the Pope's authority. Protestants read the Bible in their own language and did not pray to saints. In Ireland, attempts to impose Protestantism led to rebellion.\n\nUnder Henry VIII, Wales was formally united with England by the **Act for the Government of Wales**.\n\n## Edward VI, Mary and Elizabeth I\n**Edward VI** was strongly Protestant; the **Book of Common Prayer** was written in his reign. He died at **15**. His half-sister **Mary**, a devout Catholic, persecuted Protestants and became known as **\"Bloody Mary\"**.\n\n**Elizabeth I** (daughter of Henry VIII and Anne Boleyn) was Protestant and re-established the Church of England, finding a balance between Catholics and extreme Protestants. She became one of the most popular monarchs, especially after **1588**, when the English **defeated the Spanish Armada**, sent to conquer England and restore Catholicism.\n\n## Scotland and Mary, Queen of Scots\nIn **1560** the Scottish Parliament abolished the Pope's authority and a Protestant **Church of Scotland** was set up – but, unlike in England, **not a state Church**.\n\n**Mary Stuart (Mary, Queen of Scots)** was Catholic and became queen at a week old. Suspected of involvement in her husband's murder, she fled to England and gave her throne to her Protestant son **James VI**. Elizabeth I, her cousin, kept her prisoner for **20 years** and she was eventually **executed** for plotting against Elizabeth.\n\n## Exploration, poetry and drama\nThe Elizabethan period was a time of growing **patriotism**. **Sir Francis Drake**, a commander against the Armada, sailed the **Golden Hind**, one of the first ships to **sail around the world**. English settlers first began to **colonise the east coast of America**.\n\n> William Shakespeare (1564–1616) :: Born in **Stratford-upon-Avon**. Playwright and actor; famous plays include **A Midsummer Night's Dream, Hamlet, Macbeth** and **Romeo and Juliet**. He was one of the first to portray **ordinary English people** and invented many words still used today. The **Globe Theatre** in London is a modern copy of the theatres where his plays were first performed.\n\nFamous lines and where they come from:\n- \"Once more unto the breach\" – **Henry V**\n- \"To be or not to be\" – **Hamlet**\n- \"A rose by any other name\" – **Romeo and Juliet**\n- \"All the world's a stage\" – **As You Like It**\n- \"The darling buds of May\" – **Sonnet 18**\n\n@remember\n- **Henry VII** strengthened central government\n- **Henry VIII** broke with Rome to divorce; created the **Church of England**\n- Wives in order: **Catherine of Aragon, Anne Boleyn, Jane Seymour, Anne of Cleves, Catherine Howard, Catherine Parr**\n- **Act for the Government of Wales** united Wales with England\n- **Edward VI** – Book of Common Prayer; **Mary I** – Catholic, **\"Bloody Mary\"**\n- **Elizabeth I** – Protestant; **1588** Spanish Armada defeated\n- **1560** Scotland abolishes the Pope's authority; Church of Scotland **not a state Church**\n- **Mary, Queen of Scots** – Catholic, imprisoned **20 years**, executed\n- **Francis Drake** – Golden Hind, sailed around the world\n- **Shakespeare** – born **Stratford-upon-Avon**; Hamlet, Macbeth, Romeo and Juliet; **Globe Theatre**\n\n@section The Stuarts, civil war and revolution\n## James VI and I\nElizabeth I never married. When she died in **1603** her cousin **James VI of Scotland** became **James I of England, Wales and Ireland** – but Scotland remained a **separate country**. His reign produced the **King James Version** (Authorised Version) of the **Bible** in English.\n\nIn Ireland, the English encouraged Scottish and English Protestants to settle in **Ulster**, taking land from Catholics. These settlements were called **plantations** and had serious long-term consequences.\n\n## The road to civil war\n**James I** and his son **Charles I** believed in the **Divine Right of Kings** – that the king was appointed by God and should not need Parliament's approval. Charles I tried to rule **without Parliament for 11 years**.\n\nCharles tried to impose a new Prayer Book on the **Presbyterian Church in Scotland**, causing a Scottish army to form. In **1640** he recalled Parliament for money; many MPs were **Puritans** (strict Protestants) and refused. Charles entered the House of Commons to arrest five leaders, who escaped – **no monarch has entered the Commons since**.\n\n**Civil war began in 1642**: the king's supporters were the **Cavaliers**; Parliament's supporters were the **Roundheads**. The king's army was defeated at **Marston Moor** and **Naseby**. Charles I was **executed in 1649**.\n\n## The Commonwealth: England's only republic\nEngland became a republic called **the Commonwealth**. **Oliver Cromwell** crushed the revolt in Ireland so violently that he remains controversial there. The Scots crowned **Charles II**, but Cromwell defeated him at **Dunbar** and **Worcester**; Charles escaped, famously **hiding in an oak tree**.\n\nCromwell ruled as **Lord Protector** until his death in **1658**. His son Richard could not control the army, and after **11 years** as a republic people wanted a king again.\n\n## The Restoration (1660)\nIn **1660 Charles II** returned from exile in the Netherlands. The Church of England was again the official Church.\n- **1665**: a major outbreak of **plague** in London.\n- **1666**: the **Great Fire of London** destroyed much of the city, including **St Paul's Cathedral**, rebuilt by **Sir Christopher Wren**. **Samuel Pepys** described these events in his **diary**.\n- **1679**: the **Habeas Corpus Act** – Latin for \"you must present the person in court\" – guaranteed **no one could be held prisoner unlawfully**.\n- The **Royal Society**, **the oldest surviving scientific society in the world**, was formed. Early members included **Edmund Halley** (Halley's Comet) and **Isaac Newton**.\n\n> Isaac Newton (1643–1727) :: Born in **Lincolnshire**, studied at **Cambridge**. His **Principia Mathematica** showed how **gravity** applied to the whole universe. He also discovered that **white light is made up of the colours of the rainbow**.\n\n## The Glorious Revolution (1688)\nCharles II's brother **James II** (James VII of Scotland) was a **Roman Catholic**. When his son was born, a Catholic succession seemed likely. In **1688** Protestants invited **William of Orange**, the Protestant ruler of the Netherlands and husband of James's daughter **Mary**, to take the throne. There was **no fighting** in England, so it was called the **Glorious Revolution**. William and Mary ruled jointly.\n\nJames tried to win back the throne through Ireland but was defeated at the **Battle of the Boyne in 1690** (still celebrated by some in Northern Ireland). A Scottish rising was defeated at **Killiecrankie**; the **MacDonalds of Glencoe** were massacred for being late to swear loyalty. James's supporters became known as **Jacobites**.\n\n@remember\n- **1603** James VI of Scotland becomes **James I** of England; **King James Bible**\n- **Plantations** – Protestant settlers in **Ulster**\n- **Divine Right of Kings** – James I and Charles I\n- **1642** Civil War: **Cavaliers** (king) v **Roundheads** (Parliament); king beaten at **Marston Moor** and **Naseby**\n- **1649** Charles I executed; republic = **the Commonwealth**; **Cromwell** = **Lord Protector**\n- **1660** Restoration of **Charles II**; **1665** plague; **1666** Great Fire; **Wren** rebuilt St Paul's; **Pepys'** diary\n- **1679 Habeas Corpus Act** – no unlawful imprisonment\n- **Royal Society** – oldest surviving scientific society; **Newton** – gravity\n- **1688 Glorious Revolution** – **William of Orange** replaces James II; **1690** Battle of the **Boyne**\n- James's supporters = **Jacobites**\n\n@section Union, Enlightenment and industry\n## Constitutional monarchy\nAt William and Mary's coronation a Declaration of Rights was read. The **Bill of Rights (1689)** confirmed **the rights of Parliament and the limits of the king's power**: the monarch must be **Protestant**, could not raise taxes without Parliament, and a new Parliament had to be elected at least every **three years** (later seven, **now five**).\n\nMonarchs now needed ministers with a majority in Parliament. The two main groups were the **Whigs** and the **Tories** (the Conservatives are still called Tories) – **the beginning of party politics**. From **1695** newspapers no longer needed a government licence: the start of a **free press**.\n\nThis was **not yet democracy**: only men who **owned property** could vote and **no women** could. Constituencies controlled by one wealthy family were **\"pocket boroughs\"**; those with hardly any voters were **\"rotten boroughs\"**.\n\n## Newcomers\nThe **first Jews since the Middle Ages** settled in London in **1656**. Between **1680 and 1720**, **Huguenots** – French **Protestants** persecuted for their religion – came as refugees; many were skilled scientists, bankers and weavers.\n\n## Great Britain is born (1707)\nQueen Anne had no surviving children. The **Act of Union** (the **Treaty of Union** in Scotland) of **1707** created **the Kingdom of Great Britain**. Scotland kept its own **legal and education systems** and **Presbyterian Church**.\n\n## The first Prime Minister\nWhen Anne died in **1714**, Parliament chose **George I**, a **German** and her nearest Protestant relative. He did not speak good English, so relied on his ministers. The most important became known as **Prime Minister** – the first was **Sir Robert Walpole (1721–1742)**.\n\n## Bonnie Prince Charlie\nIn **1745** **Charles Edward Stuart (Bonnie Prince Charlie)**, grandson of James II, landed in Scotland supported by Highland clansmen. He was defeated at the **Battle of Culloden in 1746**. The clans lost power, and in the **Highland Clearances** landlords destroyed small farms (**crofts**) to make way for sheep and cattle; many Scots emigrated to North America.\n\n> Robert Burns (1759–96) :: Known as **\"The Bard\"**. Scottish poet who wrote in **Scots**, English with Scottish words, and standard English. Best known for **Auld Lang Syne**, sung at New Year (**Hogmanay** in Scotland).\n\n## The Enlightenment\nIn the **18th century** new ideas about politics, philosophy and science developed. Many great thinkers were **Scottish**: **Adam Smith** (economics), **David Hume** (human nature) and **James Watt** (steam power). A key principle: everyone has the right to their own political and religious beliefs.\n\n## The Industrial Revolution\nIn the **18th and 19th centuries** Britain became **the first country to industrialise on a large scale**, thanks to machinery and **steam power**. The **Bessemer process** for mass-producing **steel** boosted shipbuilding and railways. **Canals** linked factories to towns and ports. Working conditions were very poor, and **children** worked too.\n\n> Richard Arkwright (1732–92) :: Trained as a **barber**. Improved the **carding machine** for preparing fibres, developed **horse-driven spinning mills** and later used **steam power**. Remembered for running his factories **efficiently and profitably**.\n\n> Sake Dean Mahomet (1759–1851) :: From **Bengal**, India. In **1810** he opened the **Hindoostane Coffee House** in London – **the first curry house in Britain**. He and his wife also introduced **\"shampooing\"** (Indian head massage).\n\nBritain expanded overseas: **Captain James Cook** mapped the coast of **Australia**, Britain gained **Canada**, and the **East India Company** took control of large parts of **India**.\n\n## The slave trade\nBritish prosperity was partly built on the **slave trade**. Slavery was illegal within Britain itself, but slaves from **West Africa** were shipped in terrible conditions to work on plantations in America and the Caribbean.\n\nThe **Quakers** set up the **first formal anti-slavery groups**. **William Wilberforce**, an evangelical Christian MP, helped turn public opinion. In **1807** trading slaves in British ships or ports became illegal, and in **1833** the **Emancipation Act** abolished **slavery throughout the British Empire**. Afterwards **2 million Indian and Chinese workers** replaced the freed slaves.\n\n## America and France\nThe American colonies objected to British taxes: **\"no taxation without representation\"**. In **1776** **13 colonies declared independence**, and Britain recognised it in **1783**.\n\nBritain fought France and Napoleon. At the **Battle of Trafalgar (1805)**, **Admiral Nelson** defeated the French and Spanish fleets but was killed. **Nelson's Column** is in Trafalgar Square, and his ship **HMS Victory** is in **Portsmouth**. In **1815** the **Duke of Wellington** – \"the **Iron Duke**\", later Prime Minister – defeated Napoleon at the **Battle of Waterloo**.\n\n## The Union Flag\nIn **1801** Ireland was united with Great Britain (Act of Union **1800**), creating the **United Kingdom of Great Britain and Ireland**. The **Union Flag** (Union Jack) combines three crosses:\n- **St George** (England) – **red cross on white**\n- **St Andrew** (Scotland) – **diagonal white cross on blue**\n- **St Patrick** (Ireland) – **diagonal red cross on white**\n\nThe **Welsh dragon** is not on it because Wales was already united with England when the first Union Flag was created in **1606**.\n\n@remember\n- **1689 Bill of Rights** – rights of Parliament, limits on the monarch, monarch must be **Protestant**\n- **Whigs and Tories** – start of party politics; free press from **1695**\n- **Pocket boroughs** (one family) and **rotten boroughs** (hardly any voters)\n- **Huguenots** – French Protestant refugees (1680–1720)\n- **1707 Act of Union** creates **Great Britain**; Scotland keeps its law, education and Church\n- **Robert Walpole** – first Prime Minister (1721–42)\n- **1746 Culloden** – Bonnie Prince Charlie defeated; **Highland Clearances**\n- **Robert Burns** – \"The Bard\", Auld Lang Syne\n- Enlightenment: **Adam Smith, David Hume, James Watt**\n- **Arkwright** – efficient factories; **Sake Dean Mahomet** – first curry house (1810)\n- **1807** slave trade banned; **1833 Emancipation Act**; **Wilberforce** and the **Quakers**\n- **1776** American independence; **1805 Trafalgar** (Nelson); **1815 Waterloo** (Wellington)\n- **1801** Union with Ireland; Union Flag = **St George, St Andrew, St Patrick**\n\n@section The Victorian age and the Empire\n**Queen Victoria** became queen in **1837 aged 18** and reigned until **1901** – almost **64 years**. Britain's power grew abroad and the **middle classes** became more important at home.\n\n## The British Empire\nThe Empire grew to cover **India, Australia and large parts of Africa** – **the largest empire the world has ever seen**, with more than **400 million people**. Between **1853 and 1913** as many as **13 million** British citizens emigrated. Between **1870 and 1914** around **120,000 Russian and Polish Jews** came to Britain to escape persecution.\n\n## Trade, industry and transport\nBritain promoted **free trade**: the **Corn Laws**, which stopped cheap grain being imported, were **repealed in 1846**. In **1847** the working day for **women and children** was limited to **10 hours**.\n\n**George and Robert Stephenson** pioneered the **railway engine**. Britain produced **more than half the world's iron, coal and cotton cloth**. In **1851** the **Great Exhibition** opened in **Hyde Park** in the **Crystal Palace**, a building of steel and glass.\n\n> Isambard Kingdom Brunel (1806–59) :: Engineer from **Portsmouth** who built tunnels, bridges, railways and ships. He built the **Great Western Railway**, the first major railway in Britain, from **Paddington** to the south-west, West Midlands and Wales.\n\n## The Crimean War (1853–56)\nBritain fought with **Turkey and France against Russia**. It was **the first war extensively covered by the media**. Queen Victoria introduced the **Victoria Cross** medal for valour.\n\n> Florence Nightingale (1820–1910) :: Born in **Italy** to English parents. Nursed soldiers in **Turkey** during the Crimean War and cut the death rate. In **1860** she founded the **Nightingale Training School** at **St Thomas' Hospital**, London. Regarded as **the founder of modern nursing**.\n\n## Ireland\nIn the mid-19th century the **potato crop failed** and Ireland suffered a **famine**: **a million died** and **a million and a half emigrated**. The nationalist movement grew: the **Fenians** wanted full independence, while **Charles Stuart Parnell** wanted **Home Rule** (Ireland's own parliament within the UK).\n\n## The right to vote\n- **1832 Reform Act**: greatly increased voters, **abolished pocket and rotten boroughs** and gave seats to towns and cities. Voting was still based on **property**.\n- The **Chartists** campaigned for votes for the working classes.\n- **1867 Reform Act**: more urban seats and a lower property requirement – but most men and **no women** could vote.\n\nUntil **1870** a married woman's earnings and property belonged to her husband; Acts in **1870 and 1882** let wives keep them. Women campaigning for the vote became known as **suffragettes**.\n\n> Emmeline Pankhurst (1858–1928) :: Born in **Manchester**. Set up the **Women's Franchise League (1889)** and helped found the **Women's Social and Political Union (WSPU)** in **1903**, the first \"suffragettes\". They chained themselves to railings, smashed windows and went on hunger strike. In **1918** women **over 30** got the vote; in **1928**, shortly before her death, women got the vote at **21, the same as men**.\n\n## The future of the Empire\nThe **Boer War (1899–1902)** in South Africa against Dutch settlers (**Boers**) made people question the Empire. Over the 20th century there was a mostly orderly transition from **Empire to Commonwealth**.\n\n> Rudyard Kipling (1865–1936) :: Born in **India**. Believed the British Empire was **a force for good**. Won the **Nobel Prize in Literature (1907)**. Wrote the **Just So Stories**, **The Jungle Book** and the poem **If**, often voted among the UK's favourite poems.\n\n\" If you can keep your head when all about you\n\" Are losing theirs and blaming it on you…\n\"— If, Rudyard Kipling\n\n@remember\n- **Queen Victoria** reigned **1837–1901** (almost **64 years**)\n- Empire: largest ever, **400 million+** people\n- **1846** Corn Laws repealed; **1847** 10-hour day for women and children\n- **Stephensons** – railway engine; **Brunel** – Great Western Railway\n- **1851 Great Exhibition** – Crystal Palace, Hyde Park\n- **Crimean War 1853–56** – v Russia; **Victoria Cross**; **Florence Nightingale**\n- Irish **potato famine**; **Home Rule** (Parnell) v independence (Fenians)\n- **1832 Reform Act** – ended pocket and rotten boroughs; **Chartists**; **1867** Reform Act\n- **Emmeline Pankhurst** – WSPU suffragettes; women vote **1918 (over 30)**, **1928 (at 21)**\n- **Boer War 1899–1902**; **Kipling** – Jungle Book, Nobel Prize 1907\n\n@section The First World War and after\n## A time of optimism and reform\nIn the early 20th century Britain was a global superpower. Reforms included **financial help for the unemployed, old-age pensions and free school meals**, and **MPs were paid a salary for the first time**.\n\n## The First World War (1914–18)\nOn **28 June 1914 Archduke Franz Ferdinand** of Austria was assassinated, triggering the war. Britain was among the **Allied Powers** (with France, Russia, Japan, Belgium, Serbia and later Greece, Italy, Romania and the USA). They fought the **Central Powers** – mainly **Germany, Austria-Hungary, the Ottoman Empire** and later **Bulgaria**.\n\nThe whole Empire took part: more than **a million Indians** fought for Britain (around **40,000** were killed). Britain suffered over **2 million casualties**. The attack on the **Somme in July 1916** caused about **60,000 British casualties on the first day**.\n\nThe war ended at **11.00 am on 11 November 1918** with victory for Britain and its allies.\n\n## The partition of Ireland\nIn **1913** the government promised **Home Rule** for Ireland, opposed by Protestants in the north. The war postponed it. In **1916** Irish nationalists rose up in Dublin: the **Easter Rising**. Its leaders were executed and a guerrilla war followed.\n\nA peace treaty was signed in **1921**, and in **1922 Ireland became two countries**: the six mainly Protestant counties in the north stayed in the UK as **Northern Ireland**; the rest became the **Irish Free State**, which became a **republic in 1949**. The later conflict over this split is known as **\"the Troubles\"**.\n\n## Between the wars\nIn **1929** the world entered the **Great Depression**. Heavy industries like **shipbuilding** suffered mass unemployment, while new **car and aviation** industries grew. **Car ownership doubled from 1 to 2 million** between 1930 and 1939. Writers **Graham Greene** and **Evelyn Waugh** and economist **John Maynard Keynes** were prominent. The **BBC** began radio broadcasts in **1922** and the **world's first regular television service in 1936**.\n\n@remember\n- Pre-war reforms: pensions, **free school meals**, **MPs paid**\n- WWI **1914–18**, triggered by the killing of **Archduke Franz Ferdinand**\n- Allies v **Central Powers** (Germany, Austria-Hungary, Ottoman Empire, Bulgaria)\n- **Somme 1916** – **60,000** British casualties on day one\n- Ended **11.00 am, 11 November 1918**\n- **1916 Easter Rising**; **1922** Ireland split; Irish Free State a republic **1949**; \"the **Troubles**\"\n- **1929** Great Depression; car and aviation industries grew\n- BBC radio **1922**; world's first regular TV service **1936**\n\n@section The Second World War\n**Adolf Hitler** came to power in Germany in **1933**. When he **invaded Poland in 1939**, **Britain and France declared war**.\n\nThe **Axis powers** were **Germany, Italy and Japan**. The main Allies were the **UK, France, Poland, Australia, New Zealand, Canada and the Union of South Africa**.\n\n## 1940: Britain stands alone\nAs Germany advanced through France in **1940**, **Winston Churchill** became Prime Minister.\n\n- **Dunkirk**: civilian volunteers in small boats helped the Navy rescue **more than 300,000 men** from the beaches – the origin of **\"the Dunkirk spirit\"**.\n- From **June 1940 until June 1941** Britain and the Empire **stood almost alone** against Nazi Germany.\n- **The Battle of Britain** (summer **1940**): the RAF won the battle for the skies with **Spitfires and Hurricanes**, designed and built in Britain.\n- **The Blitz**: German bombing of cities at night. **Coventry** was almost totally destroyed, as was much of London's **East End** – hence **\"the Blitz spirit\"**.\n\n> Winston Churchill (1874–1965) :: Son of a politician; a soldier and journalist before becoming a **Conservative MP in 1900**. PM from **May 1940**; he refused to surrender. He **lost the 1945 election** but returned as PM in **1951**. Given a **state funeral** in **1965**, and voted **the greatest Briton of all time** in **2002**.\n\n\" I have nothing to offer but blood, toil, tears and sweat\n\"— First speech as PM, 1940\n\" We shall fight on the beaches … we shall never surrender\n\"— After Dunkirk, 1940\n\" Never in the field of human conflict was so much owed by so many to so few\n\"— During the Battle of Britain, 1940\n\n## Victory\nJapan defeated the British in **Singapore** and occupied **Burma**. The **USA entered the war** after Japan bombed **Pearl Harbor in December 1941**. Hitler's invasion of the **Soviet Union** (1941) failed with huge losses.\n\nOn **6 June 1944**, allied forces landed in **Normandy** – **D-Day**. Germany was defeated in **May 1945**. The war against Japan ended in **August 1945** after the USA dropped atom bombs on **Hiroshima and Nagasaki**. Scientists led by **Ernest Rutherford** (Manchester, then Cambridge) were first to **split the atom** and took part in the **Manhattan Project**.\n\n> Alexander Fleming (1881–1955) :: Born in **Scotland**. Discovered **penicillin in 1928** while researching flu. **Howard Florey and Ernst Chain** developed it into a usable drug, mass-produced by the 1940s. **Nobel Prize in Medicine (1945)**.\n\n@remember\n- **1939** – Hitler invades **Poland**; Britain and France declare war\n- Axis = **Germany, Italy, Japan**\n- **Churchill** PM from **1940**\n- **Dunkirk** – 300,000+ rescued; **Battle of Britain** – Spitfires and Hurricanes; **the Blitz** – Coventry\n- USA joined after **Pearl Harbor (1941)**\n- **D-Day 6 June 1944** – Normandy; Germany defeated **May 1945**; Japan **August 1945**\n- **Rutherford** – split the atom; **Fleming** – penicillin (1928)\n- Churchill voted **greatest Briton (2002)**\n\n@section Britain since 1945\n## The welfare state\nIn **1945** the British people elected a **Labour** government under **Clement Attlee**, who introduced the welfare state outlined in the **Beveridge Report**. In **1948** **Aneurin (Nye) Bevan**, Minister for Health, led the creation of the **National Health Service (NHS)**, free at the point of use. Railways, coal mines and gas, water and electricity were **nationalised**.\n\nIn **1947** independence was granted to **nine countries**, including **India, Pakistan and Ceylon (Sri Lanka)**. The UK developed an **atomic bomb** and joined **NATO**.\n\n> Clement Attlee (1883–1967) :: Born in London; a barrister who did social work in East London. **Churchill's Deputy PM** in the wartime coalition, then **PM 1945–51**. Nationalised major industries, created the **NHS** and led Labour for **20 years**.\n\n> William Beveridge (1879–1963) :: Liberal economist and social reformer. His **1942 report** – the **Beveridge Report** – called for fighting five **\"Giant Evils\": Want, Disease, Ignorance, Squalor and Idleness**. It was the basis of the **modern welfare state**.\n\n> R A Butler (1902–82) :: Conservative MP responsible for education from 1941. The **Education Act 1944** (\"**The Butler Act**\") introduced **free secondary education** in England and Wales, and the split between **primary and secondary** schools.\n\n> Dylan Thomas (1914–53) :: **Welsh** poet. Wrote the radio play **Under Milk Wood** and the poem **Do Not Go Gentle into That Good Night**. Died aged 39 in New York; memorials in his birthplace **Swansea**.\n\nThere was a **Conservative** government from **1951 to 1964**. PM **Harold Macmillan** made the **\"wind of change\"** speech about decolonisation.\n\n## Migration after the war\nLabour shortages led the government to invite workers from **Ireland and Europe**, and in **1948** from the **West Indies**. In the 1950s buses recruited in the West Indies, and textile and engineering firms recruited in **India and Pakistan**. Migration fell in the **late 1960s** when new laws restricted it. In the early 1970s Britain admitted **28,000 people of Indian origin** forced to leave **Uganda**.\n\n## The Swinging Sixties\nThe **1960s** brought growth in fashion, cinema and pop music (**The Beatles** and **The Rolling Stones**). Laws on **divorce and abortion** were liberalised, and new laws gave women **equal pay** and banned sex discrimination at work.\n\n## The 1970s\nThe post-war boom ended. Strikes caused conflict between the **trade unions** and government. In Northern Ireland, the Parliament was **suspended in 1972** and direct rule from London began; some **3,000** people died in the violence after **1969**.\n\n> Mary Peters (1939–) :: Born in Manchester, moved to **Northern Ireland**. Won **Olympic gold in the pentathlon in 1972**, then promoted sport and tourism in NI. Made a **Dame in 2000**.\n\n## Europe\nThe **EEC** was formed in **1957** by **West Germany, France, Belgium, Italy, Luxembourg and the Netherlands**. The UK **joined in 1973**.\n\n## Thatcher and the Conservatives (1979–1997)\n> Margaret Thatcher (1925–2013) :: A grocer's daughter from **Grantham, Lincolnshire**; trained as a chemist and lawyer. **Britain's first woman Prime Minister (1979–1990)** and the **longest-serving PM of the 20th century**. **Privatised** nationalised industries, limited trade union power and worked closely with US President **Ronald Reagan**.\n\nIn **1982 Argentina invaded the Falkland Islands**; a British naval taskforce recovered them. Traditional industries like shipbuilding and coal mining declined. **John Major** followed Thatcher and helped establish the **Northern Ireland peace process**.\n\n> Roald Dahl (1916–90) :: Born in **Wales** to **Norwegian** parents; served in the RAF. Wrote **Charlie and the Chocolate Factory** and **George's Marvellous Medicine**.\n\n## Labour (1997–2010)\n**Tony Blair**'s government created the **Scottish Parliament** and the **Welsh Assembly** (both **1999**). In Northern Ireland the **Good Friday Agreement** was signed in **1998**; the NI Assembly was elected in **1999**, suspended in **2002** and restored in **2007**. **Gordon Brown** became PM in **2007**.\n\nIn the **1990s** Britain helped liberate **Kuwait** (after Iraq invaded in **1990**) and acted in the former **Yugoslavia**. Since **2000**, British forces have fought terrorism in **Afghanistan and Iraq**; combat troops left Iraq in **2009**.\n\n## Recent governments\n- **2010–2015**: the first **coalition** since 1974 – **Conservatives and Liberal Democrats**, with **David Cameron** as PM.\n- **2015–2024**: **Conservative** governments under **Cameron, Theresa May, Boris Johnson, Liz Truss and Rishi Sunak**, including the **2016 EU referendum (Brexit)** and the COVID-19 pandemic.\n- **2024**: **Labour**, led by **Keir Starmer**, won a majority at the general election.\n\n@remember\n- **1945** Labour – **Attlee**; **1948 NHS** led by **Nye Bevan**\n- **Beveridge Report** – Want, Disease, Ignorance, Squalor, Idleness\n- **1944 Education Act (Butler)** – free secondary education\n- **1947** independence for India, Pakistan, Ceylon\n- **1948** West Indians invited to work; **28,000** Ugandan Asians admitted in the 1970s\n- **Swinging Sixties** – divorce and abortion laws liberalised, equal pay\n- **1973** UK joins the EEC\n- **Thatcher** – first woman PM, **1979–90**; **1982 Falklands**\n- **1998 Good Friday Agreement**; **1999** Scottish Parliament and Welsh Assembly\n- **2010** coalition (Cameron); **2016** Brexit vote; **2024** Labour (Starmer)\n\n@section Great British inventions\nBritain gave the world many 20th-century inventions. You **do not need to remember birth and death dates** – focus on **who invented what**.\n\n| Television | **John Logie Baird** (Scottish), 1920s. First TV broadcast London–Glasgow in **1932**.\n| Radar | **Sir Robert Watson-Watt** (Scottish). First successful test **1935**.\n| Radio telescope | **Sir Bernard Lovell** built it at **Jodrell Bank**, Cheshire – for years the biggest in the world.\n| Turing machine | **Alan Turing**, 1930s – a theoretical device that shaped modern computing.\n| Insulin | **John MacLeod** (Scottish) was **co-discoverer**; used to treat diabetes.\n| DNA structure | Discovered in **1953** at London and Cambridge; **Francis Crick** shared the Nobel Prize.\n| Jet engine | **Sir Frank Whittle**, an RAF engineer, **1930s**.\n| Hovercraft | **Sir Christopher Cockerell**, **1950s**.\n| Concorde | Developed by **Britain and France** – the only supersonic passenger aircraft. First flew **1969**, retired **2003**.\n| Harrier jump jet | Designed in the UK – can **take off vertically**.\n| ATM (cashpoint) | **James Goodfellow**, 1960s. First used by **Barclays in Enfield, 1967**.\n| IVF | **Sir Robert Edwards** and **Patrick Steptoe**. First \"test-tube baby\" born in **Oldham, 1978**.\n| Cloning | **Sir Ian Wilmut** and **Keith Campbell** cloned **Dolly the sheep** in **1996** – the first cloned mammal.\n| MRI scanner | **Sir Peter Mansfield** was **co-inventor**.\n| World Wide Web | **Sir Tim Berners-Lee**. First used **25 December 1990**.\n\n@remember\n- **TV** – John Logie Baird; **radar** – Robert Watson-Watt\n- **Jet engine** – Frank Whittle; **hovercraft** – Christopher Cockerell\n- **ATM** – James Goodfellow (1967, Barclays, Enfield)\n- **World Wide Web** – Tim Berners-Lee (1990)\n- **Insulin** – John MacLeod; **DNA structure** – 1953, Francis Crick\n- **MRI** – Peter Mansfield; **IVF** – Edwards and Steptoe (1978)\n- **Dolly the sheep** – first cloned mammal (1996)\n- **Concorde** – with France; **Harrier jump jet** – vertical take-off\n- **Jodrell Bank** radio telescope – Bernard Lovell; **Turing machine** – Alan Turing\n", "@title A modern, thriving society\n@subtitle People, faith, festivals, sport, culture and places\n@intro Lots of names and facts here. Questions often ask **who wrote, painted or won what**, **when festivals happen**, **which sports events are where**, and **where landmarks are**. Learn the patron saints' days and the population figures too.\n\n@section The UK today\nThe UK is located in the **north west of Europe**. The longest distance on the mainland is from **John O'Groats** (north coast of Scotland) to **Land's End** (south-west England): about **870 miles (1,400 km)**.\n\nPost-war immigration means **nearly 10%** of the population has a parent or grandparent born outside the UK.\n\n## Capital cities\n| UK | **London**\n| Scotland | **Edinburgh**\n| Wales | **Cardiff**\n| Northern Ireland | **Belfast**\n\nOther major cities: in **England** – Birmingham, Liverpool, Leeds, Sheffield, Bristol, Manchester, Bradford, Newcastle upon Tyne, Plymouth, Southampton, Norwich; in **Wales** – **Swansea** and **Newport**; in **Scotland** – **Glasgow, Dundee** and **Aberdeen**.\n\n## Money\nThe currency is the **pound sterling (£)**; there are **100 pence** in a pound.\n- Coins: **1p, 2p, 5p, 10p, 20p, 50p, £1 and £2**\n- Notes: **£5, £10, £20 and £50**\n\n**Scotland and Northern Ireland** have their own banknotes. They are **valid everywhere in the UK**, but shops **do not have to accept them**.\n\n## Languages\nEnglish has many accents and dialects. In **Wales**, many people speak **Welsh**, which is taught in schools and universities. In **Scotland**, **Gaelic** is spoken in parts of the **Highlands and Islands**. In **Northern Ireland**, some people speak **Irish Gaelic**.\n\n## Population\n| 1600 | Just over **4 million**\n| 1700 | **5 million**\n| 1801 | **8 million**\n| 1851 | **20 million**\n| 1901 | **40 million**\n| 1951 | **50 million**\n| 1998 | **57 million**\n| 2005 | Just under **60 million**\n| 2010 | Just over **62 million**\n| 2022 | About **67.6 million**\n\nGrowth has been faster recently, due to **migration and longer life expectancy**. The population is unevenly spread: **England about 84%**, **Scotland just over 8%**, **Wales about 5%** and **Northern Ireland less than 3%**.\n\nPeople are **living longer** than ever – there are a **record number aged 85 and over**, which affects the cost of pensions and health care.\n\n## An equal and diverse society\nThe population is **ethnically diverse**, especially in large cities like London. The most common ethnic description chosen in surveys is **white**; other significant groups are **Asian, black and mixed** descent.\n\nMen and women have **equal rights** to work, own property, marry and divorce, and married parents are **equally responsible** for their children. Women make up **about half the workforce**, girls leave school with **better qualifications** than boys on average, and **more women than men study at university**.\n\n@remember\n- Located in the **north west of Europe**; John O'Groats to Land's End ≈ **870 miles**\n- Capitals: **London, Edinburgh, Cardiff, Belfast**\n- Scottish and NI banknotes are **valid** everywhere but shops **don't have to accept** them\n- **Welsh** in Wales; **Gaelic** in the Highlands and Islands; **Irish Gaelic** in NI\n- Population: **just over 62 million (2010)**; about **67.6 million (2022)**\n- **England 84%, Scotland 8%, Wales 5%, NI under 3%**\n- Women are **half the workforce**; more women than men at **university**\n\n@section Religion and patron saints\nThe UK is historically a **Christian** country. In the **2009 Citizenship Survey**:\n| Christian | **70%**\n| No religion | **21%**\n| Muslim | **4%**\n| Hindu | **2%**\n| Sikh | **1%**\n| Jewish or Buddhist | Less than **0.5%** each\n| Other religion | **2%**\n\nEveryone has the legal right to **choose their religion, or no religion**.\n\n## The Church of England\nIn England there is a **constitutional link between Church and state**. The **Church of England** (called the **Anglican Church** in other countries and the **Episcopal Church** in Scotland and the USA) is a **Protestant** Church, existing since the **Reformation in the 1530s**.\n\n- The **monarch is the head** of the Church of England.\n- The **spiritual leader** is the **Archbishop of Canterbury**.\n- The monarch can select the Archbishop and senior officials, but usually the choice is made by **the Prime Minister and a Church committee**.\n- Several Church of England **bishops sit in the House of Lords**.\n\n## Other Churches\nThe national Church of Scotland is the **Church of Scotland**, a **Presbyterian** Church governed by **ministers and elders**. Its chairperson, the **Moderator**, is appointed for **one year** only.\n\nThere is **no established Church in Wales or Northern Ireland**. Other Protestant groups include **Baptists, Methodists, Presbyterians and Quakers**. The biggest other Christian denomination is **Roman Catholic**.\n\n## Patron saints' days\n| 1 March | **St David** – Wales\n| 17 March | **St Patrick** – Northern Ireland\n| 23 April | **St George** – England\n| 30 November | **St Andrew** – Scotland\n\nOnly **Scotland and Northern Ireland** have their patron saint's day as an **official holiday**.\n\n## National flowers\n| England | **Rose**\n| Scotland | **Thistle**\n| Wales | **Daffodil**\n| Northern Ireland | **Shamrock**\n\n@remember\n- **70% Christian**, **21% no religion**, Muslim 4%, Hindu 2%, Sikh 1%\n- Church of England: **monarch is head**, **Archbishop of Canterbury** spiritual leader; bishops in the **Lords**\n- **Church of Scotland**: Presbyterian; **Moderator** serves **one year**\n- **No established Church** in Wales or Northern Ireland\n- **St David 1 Mar**, **St Patrick 17 Mar**, **St George 23 Apr**, **St Andrew 30 Nov**\n- Only **Scotland and NI** have their saint's day as an official holiday\n- Flowers: **rose** (England), **thistle** (Scotland), **daffodil** (Wales), **shamrock** (NI)\n\n@section Festivals and traditions\n## Christian festivals\n- **Christmas Day, 25 December** – the birth of Jesus Christ; a public holiday. Many go to church on **Christmas Eve (24 December)**. Traditional food: **roast turkey, Christmas pudding and mince pies**. Children believe **Father Christmas (Santa Claus)** brings presents.\n- **Boxing Day, 26 December** – a **public holiday**.\n- **Easter** (March or April) – marks the death of Jesus on **Good Friday** and his rising on **Easter Sunday**. **Good Friday and Easter Monday** are public holidays. **Easter eggs** symbolise new life.\n- **Lent** – the **40 days before Easter**, when people often give something up. It begins on **Ash Wednesday**. The day before, **Shrove Tuesday**, is **Pancake Day**.\n\n## Other religious festivals\n- **Diwali** – October or November, **five days**, the **Festival of Lights**. Celebrated by **Hindus and Sikhs**; it celebrates **the victory of good over evil**. Famous celebration in **Leicester**.\n- **Hannukah** – November or December, **eight days**. **Jewish**; a candle is lit each day on a **menorah**.\n- **Eid al-Fitr** – celebrates **the end of Ramadan**, the month Muslims fast.\n- **Eid ul Adha** – remembers that **Ibrahim** was willing to sacrifice his son. Animals sacrificed in Britain must be killed in a **slaughterhouse**.\n- **Vaisakhi** – **14 April**, a **Sikh** festival celebrating the founding of the **Khalsa**.\n\n## Other festivals and traditions\n| 1 January | **New Year** – public holiday. In Scotland 31 December is **Hogmanay** and **2 January** is also a holiday.\n| 14 February | **Valentine's Day** – lovers exchange cards and gifts.\n| 1 April | **April Fool's Day** – jokes **until midday**.\n| March/April | **Mothering Sunday** – the Sunday **three weeks before Easter**.\n| June | **Father's Day** – the **third Sunday in June**.\n| 31 October | **Halloween** – roots in a **pagan** festival marking the start of winter; \"trick or treat\" and pumpkin lanterns.\n| 5 November | **Bonfire Night** – fireworks remembering the failed plot of **1605**, when **Guy Fawkes** and Catholics tried to blow up Parliament and the Protestant king.\n| 11 November | **Remembrance Day** – remembers those who died fighting for the UK. People wear **poppies**; a **two-minute silence at 11.00 am**; wreaths laid at the **Cenotaph** in Whitehall.\n\n## Bank holidays\nPublic holidays with **no religious significance**, when banks and many businesses close: **early May, late May/early June, and August**. In Northern Ireland the **Battle of the Boyne** anniversary in **July** is also a holiday.\n\n@remember\n- **Boxing Day 26 Dec**; **Good Friday and Easter Monday** are public holidays\n- **Lent** = 40 days before Easter; **Shrove Tuesday** = Pancake Day; **Ash Wednesday** starts Lent\n- **Diwali** – Hindus and Sikhs, Festival of Lights, **Leicester**\n- **Hannukah** – Jewish, 8 days, **menorah**; **Eid al-Fitr** – end of Ramadan\n- **Vaisakhi** – Sikh, **14 April**, the **Khalsa**\n- **Hogmanay** – 31 Dec in Scotland; **2 January** also a holiday there\n- **Bonfire Night 5 Nov** – Guy Fawkes, **1605**\n- **Remembrance Day 11 Nov** – poppies, silence at **11 am**, **Cenotaph**\n- Bank holidays have **no religious significance**\n\n@section Sport\nMany famous sports began in Britain, including **cricket, football, lawn tennis, golf and rugby**. Major stadiums include **Wembley Stadium** (London) and the **Millennium Stadium** (Cardiff).\n\n## The Olympics and Paralympics\nThe UK has hosted the **Olympic Games three times: 1908, 1948 and 2012**. The main
